name: Deploy → panprstenu.cz (live)

# LIVE deploy SE NESPOUŠTÍ automaticky z push.
# Spouští se ručně přes `gh workflow run deploy-live.yml --ref main`
# nebo z GitHub Actions UI. Důvod: WebGlobe SFTP má per-IP rate-limit,
# když LIVE + NEW běží paralelně, jeden z nich timeoutne. Manuální
# trigger umožní pustit LIVE až po stabilizaci NEW (preprod). Toto je
# i klasický production flow — push do main aktualizuje preprod, ostrá
# doména se nahazuje cíleně.
on:
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + SFTP upload (LIVE)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # LIVE = ostrá produkční doména www.panprstenu.cz.
      # `npm run build` (build-deploy.mjs) staví DVĚ varianty:
      #   public_html/     = LIVE build (indexovatelný, bez noindex)
      #   public_html_new/ = NEW preprod build (noindex + Disallow)
      # dist/ po doběhu pipeline obsahuje POSLEDNÍ build = noindex variantu,
      # proto se deployuje public_html/, NIKDY dist/.
      - name: Build (Astro, obě varianty přes build-deploy.mjs)
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # SFTP přes port 222. FTP účet `git.panprstenu.cz` má přístup do
      # /home/html/panprstenu.cz/public_html (DocumentRoot ostré domény).
      #
      # Stejná retry strategie jako NEW deploy — WebGlobe SFTP občas
      # vrací max-retries exceeded; 3 pokusy s 60s pauzou.
      #
      # --exclude-glob 'panprstenu.cz/': v docrootu leží cizí adresář
      # `panprstenu.cz`, který SFTP účet nemůže smazat ("Directory is not
      # empty") a shazoval --delete fázi. Mirror ho proto ignoruje.
      - name: Deploy via SFTP (panprstenu.cz:222)
        env:
          LFTP_USER: ${{ secrets.WEBGLOBE_FTP_LIVE_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.WEBGLOBE_FTP_LIVE_PASSWORD }}
          LFTP_HOST: ${{ secrets.WEBGLOBE_FTP_HOST }}
          LFTP_REMOTE_PATH: ${{ secrets.WEBGLOBE_FTP_LIVE_PATH }}
        run: |
          set +e  # nepadat na první lftp chybě
          for attempt in 1 2 3; do
            echo "===== SFTP upload — pokus $attempt/3 ====="
            lftp -u "$LFTP_USER","$LFTP_PASSWORD" -p 222 sftp://$LFTP_HOST <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 5
          set net:reconnect-interval-base 30
          set net:timeout 60
          mirror -R --delete --parallel=1 --verbose \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob .DS_Store \
            --exclude-glob 'google*.html' \
            --exclude-glob favicon.ico \
            --exclude-glob 'panprstenu.cz/' \
            ./public_html/ "$LFTP_REMOTE_PATH"
          bye
          EOF
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "===== SFTP upload OK na pokus $attempt ====="
              exit 0
            fi
            echo "===== SFTP upload selhal (exit $rc) — pauza 60s před dalším pokusem ====="
            sleep 60
          done
          echo "===== SFTP upload selhal i po 3 pokusech ====="
          exit 1
