name: Deploy → new.panprstenu.cz (preprod)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + SFTP upload (NEW)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEW prostředí slouží jako preprod (před DNS přepnutím produkce).
      # PUBLIC_NOINDEX=true → BaseLayout přidá <meta name="robots" content="noindex,nofollow">
      # Po DNS přepnutí na panprstenu.cz se přepne na false.
      - name: Build (Astro, noindex)
        env:
          PUBLIC_NOINDEX: "true"
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # SFTP přes port 222 podle CLAUDE.md §7. Podúčet `new@panprstenu.cz`
      # je jailed do /home/html/panprstenu.cz/_sub/new/.
      #
      # WebGlobe SFTP občas vrací `mirror: Fatal error: max-retries exceeded`
      # (transient timeout / reset). Wrappujeme tedy lftp v shell retry loopu
      # — 3 pokusy s 60s pauzou, plus zvýšené lftp interní retry parametry
      # (max-retries 5, interval-base 30, timeout 60). `--parallel=2` místo 4
      # snižuje souběžné connections, což méně triguje WebGlobe rate-limiting.
      - name: Deploy via SFTP (new.panprstenu.cz:222)
        env:
          LFTP_USER: ${{ secrets.WEBGLOBE_FTP_NEW_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.WEBGLOBE_FTP_NEW_PASSWORD }}
          LFTP_HOST: ${{ secrets.WEBGLOBE_FTP_HOST }}
          LFTP_REMOTE_PATH: ${{ secrets.WEBGLOBE_FTP_NEW_PATH }}
        run: |
          set +e  # nepadat na první lftp chybě
          for attempt in 1 2 3; do
            echo "===== SFTP upload — pokus $attempt/3 ====="
            lftp -u "$LFTP_USER","$LFTP_PASSWORD" -p 222 sftp://$LFTP_HOST <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 5
          set net:reconnect-interval-base 30
          set net:timeout 60
          mirror -R --delete --parallel=2 --verbose \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob .DS_Store \
            ./dist/ "$LFTP_REMOTE_PATH"
          bye
          EOF
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "===== SFTP upload OK na pokus $attempt ====="
              exit 0
            fi
            echo "===== SFTP upload selhal (exit $rc) — pauza 60s před dalším pokusem ====="
            sleep 60
          done
          echo "===== SFTP upload selhal i po 3 pokusech ====="
          exit 1
