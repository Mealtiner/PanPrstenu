name: Deploy → new.panprstenu.cz (preprod)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build + FTP upload (NEW)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEW prostředí slouží jako preprod (před DNS přepnutím produkce).
      # PUBLIC_NOINDEX=true → BaseLayout přidá <meta name="robots" content="noindex,nofollow">
      # — Google new.panprstenu.cz neindexuje. Po DNS přepnutí na panprstenu.cz
      # se v env nastaví false a redeployne.
      - name: Build (Astro, noindex)
        env:
          PUBLIC_NOINDEX: "true"
        run: npm run build

      # Deploy přímo z dist/ — žádný mirror přes web/new/.
      # Pravidlo z CLAUDE.md §9: ❌ Negenerovat web/dev/ ani web/new/ v repu.
      #
      # WebGlobe podúčet `new@panprstenu.cz` je jailed do
      # /home/html/panprstenu.cz/_sub/new/, takže `server-dir: /`.
      - name: Deploy to WebGlobe FTPS (new.panprstenu.cz)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.WEBGLOBE_FTP_HOST }}
          username: ${{ secrets.WEBGLOBE_FTP_NEW_USERNAME }}
          password: ${{ secrets.WEBGLOBE_FTP_NEW_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.WEBGLOBE_FTP_NEW_PATH }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
