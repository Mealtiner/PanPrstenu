name: Deploy → dev.panprstenu.cz (staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build + FTP upload (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro)
        env:
          PUBLIC_NOINDEX: "false"
        run: npm run build

      # Deploy přímo z dist/ — žádný mirror přes web/dev/.
      # Pravidlo z CLAUDE.md §9: ❌ Negenerovat web/dev/ ani web/new/ v repu.
      #
      # WebGlobe podúčet `dev@panprstenu.cz` je jailed do
      # /home/html/panprstenu.cz/_sub/dev/, takže `server-dir: /` znamená
      # root této subdomény (žádný prefix).
      #
      # Protocol ftps + port 21 — WebGlobe FTPS over TLS (explicit). Pokud
      # provider zpřístupní SFTP/22, lze přepnout na `protocol: sftp` a port 22.
      - name: Deploy to WebGlobe FTPS (dev.panprstenu.cz)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.WEBGLOBE_FTP_HOST }}
          username: ${{ secrets.WEBGLOBE_FTP_DEV_USERNAME }}
          password: ${{ secrets.WEBGLOBE_FTP_DEV_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.WEBGLOBE_FTP_DEV_PATH }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
