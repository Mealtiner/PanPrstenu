name: Deploy → dev.panprstenu.cz (staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build + SFTP upload (DEV)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro)
        env:
          PUBLIC_NOINDEX: "false"
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # SFTP přes port 222 podle CLAUDE.md §7. WebGlobe podúčet `dev@panprstenu.cz`
      # je jailed do /home/html/panprstenu.cz/_sub/dev/, takže relativní `/`
      # v secret WEBGLOBE_FTP_DEV_PATH = root této subdomény.
      #
      # `mirror -R --delete --parallel=4` = rsync-like upload s mazáním
      # přebytků na serveru a 4 paralelními přenosy.
      # `set sftp:auto-confirm yes` přijme host key při prvním connectu.
      - name: Deploy via SFTP (dev.panprstenu.cz:222)
        env:
          LFTP_USER: ${{ secrets.WEBGLOBE_FTP_DEV_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.WEBGLOBE_FTP_DEV_PASSWORD }}
          LFTP_HOST: ${{ secrets.WEBGLOBE_FTP_HOST }}
          LFTP_REMOTE_PATH: ${{ secrets.WEBGLOBE_FTP_DEV_PATH }}
        run: |
          lftp -u "$LFTP_USER","$LFTP_PASSWORD" -p 222 sftp://$LFTP_HOST <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:timeout 30
          mirror -R --delete --parallel=4 --verbose \
            --exclude-glob .git* \
            --exclude-glob node_modules/ \
            --exclude-glob .DS_Store \
            ./dist/ "$LFTP_REMOTE_PATH"
          bye
          EOF
