side: evil
i18n:
  cs:
    name: Harad
    tagline: Haradrim z horkého Jihu, šarlat, zlato, prach cest a stín mûmakilů.
    combat_style:
      - lehčí pěchota a lukostřelci
      - šavle a zakřivené čepele
      - rychlé útoky a stažení
      - občasné jezdecké prvky bez koní
    recommended_for:
      - hráči se zájmem o exotický a pouštní styl
      - hráči, kteří mají rádi výrazný kostým
      - zkušenější účastníci
      - hráči, kteří se nebojí líčení a barev
    not_recommended_for:
      - hráči bez času na detailnější kostým
      - úplní nováčci bez vybavení
    tags:
      - síla temného pána
      - vyšší kostýmová náročnost
      - exotický styl
      - jih a poušť
    newbie_costume_hint: Barevné šátky, vrstvené látky, šavle nebo zakřivené čepele, ozdobné opasky. Pouštní a stepní inspirace. Šperky, řetízky, kresba na obličeji.
    camp_hook: Tábor Haradu provoní kořeněné maso, hudba bubnů a vyprávění o vzdálených krajích za Stínovými horami. Kupci, válečníci, věštkyně — všichni se zlatou nití v ruce.
    costume_colors_text: 'tmavě červená, šarlatová, fialová; sekundárně bílá, zlatá a modrá'
    heraldry_text: 'Černý had na rudém poli. Také motiv černého slunce.'
    ruler:
      name: Sultán Haradu
      title: Vladař jižních krajů za Stínovými horami
      description: Bohatý a obávaný — ovládá karavany, kupce i válečníky. Pod jeho korouhvemi jdou do bitvy lehcí jezdci a stříbrní lukostřelci. Hráč Haradu poznává sultánovu vůli skrz vyprávění, koření v ohni a ozdobné dýky, které se nelehce zapomínají.
    lore_sections:
      - title: Stylizace kostýmu
        paragraphs:
          - "Kostým připomíná arabské, perské, turkické, popřípadě indické válečníky středověku, eventuálně starověku (počítáno podle evropského chápání této epochy). Velmi pěkně rozepsáno v textu níže. V\_haradském vojsku se také často objevují malé žoldnéřské družiny pocházející převážně ze sousedního Rhunu anebo z přístavního města Umbaru."
      - title: O Haradu
        paragraphs:
          - Země, nazývané gondorskými kartografy Harad, se nacházejí jihovýchodně od Belfalaské zátoky, která tvoří jejich přirozenou západní hranici. Na severu je od země Mordor oddělují Ephel Dúath, Hory stínu. Hranici s jižním Ithilienem tvoří řeka Poros, na jejíchž brodech začíná Jižní cesta. Na jihu pak Haradské země sahají až za Velkou poušť, kde se nacházejí pralesní království. Na východě se Harad táhne až k pohoří Ephel Angren, za nímž se nacházejí země Vozatajů.
          - 'Slovem Harad se nazývají jednak tyto země, jednak obyvatelstvo zde žijící, ač to je povahy velmi různorodé. Vedle vlastního obyvatelstva Haradu zde nalezneme obyvatele, jejichž předkové vykazují příbuznost k Varjagům, Vozatajům a jiným východním národům. Na západním pobřeží je patrný silný vliv Umbarských přístavů, kde se setkává celý svět. Samotný Umbar byl prý v dávných dobách založen bájnými Númenorejci a je módou některých velmožů tvrdit, že jejich předkové byli takzvaní černí, neboli pravověrní Númenorejci. Samozřejmě všude lze potkat otroky ze všech zemí, se kterými Harad obchoduje a využívá jejich práce. Haradští obecně jsou lidé tmavé pleti, hovoří stejným jazykem a dlouhá léta soužití s Mordorem jim vtiskla i stejný „světonázor“: „Všichni mohou žít v míru a poslouchat slova Saurona, proroka Melkorova.“'
          - Co spojuje, tedy donedávna spojovalo Harad jako jeden státní útvar, je moc Sultána a jemu podřízených kalifů, úředníků, správců a výběrčích daní. Sultánova moc se opírá o vatahy, ozbrojené družiny, podřízené svému veliteli – amírovi, který je jmenován sultánem a je mu neochvějně loajální, někdy také proto, že sultán drží jeho rodinu jako rukojmí. Vatahy mají na starost potlačování nepokojů a vzpour v zemi a především výpravy za hranice Haradu. To je vedle pastevectví hlavní zdroj haradského bohatství. Z pralesních království se oddíly vždy vracejí s náklady zlata, koření a především se zástupy otroků v řetězech. V tomto řemesle jsou haradští nejproslulejší po celém známém světě.
      - title: O haradském odívání
        paragraphs:
          - Oděv prostých haraďanů je velmi dobře přizpůsoben zdejšímu podnebí. Je z lehkých vzdušných materiálů a zahaluje většinu povrchu lidského těla. Střihy jsou velmi volné a nechávají velké množství látky zřasené. Látky jsou černé, hnědé a především u vojáků šarlatové, tmavorudé. Okraje rukávů a nohavic jsou zúžené, aby zabránily vnikání prachu, často ještě překryté třásněmi ty kromě zdobení rovněž omezují průnik prachu. Hlavu kryjí šátky či závoje, většinou uvázané nejrůznějšími způsoby do turbanů, jejichž cípy lze zakrýt obličej.
          - Haradské pláště jsou dvojího druhu. Jedním je velký široký pruh látky, může být s otvorem uprostřed na prostrčení hlavy, který slouží jednak k zahalení celého těla, případně i části výstroje a zvířete pod jezdcem, a lze jej použít k vybudování přístřeší v největších parnech. Druhý typ je plášť kruhového střihu z těžších látek, importovaný ze severních zemí, a který se kromě zdobení neliší od plášťů gondorských.
          - Bohatší vrstvy společnosti mají oděvy zdobnější, nákladnější a barevnější. Do honosného oděvu přibyla bílá spodní košile či halena, rovněž zdobená podle úrovně nositele. Užívání barev oděvu je v Haradu starými zvyklostmi rozděleno, ale především v přístavech a velkých centrech se toto rozdělení nedodržuje tak přísně. Sultánovi, jeho nejvyšším úředníkům a amírům a jejich družinám náleží červená barva, obchodníci, správci karavanních cest a výběrčí daní se zdobí převážně fialovou a územní správci a neválečná šlechta pak tmavě modrou barvou. Všem společné je pak zdobení oděvu zlatem, samozřejmě čím větší množství, tím lépe. Pod výšivkami nejhonosnějších oděvů se pomalu ztrácí vlastní barva látky. Chudší varianta zdobení je pak za použití žlutých látek a nití. Ani v tomto případě však žlutá neslouží jako hlavní látka oděvu, vždy jen jako doplňková, ozdobná.
          - Z tohoto schématu existuje pár výjimek. První jsou obyvatelé předhůří Ephel Angren. Jejich oděv vykazuje mnohdy poměrně velký vliv východních národů. Je také méně zdobný a více přizpůsobený horským podmínkám. Látky jsou silnější, střihy více vypasované na tělo, objevuje se kožešina na límcích, rukávech a čapkách.
          - "Umbarské přístavy jsou pak křižovatkou obchodníků z celého pobřeží, tudíž se zde prolíná nespočet vlivů a prvků, které prolínají i do odívání přilehlých haradských měst. V\_tamních krajích dávají přednost jednoduchým halenám a krátkým kalhotám, obecně ošacení praktickému a nenáročnému na údržbu. Je zde všeobecně oblíbenější fialová barva a ve zdobení se výrazně projevuje téma moře, lastur, spirál a dalších ornamentů."
          - Ještě jedna skupina zasáhla do odívání haradské společnosti, tedy spíše do zdobení. Jde o Mahúdy, jezdce na mûmacích. Jejich ochranné rituální tetování a malování po celém těle se rozšířilo napříč všemi skupinami a málokdy potkáte haraďana bez linek a teček na obličeji, i když tyto mají dnes jen ozdobnou funkci.
      - title: Výzbroj a uspořádání sil
        paragraphs:
          - Ohlédneme-li od odlišného provedení – zpracování – a od šarlatové barvy oděvu vojáků, můžeme říct, že se bojová výstroj haradské armády příliš neliší od výstroje spojenců či soupeřů. Snad jen před prošívanými a vycpávanými zbrojemi dávají haraďané často přednost zbrojím koženým nebo splétaným z nejrůznějších rostlinných materiálů, provazů, vláken, případně kožených řemenů. Tyto „rohožovité“ zbroje, doplněné o další zesilující prvky, jako jsou pruty či pásy kovu, také často slouží jako další vrstva přes jiný typ zbroje.
          - Z železných zbrojí se velké oblibě těší zbroje kroužkové. Nejbohatší válečníci pak používají zbroje skládané z železných pásů, štítků, lamel… Větší pláty lze vidět snad pouze na doplňujících chráničích, nátepnících, holeních jezdců a především na přilbách. Ty jsou většinou kónického tvaru, s nánosníkem, překryté pruhem látky, který chrání kovový plát před rozpálením. Místo kovové přilby se používají i plstěné, vycpávané nebo kožené čapky a samozřejmě kroužkové kukly.
          - 'K zbraním Haradských armád lze říct to samé co k výstroji: vesměs stejné typy jako u jejich soupeřů a spolubojovníků, liší se především tvarem a provedením. Dlouhé rovné meče seveřanů se vyskytují pouze jako součást kořisti, haraďané v tomto směru dávají přednost nejrůznějším typům šavlí, mačet, tesáků, palaší. Především jízdní jednotky pak v boji často používají sekery nebo palcáty s kulovitou hlavicí. Typický člen dobře vybaveného vatahu pak do boje pochoduje vyzbrojen tesákem nebo delší dýkou, šavlí jako poboční zbraní a kopím, buďto těžkým pěchotním, přes dva sáhy dlouhým, anebo kratší lehčí verzí, doplněnou o štít.'
          - Mezi haraďany nenašly přílišnou oblibu dvouruční zbraně typu velkých mečů a palic, občas lze zahlédnout jedince se sekerami s půlměsícovitým ostřím na dlouhých toporech. Ze střelných zbraní silně dominují luky, ať už krátké jízdní, nebo jejich delší pěchotní varianty. Jedná se o luky tzv. východního stylu neboli zbraně s dvojitě prohnutým lučištěm.
          - Starší typ haradských štítů je oválného tvaru, dnes dominují štíty kruhové, ať už dřevěné, nebo proutěná kostra potažená surovou kůží. Zdobení štítů odpovídá haradskému stylu a barevným zvyklostem. Štíty Mahúdů jsou také dvou typů, buďto tvaru velmi protáhlé elipsy se zahrocenými konci, nebo tvaru osmičkového. Jejich zdobení je tvořeno čarami, plochami a geometrickými tvary v co nejpestřejší kombinaci barev, přičemž vždy jsou dominantní červené a hnědé barvy.
          - "Nejvyšším velitelem haradské armády je samozřejmě sultán. Ten obléká zbroj pouze v případě Karsilama, neboli svolání všech vatahů. V případě neúčasti Sultána a u menších výprav je velení v rukou naiba, dalo by se říct maršála Haradu. Jemu přímo podléhají amírové, z\_jejichž řad je ostatně naíb často vybírán. To jsou obávaní páni největších hraničních pevností a v rukou amírů je také organizace obchodu s otroky, především jejich získávání. Říká se, že největší z amírů leskem svého dvora zastiňovali samotného sultána."
          - Vatahy jsou vojenské jednotky přesně neurčeného počtu. V období klidu je tvoří amírova družina a posádka pevnosti, v případě válečné výpravy se jejich počet znásobí o odvedence z blízkého okolí a o žoldnéřské oddíly. Vatah je složen z jednotek lehké pěchoty, jak je typické pro pohraniční vatahy, jejichž úkolem je podnikat rychlé výpady na území nepřítele. Zbroje vojáků jsou většinou kožené, rohožovité, je možné zahlédnout i lehké prošívané kabátce (často kořistní). K typické výstroji patří krátké kopí a štít, případně delší pěšácké kopí, jako druhá zbraň slouží často šavle, eventuelně půlměsícová sekyra nebo palcát. Jako záložní zbraně slouží tesáky, dlouhé nože a mačety. Ze střelných zbraní dominují luky.
  en:
    name: Harad
    tagline: Haradrim from the scorching South — scarlet, gold, road dust, and the shadow of mûmakil.
    combat_style:
      - lighter infantry and archers
      - sabres and curved blades
      - swift attacks and withdrawals
      - occasional cavalry elements without horses
    recommended_for:
      - players drawn to an exotic, desert style
      - players who enjoy a striking costume
      - more experienced participants
      - players who are not afraid of make-up and colour
    not_recommended_for:
      - players without time for a more detailed costume
      - complete newcomers with no gear
    tags:
      - force of the Dark Lord
      - higher costume demands
      - exotic style
      - south and desert
    newbie_costume_hint: Colourful scarves, layered fabrics, a sabre or curved blade, ornate belts. Desert and steppe inspiration. Jewellery, chains, painted patterns on the face.
    camp_hook: The camp of Harad is filled with the scent of spiced meat, the music of drums and tales of far lands beyond the Mountains of Shadow. Merchants, warriors, soothsayers — every one of them with a golden thread in hand.
    costume_colors_text: dark red, scarlet, purple; secondarily white, gold and blue
    heraldry_text: A black serpent on a red field. Also the motif of a black sun.
    ruler:
      name: Sultan of Harad
      title: Ruler of the southern lands beyond the Mountains of Shadow
      description: Rich and feared — he commands the caravans, the merchants and the warriors alike. Light horsemen and silver archers march to battle beneath his banners. A player of Harad comes to know the Sultan's will through storytelling, spices thrown on the fire and ornate daggers that are not easily forgotten.
    lore_sections:
      - title: Costume styling
        paragraphs:
          - The costume recalls Arabic, Persian, Turkic or Indian warriors of the Middle Ages, or possibly of antiquity (reckoned by the European understanding of that epoch). It is set out very nicely in the text below. Small mercenary companies also appear frequently in the host of Harad, coming mostly from neighbouring Rhûn or from the port city of Umbar.
      - title: About Harad
        paragraphs:
          - The lands that Gondorian cartographers call Harad lie to the south-east of the Bay of Belfalas, which forms their natural western border. In the north they are separated from the land of Mordor by the Ephel Dúath, the Mountains of Shadow. The border with southern Ithilien is formed by the river Poros, at whose fords the South Road begins. In the south the lands of Harad reach beyond the Great Desert, where the jungle kingdoms lie. In the east Harad stretches as far as the Ephel Angren range, beyond which lie the lands of the Wainriders.
          - 'The word Harad denotes both these lands and the people who dwell in them, though these are of a very varied nature. Alongside the native population of Harad we find inhabitants whose forebears show kinship with the Variags, the Wainriders and other eastern peoples. On the western coast the strong influence of the havens of Umbar is apparent, where the whole world meets. Umbar itself is said to have been founded in ancient days by the fabled Númenóreans, and it is the fashion among certain magnates to claim that their ancestors were the so-called Black, that is to say true-believing, Númenóreans. And of course slaves from all the lands with which Harad trades, and whose labour it exploits, may be met everywhere. The people of Harad are generally dark of skin, speak the same tongue, and long years of coexistence with Mordor have impressed the same “world-view” upon them: “All may live in peace and heed the words of Sauron, prophet of Melkor.”'
          - What binds Harad together as a single polity — or rather bound it until recently — is the power of the Sultan and of the caliphs, officials, stewards and tax collectors subordinate to him. The Sultan's power rests upon the vatahs, armed retinues subordinate to their commander, the amir, who is appointed by the Sultan and is unshakeably loyal to him, sometimes also because the Sultan holds his family hostage. The vatahs are charged with putting down unrest and rebellion within the land and, above all, with expeditions beyond the borders of Harad. Besides herding, this is the chief source of Haradrim wealth. From the jungle kingdoms the companies always return with loads of gold, of spices and, above all, with columns of slaves in chains. In this trade the men of Harad are the most notorious in all the known world.
      - title: On Haradrim dress
        paragraphs:
          - The dress of ordinary Haradrim is very well suited to the local climate. It is made of light, airy materials and covers most of the surface of the human body. The cuts are very loose and leave a great deal of fabric gathered in folds. The fabrics are black, brown and — above all among soldiers — scarlet and dark red. The edges of sleeves and trouser legs are narrowed to keep the dust out, often covered in addition with fringes which, besides being decorative, likewise limit the ingress of dust. The head is covered with scarves or veils, mostly bound in a great variety of ways into turbans whose ends can be used to cover the face.
          - Haradrim cloaks are of two kinds. One is a large, broad strip of fabric, which may have an opening in the middle for the head to pass through; it serves to shroud the whole body, and possibly part of the gear and the animal beneath the rider, and it can be used to rig a shelter in the greatest heat. The second type is a cloak of circular cut made of heavier fabrics, imported from the northern lands, which apart from its decoration does not differ from the cloaks of Gondor.
          - The wealthier classes of society have garments that are more ornate, more costly and more colourful. To the sumptuous costume is added a white undershirt or tunic, likewise decorated according to the standing of the wearer. The use of colours in dress is apportioned in Harad by ancient custom, but especially in the havens and the great centres this apportioning is not observed so strictly. Red belongs to the Sultan, to his highest officials and amirs and to their retinues; merchants, wardens of the caravan roads and tax collectors adorn themselves chiefly in purple, while territorial governors and the non-martial nobility wear dark blue. Common to all is the adorning of garments with gold — the greater the quantity, the better, of course. Beneath the embroidery of the most sumptuous garments the fabric's own colour slowly disappears. The poorer variant of adornment uses yellow fabrics and threads. Even then, however, yellow never serves as the main fabric of a garment, always only as a supplementary, decorative one.
          - There are a few exceptions to this scheme. The first are the inhabitants of the foothills of the Ephel Angren. Their dress often shows a fairly strong influence of the eastern peoples. It is also less ornate and better adapted to mountain conditions. The fabrics are heavier, the cuts more closely fitted to the body, and fur appears on collars, sleeves and caps.
          - The havens of Umbar, meanwhile, are a crossroads for traders from the whole coast, and so countless influences and elements mingle there, which carry over into the dress of the neighbouring cities of Harad as well. In those parts simple tunics and short breeches are preferred, clothing that is on the whole practical and undemanding to maintain. Purple is more widely favoured there, and the decoration strongly reflects the theme of the sea, of shells, spirals and other ornaments.
          - One more group has left its mark on the dress of Haradrim society, or rather on its adornment. These are the Mahûd, the riders of mûmakil. Their protective ritual tattooing and body painting has spread across all groups, and you will rarely meet a man of Harad without lines and dots on his face, even though today these have a merely decorative function.
      - title: Arms and the ordering of forces
        paragraphs:
          - Setting aside the different execution — the workmanship — and the scarlet colour of the soldiers' dress, we may say that the battle gear of the army of Harad does not differ greatly from the gear of its allies or its opponents. Perhaps only in that, in preference to quilted and padded armour, the men of Harad often favour armour of leather, or armour plaited from a variety of plant materials, ropes, fibres or leather straps. These “matting” armours, supplemented with further reinforcing elements such as rods or bands of metal, also often serve as an additional layer over another type of armour.
          - 'Among iron armours, mail enjoys great popularity. The wealthiest warriors then use armour assembled from iron bands, scales and lamellae… Larger plates can be seen perhaps only on supplementary protection: vambraces, the greaves of horsemen and above all helmets. These are mostly conical in shape, with a nasal, covered with a strip of cloth that protects the metal plate from becoming scorching hot. Instead of a metal helmet, felt, padded or leather caps are also used, and of course mail coifs.'
          - 'Of the weapons of the armies of Harad the same may be said as of the gear: broadly the same types as among their opponents and their comrades in arms, differing chiefly in shape and execution. The long straight swords of the northerners occur only as part of the spoils; in this respect the men of Harad prefer all manner of sabres, machetes, falchions and backswords. Mounted units in particular often use axes or maces with a spherical head in battle. A typical member of a well-equipped vatah marches to battle armed with a falchion or a longer dagger, a sabre as a side-arm and a spear, either a heavy infantry one over two fathoms long, or a shorter, lighter version complemented by a shield.'
          - Two-handed weapons such as great swords and mauls have not found much favour among the men of Harad; now and then one may glimpse an individual with an axe with a crescent blade on a long haft. Among missile weapons, bows are strongly dominant, whether the short horseman's bow or its longer infantry variants. They are bows of the so-called eastern style, that is, weapons with a doubly curved stave.
          - The older type of Haradrim shield is oval in shape; today round shields dominate, whether of wood or a wicker frame covered with rawhide. The decoration of the shields follows the style and colour conventions of Harad. The shields of the Mahûd are likewise of two types, either in the shape of a very elongated ellipse with pointed ends, or in the shape of a figure of eight. Their decoration is made up of lines, fields and geometric shapes in the most varied combination of colours possible, with red and brown always dominant.
          - The supreme commander of the army of Harad is, of course, the Sultan. He dons armour only in the case of the Karsilam, the summoning of all the vatahs. When the Sultan does not take part, and on lesser expeditions, command lies in the hands of the naib, one might say the Marshal of Harad. Directly subordinate to him are the amirs, from whose ranks the naib is in fact often chosen. These are the dreaded lords of the greatest border fortresses, and in the hands of the amirs lies also the organisation of the slave trade, above all the taking of slaves. It is said that the greatest of the amirs outshone the Sultan himself with the splendour of their courts.
          - The vatahs are military units of no precisely fixed size. In times of quiet they consist of the amir's retinue and the garrison of the fortress; in the event of a war expedition their numbers are multiplied by levies from the surrounding district and by mercenary companies. A vatah is composed of units of light infantry, as is typical of the border vatahs, whose task is to make swift raids into enemy territory. The soldiers' armour is mostly of leather or matting; light quilted jacks may also be glimpsed (often taken as spoils). Typical gear includes a short spear and a shield, or else a longer infantry spear; a sabre often serves as a second weapon, or a crescent axe or a mace. Falchions, long knives and machetes serve as reserve weapons. Among missile weapons, bows are dominant.
  de:
    name: Harad
    tagline: Haradrim aus dem heißen Süden — Scharlach, Gold, Straßenstaub und der Schatten der Mûmakil.
    combat_style:
      - leichtere Infanterie und Bogenschützen
      - Säbel und gekrümmte Klingen
      - schnelle Angriffe und Rückzüge
      - gelegentliche Reiterelemente ohne Pferde
    recommended_for:
      - Spieler mit Interesse an exotischem Wüstenstil
      - Spieler, die ein auffälliges Kostüm mögen
      - erfahrenere Teilnehmer
      - Spieler, die keine Scheu vor Schminke und Farben haben
    not_recommended_for:
      - Spieler ohne Zeit für ein aufwendigeres Kostüm
      - völlige Neulinge ohne Ausrüstung
    tags:
      - Macht des Dunklen Herrschers
      - höherer Kostümaufwand
      - exotischer Stil
      - Süden und Wüste
    newbie_costume_hint: Bunte Tücher, geschichtete Stoffe, Säbel oder gekrümmte Klingen, verzierte Gürtel. Wüsten- und Steppeninspiration. Schmuck, Kettchen, Bemalung im Gesicht.
    camp_hook: Im Lager von Harad duftet es nach gewürztem Fleisch, dazu Trommelmusik und Erzählungen von fernen Ländern jenseits des Schattengebirges. Händler, Krieger, Wahrsagerinnen — alle mit einem goldenen Faden in der Hand.
    costume_colors_text: Dunkelrot, Scharlachrot, Violett; sekundär Weiß, Gold und Blau
    heraldry_text: Eine schwarze Schlange auf rotem Feld. Ebenso das Motiv der schwarzen Sonne.
    ruler:
      name: Sultan von Harad
      title: Herrscher der südlichen Lande jenseits des Schattengebirges
      description: Reich und gefürchtet — er gebietet über Karawanen, Händler und Krieger gleichermaßen. Unter seinen Bannern ziehen leichte Reiter und silberne Bogenschützen in die Schlacht. Ein Spieler von Harad erfährt den Willen des Sultans durch Erzählungen, durch Gewürze im Feuer und durch verzierte Dolche, die man nicht leicht vergisst.
    lore_sections:
      - title: Stilisierung des Kostüms
        paragraphs:
          - Das Kostüm erinnert an arabische, persische, türkische, gegebenenfalls indische Krieger des Mittelalters, allenfalls der Antike (gerechnet nach dem europäischen Verständnis dieser Epoche). Sehr schön ausgeführt ist das im Text weiter unten. Im Heer von Harad treten auch häufig kleine Söldnertrupps auf, die überwiegend aus dem benachbarten Rhûn oder aus der Hafenstadt Umbar stammen.
      - title: Über Harad
        paragraphs:
          - Die Länder, die von den Kartographen Gondors Harad genannt werden, liegen südöstlich der Bucht von Belfalas, die ihre natürliche Westgrenze bildet. Im Norden trennt sie das Ephel Dúath, das Schattengebirge, vom Land Mordor. Die Grenze zum südlichen Ithilien bildet der Fluss Poros, an dessen Furten die Südstraße beginnt. Im Süden reichen die Lande Harads bis über die Große Wüste hinaus, wo die Urwaldkönigreiche liegen. Im Osten erstreckt sich Harad bis zum Gebirge Ephel Angren, hinter dem die Länder der Wagenfahrer liegen.
          - 'Mit dem Wort Harad werden sowohl diese Länder als auch die hier lebende Bevölkerung bezeichnet, obwohl diese von sehr uneinheitlicher Art ist. Neben der eigentlichen Bevölkerung Harads finden wir hier Bewohner, deren Vorfahren eine Verwandtschaft zu den Variags, den Wagenfahrern und anderen östlichen Völkern aufweisen. An der Westküste ist der starke Einfluss der Häfen Umbars spürbar, wo die ganze Welt zusammentrifft. Umbar selbst soll in alten Zeiten von den sagenhaften Númenórern gegründet worden sein, und es ist unter manchen Großen Mode zu behaupten, ihre Vorfahren seien die sogenannten Schwarzen, also die rechtgläubigen Númenórer gewesen. Natürlich begegnet man überall Sklaven aus allen Ländern, mit denen Harad Handel treibt und deren Arbeitskraft es nutzt. Die Menschen Harads sind im Allgemeinen dunkelhäutig, sprechen dieselbe Sprache, und die langen Jahre des Zusammenlebens mit Mordor haben ihnen dieselbe „Weltanschauung“ eingeprägt: „Alle können in Frieden leben und den Worten Saurons, des Propheten Melkors, gehorchen.“'
          - Was Harad als ein Staatsgebilde zusammenhält, bis vor kurzem jedenfalls zusammenhielt, ist die Macht des Sultans und der ihm unterstellten Kalifen, Beamten, Verwalter und Steuereintreiber. Die Macht des Sultans stützt sich auf die Vatahs, bewaffnete Gefolgschaften, die ihrem Befehlshaber — dem Amir — unterstehen, der vom Sultan ernannt wird und ihm unerschütterlich treu ergeben ist, manchmal auch deshalb, weil der Sultan seine Familie als Geiseln hält. Die Vatahs haben die Niederschlagung von Unruhen und Aufständen im Land zur Aufgabe und vor allem Feldzüge über die Grenzen Harads hinaus. Das ist neben der Viehzucht die wichtigste Quelle des Reichtums von Harad. Aus den Urwaldkönigreichen kehren die Abteilungen stets mit Ladungen von Gold, Gewürzen und vor allem mit Scharen von Sklaven in Ketten zurück. In diesem Gewerbe sind die Menschen Harads in der ganzen bekannten Welt am berüchtigtsten.
      - title: Über die Kleidung Harads
        paragraphs:
          - Die Kleidung der einfachen Haradrim ist dem hiesigen Klima sehr gut angepasst. Sie besteht aus leichten, luftigen Materialien und verhüllt den größten Teil der Körperoberfläche. Die Schnitte sind sehr weit und lassen große Stoffmengen in Falten fallen. Die Stoffe sind schwarz, braun und vor allem bei den Soldaten scharlachrot und dunkelrot. Die Ränder von Ärmeln und Hosenbeinen sind verengt, um das Eindringen von Staub zu verhindern, oft zusätzlich mit Fransen bedeckt, die neben der Zierde ebenfalls das Eindringen von Staub verringern. Den Kopf bedecken Tücher oder Schleier, meist auf die verschiedensten Arten zu Turbanen gebunden, deren Zipfel das Gesicht verhüllen können.
          - Die Mäntel Harads sind von zweierlei Art. Der eine ist ein großer, breiter Stoffstreifen, der in der Mitte eine Öffnung zum Durchstecken des Kopfes haben kann; er dient dazu, den ganzen Körper zu verhüllen, gegebenenfalls auch einen Teil der Ausrüstung und das Tier unter dem Reiter, und er lässt sich in der größten Hitze zum Bau eines Unterstands verwenden. Der zweite Typ ist ein Mantel von kreisförmigem Schnitt aus schwereren Stoffen, aus den nördlichen Ländern eingeführt, der sich außer in der Verzierung nicht von den Mänteln Gondors unterscheidet.
          - Die wohlhabenderen Schichten der Gesellschaft tragen aufwendigere, kostspieligere und farbenfrohere Gewänder. Zum prunkvollen Gewand kam ein weißes Unterhemd oder Untergewand hinzu, ebenfalls dem Rang des Trägers entsprechend verziert. Der Gebrauch der Farben in der Kleidung ist in Harad durch alte Gepflogenheiten aufgeteilt, doch vor allem in den Häfen und großen Zentren wird diese Aufteilung nicht so streng eingehalten. Dem Sultan, seinen höchsten Beamten und Amiren sowie deren Gefolgschaften gebührt die rote Farbe, Kaufleute, Verwalter der Karawanenwege und Steuereintreiber schmücken sich überwiegend mit Violett, die Gebietsverwalter und der nichtkriegerische Adel dagegen mit Dunkelblau. Allen gemeinsam ist das Verzieren der Kleidung mit Gold, natürlich je mehr, desto besser. Unter den Stickereien der prunkvollsten Gewänder verschwindet die eigene Farbe des Stoffes allmählich. Die ärmere Variante der Verzierung erfolgt dann mit gelben Stoffen und Fäden. Auch in diesem Fall dient Gelb jedoch nie als Hauptstoff des Gewandes, immer nur als ergänzender, schmückender.
          - Von diesem Schema gibt es einige Ausnahmen. Die ersten sind die Bewohner des Vorgebirges des Ephel Angren. Ihre Kleidung weist vielfach einen recht großen Einfluss der östlichen Völker auf. Sie ist auch weniger schmuckvoll und stärker den Gebirgsbedingungen angepasst. Die Stoffe sind dicker, die Schnitte enger am Körper anliegend, an Kragen, Ärmeln und Mützen tritt Pelz auf.
          - Die Häfen Umbars sind ein Kreuzungspunkt für Händler von der gesamten Küste, daher vermischen sich hier unzählige Einflüsse und Elemente, die auch in die Kleidung der angrenzenden Städte Harads einfließen. In jenen Gegenden bevorzugt man einfache Hemden und kurze Hosen, allgemein eine praktische und pflegeleichte Bekleidung. Die violette Farbe ist dort allgemein beliebter, und in der Verzierung zeigt sich deutlich das Thema des Meeres, der Muscheln, Spiralen und weiterer Ornamente.
          - Noch eine Gruppe hat in die Kleidung der Gesellschaft Harads eingegriffen, eher noch in deren Verzierung. Es sind die Mahûd, die Reiter auf Mûmakil. Ihre schützenden rituellen Tätowierungen und Bemalungen am ganzen Körper haben sich quer durch alle Gruppen verbreitet, und selten begegnet man einem Menschen aus Harad ohne Linien und Punkte im Gesicht, auch wenn diese heute nur noch schmückende Funktion haben.
      - title: Bewaffnung und Gliederung der Streitkräfte
        paragraphs:
          - Sehen wir von der abweichenden Ausführung — der Verarbeitung — und von der scharlachroten Farbe der Soldatenkleidung ab, so lässt sich sagen, dass sich die Kampfausrüstung des Heeres von Harad nicht sonderlich von der Ausrüstung der Verbündeten oder der Gegner unterscheidet. Höchstens darin, dass die Menschen Harads gesteppten und wattierten Rüstungen häufig ledernen Rüstungen oder solchen vorziehen, die aus den verschiedensten pflanzlichen Materialien, Seilen, Fasern oder auch Lederriemen geflochten sind. Diese „mattenartigen“ Rüstungen, ergänzt um weitere verstärkende Elemente wie Ruten oder Metallbänder, dienen auch häufig als zusätzliche Schicht über einem anderen Rüstungstyp.
          - Von den eisernen Rüstungen erfreuen sich Kettenrüstungen großer Beliebtheit. Die reichsten Krieger verwenden dann Rüstungen, die aus eisernen Bändern, Schuppen und Lamellen zusammengesetzt sind… Größere Platten sind wohl nur an ergänzenden Schutzstücken zu sehen, an Armschienen, an den Beinschienen der Reiter und vor allem an den Helmen. Diese sind meist von konischer Form, mit Nasal, überdeckt von einem Stoffstreifen, der die Metallplatte vor dem Erhitzen schützt. Anstelle des Metallhelms werden auch gefilzte, wattierte oder lederne Mützen verwendet und selbstverständlich Kettenhauben.
          - 'Zu den Waffen der Heere Harads lässt sich dasselbe sagen wie zur Ausrüstung: durchweg dieselben Typen wie bei ihren Gegnern und Mitstreitern, sie unterscheiden sich vor allem in Form und Ausführung. Die langen geraden Schwerter der Nordländer kommen nur als Teil der Beute vor, die Menschen Harads bevorzugen in dieser Hinsicht die verschiedensten Arten von Säbeln, Macheten, Hiebmessern und Pallaschen. Vor allem die berittenen Einheiten verwenden im Kampf häufig Äxte oder Streitkolben mit kugelförmigem Kopf. Ein typisches Mitglied eines gut ausgerüsteten Vatahs marschiert dann bewaffnet mit einem Hiebmesser oder einem längeren Dolch, einem Säbel als Seitenwaffe und einem Speer in die Schlacht, entweder einem schweren Infanteriespeer von über zwei Klaftern Länge oder einer kürzeren, leichteren Version, ergänzt um einen Schild.'
          - Zweihandwaffen vom Typ großer Schwerter und Kolben haben unter den Menschen Harads keine allzu große Beliebtheit gefunden, gelegentlich sind Einzelne mit Äxten mit halbmondförmiger Schneide an langen Stielen zu erblicken. Von den Fernkampfwaffen dominieren die Bögen deutlich, ob die kurzen Reiterbögen oder ihre längeren Infanterievarianten. Es handelt sich um Bögen des sogenannten östlichen Stils, also um Waffen mit doppelt geschwungenem Bogenstab.
          - Der ältere Typ der Schilde Harads ist von ovaler Form, heute dominieren runde Schilde, sei es aus Holz oder als mit Rohhaut bespanntes Weidengeflecht. Die Verzierung der Schilde entspricht dem Stil und den Farbgepflogenheiten Harads. Auch die Schilde der Mahûd sind von zwei Typen, entweder in Form einer sehr langgezogenen Ellipse mit zugespitzten Enden oder in Form einer Acht. Ihre Verzierung besteht aus Linien, Flächen und geometrischen Formen in einer möglichst bunten Farbkombination, wobei stets rote und braune Farben vorherrschen.
          - Oberster Befehlshaber des Heeres von Harad ist selbstverständlich der Sultan. Er legt die Rüstung nur im Falle des Karsilam an, also der Einberufung aller Vatahs. Bei Abwesenheit des Sultans und bei kleineren Feldzügen liegt der Befehl in den Händen des Naib, man könnte sagen des Marschalls von Harad. Ihm unterstehen unmittelbar die Amire, aus deren Reihen der Naib im Übrigen häufig ausgewählt wird. Das sind die gefürchteten Herren der größten Grenzfestungen, und in den Händen der Amire liegt auch die Organisation des Sklavenhandels, vor allem die Beschaffung der Sklaven. Es heißt, die größten der Amire hätten mit dem Glanz ihres Hofes den Sultan selbst überstrahlt.
          - Die Vatahs sind militärische Einheiten von nicht genau bestimmter Stärke. In Friedenszeiten bilden sie die Gefolgschaft des Amirs und die Besatzung der Festung, im Falle eines Kriegszuges vervielfacht sich ihre Zahl durch Aushebungen aus der näheren Umgebung und durch Söldnerabteilungen. Ein Vatah setzt sich aus Einheiten leichter Infanterie zusammen, wie es für die Grenzvatahs typisch ist, deren Aufgabe schnelle Vorstöße auf feindliches Gebiet sind. Die Rüstungen der Soldaten sind meist ledern oder mattenartig, zu erblicken sind auch leichte gesteppte Waffenröcke (oft Beutestücke). Zur typischen Ausrüstung gehören ein kurzer Speer und ein Schild, gegebenenfalls ein längerer Infanteriespeer, als zweite Waffe dient häufig ein Säbel, allenfalls eine Halbmondaxt oder ein Streitkolben. Als Reservewaffen dienen Hiebmesser, lange Messer und Macheten. Von den Fernkampfwaffen dominieren die Bögen.
  sk:
    name: Harad
    tagline: Haradrim z horúceho Juhu — šarlát, zlato, prach ciest a tieň mûmakilov.
    combat_style:
      - ľahšia pechota a lukostrelci
      - šable a zakrivené čepele
      - rýchle útoky a stiahnutia
      - občasné jazdecké prvky bez koní
    recommended_for:
      - hráči so záujmom o exotický a púštny štýl
      - hráči, ktorí majú radi výrazný kostým
      - skúsenejší účastníci
      - hráči, ktorí sa neboja líčenia a farieb
    not_recommended_for:
      - hráči bez času na detailnejší kostým
      - úplní nováčikovia bez vybavenia
    tags:
      - sila temného pána
      - vyššia kostýmová náročnosť
      - exotický štýl
      - juh a púšť
    newbie_costume_hint: Farebné šatky, vrstvené látky, šable alebo zakrivené čepele, ozdobné opasky. Púštna a stepná inšpirácia. Šperky, retiazky, kresba na tvári.
    camp_hook: Tábor Haradu prevonia korenené mäso, hudba bubnov a rozprávanie o vzdialených krajoch za Horami tieňa. Kupci, bojovníci, veštice — všetci so zlatou niťou v ruke.
    costume_colors_text: tmavočervená, šarlátová, fialová; sekundárne biela, zlatá a modrá
    heraldry_text: Čierny had na červenom poli. Aj motív čierneho slnka.
    ruler:
      name: Sultán Haradu
      title: Vládca južných krajov za Horami tieňa
      description: Bohatý a obávaný — ovláda karavány, kupcov aj bojovníkov. Pod jeho zástavami idú do bitky ľahkí jazdci a strieborní lukostrelci. Hráč Haradu spoznáva sultánovu vôľu cez rozprávanie, korenie v ohni a ozdobné dýky, na ktoré sa nezabúda ľahko.
    lore_sections:
      - title: Štylizácia kostýmu
        paragraphs:
          - Kostým pripomína arabských, perzských, turkických, prípadne indických bojovníkov stredoveku, eventuálne staroveku (počítané podľa európskeho chápania tejto epochy). Veľmi pekne rozpísané je to v texte nižšie. V haradskom vojsku sa tiež často objavujú malé žoldnierske družiny pochádzajúce prevažne zo susedného Rhûnu alebo z prístavného mesta Umbar.
      - title: O Harade
        paragraphs:
          - Krajiny, ktoré gondorskí kartografi nazývajú Harad, sa nachádzajú juhovýchodne od Belfalaského zálivu, ktorý tvorí ich prirodzenú západnú hranicu. Na severe ich od krajiny Mordor oddeľuje Ephel Dúath, Hory tieňa. Hranicu s južným Ithilienom tvorí rieka Poros, na ktorej brodoch sa začína Južná cesta. Na juhu potom haradské krajiny siahajú až za Veľkú púšť, kde ležia pralesné kráľovstvá. Na východe sa Harad tiahne až k pohoriu Ephel Angren, za ktorým ležia krajiny Vozatajov.
          - 'Slovom Harad sa označujú jednak tieto krajiny, jednak obyvateľstvo, ktoré tu žije, hoci to je veľmi rôznorodej povahy. Popri vlastnom obyvateľstve Haradu tu nájdeme obyvateľov, ktorých predkovia vykazujú príbuznosť s Varjagmi, Vozatajmi a inými východnými národmi. Na západnom pobreží je badateľný silný vplyv umbarských prístavov, kde sa stretáva celý svet. Samotný Umbar vraj v dávnych časoch založili bájni Númenorejci a je módou niektorých veľmožov tvrdiť, že ich predkovia boli takzvaní čierni, čiže pravoverní Númenorejci. Samozrejme, všade možno stretnúť otrokov zo všetkých krajín, s ktorými Harad obchoduje a ktorých prácu využíva. Haradčania sú vo všeobecnosti ľudia tmavej pleti, hovoria rovnakým jazykom a dlhé roky spolunažívania s Mordorom im vtlačili aj rovnaký „svetonázor“: „Všetci môžu žiť v mieri a poslúchať slová Saurona, proroka Melkorovho.“'
          - Čo spája, teda donedávna spájalo Harad ako jeden štátny útvar, je moc sultána a jemu podriadených kalifov, úradníkov, správcov a výbercov daní. Sultánova moc sa opiera o vatahy, ozbrojené družiny podriadené svojmu veliteľovi – amírovi, ktorého menuje sultán a ktorý je mu neochvejne lojálny, niekedy aj preto, že sultán drží jeho rodinu ako rukojemníkov. Vatahy majú na starosti potláčanie nepokojov a vzbúr v krajine a predovšetkým výpravy za hranice Haradu. To je popri pastierstve hlavný zdroj haradského bohatstva. Z pralesných kráľovstiev sa oddiely vždy vracajú s nákladmi zlata, korenia a predovšetkým so zástupmi otrokov v reťaziach. V tomto remesle sú Haradčania najpreslávenejší v celom známom svete.
      - title: O haradskom odievaní
        paragraphs:
          - Odev prostých Haradčanov je veľmi dobre prispôsobený tunajšiemu podnebiu. Je z ľahkých vzdušných materiálov a zahaľuje väčšinu povrchu ľudského tela. Strihy sú veľmi voľné a nechávajú veľké množstvo látky nariasené. Látky sú čierne, hnedé a predovšetkým u vojakov šarlátové, tmavočervené. Okraje rukávov a nohavíc sú zúžené, aby zabránili vnikaniu prachu, často ešte prekryté strapcami, ktoré okrem zdobenia rovnako obmedzujú prienik prachu. Hlavu kryjú šatky či závoje, väčšinou uviazané najrozličnejšími spôsobmi do turbanov, ktorých cípmi možno zakryť tvár.
          - Haradské plášte sú dvojakého druhu. Jedným je veľký široký pruh látky, môže byť s otvorom uprostred na prestrčenie hlavy, ktorý slúži jednak na zahalenie celého tela, prípadne aj časti výstroja a zvieraťa pod jazdcom, a možno ho použiť na vybudovanie prístrešia v najväčších horúčavách. Druhý typ je plášť kruhového strihu z ťažších látok, dovážaný zo severných krajín, ktorý sa okrem zdobenia nelíši od plášťov gondorských.
          - Bohatšie vrstvy spoločnosti majú odevy zdobnejšie, nákladnejšie a farebnejšie. Do honosného odevu pribudla biela spodná košeľa či halena, rovnako zdobená podľa úrovne nositeľa. Používanie farieb odevu je v Harade starými zvyklosťami rozdelené, ale predovšetkým v prístavoch a veľkých centrách sa toto rozdelenie nedodržiava tak prísne. Sultánovi, jeho najvyšším úradníkom a amírom a ich družinám patrí červená farba, obchodníci, správcovia karavánnych ciest a výbercovia daní sa zdobia prevažne fialovou a územní správcovia a nevojnová šľachta tmavomodrou farbou. Všetkým spoločné je potom zdobenie odevu zlatom, samozrejme, čím väčšie množstvo, tým lepšie. Pod výšivkami najhonosnejších odevov sa pomaly stráca vlastná farba látky. Chudobnejší variant zdobenia je potom za použitia žltých látok a nití. Ani v tomto prípade však žltá neslúži ako hlavná látka odevu, vždy len ako doplnková, ozdobná.
          - Z tejto schémy existuje pár výnimiek. Prvou sú obyvatelia podhoria Ephel Angren. Ich odev vykazuje neraz pomerne veľký vplyv východných národov. Je tiež menej zdobný a viac prispôsobený horským podmienkam. Látky sú hrubšie, strihy viac vypasované na telo, objavuje sa kožušina na golieroch, rukávoch a čiapkach.
          - Umbarské prístavy sú potom križovatkou obchodníkov z celého pobrežia, takže sa tu prelína nespočet vplyvov a prvkov, ktoré prenikajú aj do odievania priľahlých haradských miest. V tamojších krajoch dávajú prednosť jednoduchým halenám a krátkym nohaviciam, celkovo ošateniu praktickému a nenáročnému na údržbu. Je tu všeobecne obľúbenejšia fialová farba a v zdobení sa výrazne prejavuje téma mora, lastúr, špirál a ďalších ornamentov.
          - Ešte jedna skupina zasiahla do odievania haradskej spoločnosti, teda skôr do zdobenia. Ide o Mahúdov, jazdcov na mûmakiloch. Ich ochranné rituálne tetovanie a maľovanie po celom tele sa rozšírilo naprieč všetkými skupinami a málokedy stretnete Haradčana bez čiar a bodiek na tvári, aj keď tie majú dnes už len ozdobnú funkciu.
      - title: Výzbroj a usporiadanie síl
        paragraphs:
          - Ak odhliadneme od odlišného prevedenia – spracovania – a od šarlátovej farby odevu vojakov, môžeme povedať, že sa bojový výstroj haradskej armády príliš nelíši od výstroja spojencov či súperov. Azda len to, že pred prešívanými a vypchávanými zbrojami dávajú Haradčania často prednosť zbrojiam koženým alebo spleteným z najrozličnejších rastlinných materiálov, povrazov, vlákien, prípadne kožených remeňov. Tieto „rohožovité“ zbroje, doplnené o ďalšie zosilňujúce prvky, ako sú prúty či pásy kovu, tiež často slúžia ako ďalšia vrstva cez iný typ zbroje.
          - Zo železných zbrojí sa veľkej obľube tešia zbroje krúžkové. Najbohatší bojovníci potom používajú zbroje skladané zo železných pásov, štítkov, lamiel… Väčšie platne možno vidieť azda len na doplňujúcich chráničoch, nátepníkoch, holeniach jazdcov a predovšetkým na prilbách. Tie sú väčšinou kónického tvaru, s nánosníkom, prekryté pruhom látky, ktorý chráni kovovú platňu pred rozpálením. Namiesto kovovej prilby sa používajú aj plstené, vypchávané alebo kožené čiapky a, samozrejme, krúžkové kukly.
          - 'K zbraniam haradských armád možno povedať to isté čo k výstroju: v podstate rovnaké typy ako u ich súperov a spolubojovníkov, líšia sa predovšetkým tvarom a prevedením. Dlhé rovné meče severanov sa vyskytujú iba ako súčasť koristi, Haradčania v tomto smere dávajú prednosť najrozličnejším typom šablí, mačiet, tesákov, palašov. Predovšetkým jazdné jednotky potom v boji často používajú sekery alebo palcáty s guľovitou hlavicou. Typický člen dobre vybaveného vatahu potom do boja pochoduje vyzbrojený tesákom alebo dlhšou dýkou, šabľou ako pobočnou zbraňou a kopijou, buď ťažkou pechotnou, cez dve siahy dlhou, alebo kratšou ľahšou verziou, doplnenou o štít.'
          - Medzi Haradčanmi si prílišnú obľubu nenašli obojručné zbrane typu veľkých mečov a palíc, občas možno zazrieť jednotlivcov so sekerami s polmesiacovitým ostrím na dlhých poriskách. Zo strelných zbraní silno dominujú luky, či už krátke jazdecké, alebo ich dlhšie pechotné varianty. Ide o luky takzvaného východného štýlu, čiže o zbrane s dvojito prehnutým lučišťom.
          - Starší typ haradských štítov je oválneho tvaru, dnes dominujú štíty kruhové, či už drevené, alebo prútená kostra potiahnutá surovou kožou. Zdobenie štítov zodpovedá haradskému štýlu a farebným zvyklostiam. Štíty Mahúdov sú tiež dvoch typov, buď tvaru veľmi pretiahnutej elipsy so zahrotenými koncami, alebo tvaru osmičkového. Ich zdobenie tvoria čiary, plochy a geometrické tvary v čo najpestrejšej kombinácii farieb, pričom vždy sú dominantné červené a hnedé farby.
          - Najvyšším veliteľom haradskej armády je, samozrejme, sultán. Ten oblieka zbroj iba v prípade Karsilamu, čiže zvolania všetkých vatahov. V prípade neúčasti sultána a pri menších výpravách je velenie v rukách naiba, dalo by sa povedať maršala Haradu. Jemu priamo podliehajú amírovia, z ktorých radov sa napokon naib často vyberá. Sú to obávaní páni najväčších hraničných pevností a v rukách amírov je aj organizácia obchodu s otrokmi, predovšetkým ich získavanie. Hovorí sa, že najväčší z amírov leskom svojho dvora zatieňovali samotného sultána.
          - Vatahy sú vojenské jednotky presne neurčeného počtu. V období pokoja ich tvorí amírova družina a posádka pevnosti, v prípade vojnovej výpravy sa ich počet znásobí o odvedencov z blízkeho okolia a o žoldnierske oddiely. Vatah sa skladá z jednotiek ľahkej pechoty, ako je typické pre pohraničné vatahy, ktorých úlohou je podnikať rýchle výpady na územie nepriateľa. Zbroje vojakov sú väčšinou kožené, rohožovité, možno zazrieť aj ľahké prešívané kabátce (často koristné). K typickému výstroju patrí krátka kopija a štít, prípadne dlhšia pešiacka kopija, ako druhá zbraň slúži často šabľa, eventuálne polmesiacová sekera alebo palcát. Ako záložné zbrane slúžia tesáky, dlhé nože a mačety. Zo strelných zbraní dominujú luky.
  uk:
    name: Гарад
    tagline: Гарадрими з гарячого Півдня — багряний, золото, дорожній пил і тінь мумакілів.
    combat_style:
      - легша піхота й лучники
      - шаблі та вигнуті клинки
      - швидкі напади й відходи
      - подекуди кінні елементи без коней
    recommended_for:
      - гравці, яких вабить екзотичний, пустельний стиль
      - гравці, які люблять виразний костюм
      - досвідченіші учасники
      - гравці, які не бояться гриму й барв
    not_recommended_for:
      - гравці без часу на детальніший костюм
      - цілковиті новачки без спорядження
    tags:
      - сила темного володаря
      - вища костюмна складність
      - екзотичний стиль
      - південь і пустеля
    newbie_costume_hint: Барвисті хустки, багатошарові тканини, шабля або вигнутий клинок, оздобні паски. Пустельне й степове натхнення. Прикраси, ланцюжки, малюнок на обличчі.
    camp_hook: У таборі Гараду пахне присмаченим м'ясом, лунає музика бубнів і оповіді про далекі краї за Горами Тіні. Купці, воїни, віщунки — усі із золотою ниткою в руці.
    costume_colors_text: темно-червона, багряна, фіалкова; додатково біла, золота й синя
    heraldry_text: Чорний змій на червоному полі. Також мотив чорного сонця.
    ruler:
      name: Султан Гараду
      title: Володар південних країв за Горами Тіні
      description: Багатий і грізний — він порядкує караванами, купцями й воїнами. Під його корогвами йдуть у бій легкі вершники та срібні лучники. Гравець Гараду пізнає султанову волю через оповіді, прянощі у вогні й оздобні кинджали, які нелегко забути.
    lore_sections:
      - title: Стилізація костюма
        paragraphs:
          - Костюм нагадує арабських, перських, тюркських, а то й індійських воїнів середньовіччя, можливо й давнини (рахуючи за європейським розумінням цієї епохи). Дуже гарно це розписано в тексті нижче. У гарадському війську також часто трапляються невеликі найманські дружини, що походять переважно із сусіднього Руну або з портового міста Умбар.
      - title: Про Гарад
        paragraphs:
          - Землі, які ґондорські картографи називають Гарад, лежать на південний схід від Белфаласької затоки, що утворює їхній природний західний кордон. На півночі їх від краю Мордор відділяє Ефель-Дуат, Гори Тіні. Кордон із південним Ітілієном утворює річка Порос, на бродах якої починається Південний шлях. На півдні гарадські землі сягають аж за Велику пустелю, де лежать пралісові королівства. На сході Гарад тягнеться аж до пасма Ефель-Анґрен, за яким лежать землі Візничих.
          - 'Словом Гарад називають як ці землі, так і людність, що тут живе, хоча вона дуже різнорідної вдачі. Поряд із власне гарадським населенням знайдемо тут мешканців, чиї предки виявляють спорідненість із варягами, Візничими та іншими східними народами. На західному узбережжі помітний сильний вплив умбарських портів, де сходиться цілий світ. Сам Умбар, кажуть, у давні часи заснували легендарні нуменорці, і серед декотрих вельмож модно стверджувати, що їхні предки були так званими чорними, себто правовірними нуменорцями. Звісно, всюди можна зустріти невільників з усіх країв, з якими Гарад торгує і чию працю використовує. Гарадрими загалом — люди темної шкіри, говорять однією мовою, і довгі роки співжиття з Мордором відбили в них однаковий „світогляд": „Усі можуть жити в мирі й слухати слова Саурона, пророка Мелькорового."'
          - Те, що об'єднує, точніше донедавна об'єднувало Гарад як одне державне утворення, — це влада султана та підпорядкованих йому каліфів, урядників, управителів і збирачів податків. Султанова влада спирається на ватаги, збройні дружини, підпорядковані своєму командирові — амірові, якого призначає султан і якому той незрушно відданий, іноді й тому, що султан тримає його родину заручниками. Ватаги мають на своїй відповідальності придушення заворушень і повстань у краю, а передусім походи за межі Гараду. Це поряд зі скотарством головне джерело гарадського багатства. З пралісових королівств загони завжди повертаються з вантажами золота, прянощів і насамперед із валками невільників у кайданах. У цьому ремеслі гарадрими найзвісніші в усьому відомому світі.
      - title: Про гарадський одяг
        paragraphs:
          - Одяг простих гарадримів дуже добре пристосований до тутешнього клімату. Він із легких, продувних матеріалів і закриває більшу частину поверхні людського тіла. Крої дуже вільні й залишають велику кількість тканини зібраною у складки. Тканини чорні, брунатні, а надто у вояків — багряні, темно-червоні. Краї рукавів і холош звужені, щоб не пропускали пилу, часто ще й прикриті торочками, які, окрім оздоби, так само обмежують проникнення пилу. Голову вкривають хустки чи запинала, здебільшого зав'язані найрізноманітнішими способами в тюрбани, кінцями яких можна закрити обличчя.
          - Гарадські плащі бувають двох різновидів. Один — це велика широка смуга тканини, яка може мати посередині отвір для голови; вона служить і для того, щоб закутати ціле тіло, а часом і частину спорядження та тварину під вершником, і її можна використати для спорудження накриття в найбільшу спеку. Другий тип — плащ круглого крою з важчих тканин, привезений із північних країв, який, окрім оздоби, не відрізняється від плащів ґондорських.
          - Заможніші верстви суспільства мають одяг оздобніший, коштовніший і барвистіший. До пишного вбрання додалася біла спідня сорочка чи блуза, так само оздоблена відповідно до становища власника. Уживання барв в одязі поділене в Гараді давніми звичаями, але передусім у портах і великих осередках цього поділу не дотримуються так суворо. Султанові, його найвищим урядникам та амірам і їхнім дружинам належить червона барва, купці, управителі караванних шляхів і збирачі податків прикрашаються переважно фіалковою, а територіальні управителі й невоєнна знать — темно-синьою. Спільним для всіх є оздоблення одягу золотом, звісно, чим більше, тим краще. Під вишивкою найпишнішого вбрання поволі губиться власна барва тканини. Убогіший варіант оздоби — це вжиток жовтих тканин і ниток. Але й у цьому разі жовта не служить головною тканиною вбрання, завжди лише додатковою, оздобною.
          - З цієї схеми є кілька винятків. Перший — мешканці передгір'я Ефель-Анґрену. Їхній одяг нерідко виявляє доволі великий вплив східних народів. Він також менш оздобний і більше пристосований до гірських умов. Тканини цупкіші, крої щільніше прилягають до тіла, на комірах, рукавах і шапках з'являється хутро.
          - Умбарські порти є перехрестям торгівців з усього узбережжя, тож тут переплітається безліч впливів і елементів, які переходять і в одяг сусідніх гарадських міст. У тамтешніх краях віддають перевагу простим блузам і коротким штанам, загалом одежі практичній і невибагливій у догляді. Тут узагалі більше люблять фіалкову барву, а в оздобі виразно проступає тема моря, мушель, спіралей та інших орнаментів.
          - Ще одна група вплинула на одяг гарадського суспільства, точніше радше на його оздобу. Це магуди, вершники на мумакілах. Їхнє захисне ритуальне татуювання й розмальовування по цілому тілу поширилося серед усіх груп, і рідко зустрінете гарадрима без ліній і крапок на обличчі, хоча сьогодні вони мають уже лише оздобну функцію.
      - title: Озброєння та влаштування сил
        paragraphs:
          - Якщо не зважати на відмінне виконання — обробку — і на багряну барву вбрання вояків, можна сказати, що бойове спорядження гарадського війська не надто відрізняється від спорядження союзників чи супротивників. Хіба що гарадрими перед стьобаними й підбитими обладунками часто віддають перевагу обладункам шкіряним або плетеним із найрізноманітніших рослинних матеріалів, мотузок, волокон, а то й шкіряних ремінців. Ці „рогожані" обладунки, доповнені подальшими зміцнювальними елементами, як-от прутами чи смугами металу, теж часто служать додатковим шаром поверх іншого типу обладунку.
          - Із залізних обладунків великою прихильністю тішиться кольчуга. Найзаможніші воїни використовують обладунки, складені із залізних смуг, лусок, ламелей… Більші пластини можна побачити хіба що на додаткових захисних частинах, на наручах, поножах вершників і насамперед на шоломах. Ті здебільшого конічної форми, з наносником, прикриті смугою тканини, яка захищає металеву пластину від розпечення. Замість металевого шолома вживають і повстяні, підбиті або шкіряні шапки та, звісно, кольчужні каптури.
          - 'Про зброю гарадських військ можна сказати те саме, що й про спорядження: загалом ті самі типи, що й у їхніх супротивників і побратимів, різняться передусім формою та виконанням. Довгі прямі мечі північан трапляються лише як частина здобичі, гарадрими в цьому напрямі віддають перевагу найрізноманітнішим типам шабель, мачете, тесаків, палашів. Насамперед кінні загони часто використовують у бою сокири або булави з кулястою головкою. Типовий член добре спорядженої ватаги виступає в бій озброєний тесаком або довшим кинджалом, шаблею як побічною зброєю і списом — або важким піхотним, понад два сажні завдовжки, або коротшою легшою версією, доповненою щитом.'
          - Серед гарадримів не знайшла надто великої прихильності дворучна зброя на кшталт великих мечів і палиць, часом можна побачити окремих осіб із сокирами з півмісяцевим лезом на довгих держаках. Зі стрілецької зброї сильно переважають луки, чи то короткі кінні, чи їхні довші піхотні варіанти. Ідеться про луки так званого східного типу, себто зброю з подвійно вигнутою основою.
          - 'Давніший тип гарадських щитів має овальну форму, нині переважають щити круглі, чи то дерев''яні, чи лозяний кістяк, обтягнутий сирицею. Оздоба щитів відповідає гарадському стилю та барвним звичаям. Щити магудів теж двох типів: або у формі дуже видовженого еліпса із загостреними кінцями, або у формі вісімки. Їхню оздобу утворюють лінії, площини й геометричні фігури в якнайстрокатішому поєднанні барв, причому завжди переважають червоні та брунатні барви.'
          - Найвищим воєводою гарадського війська є, звісно, султан. Обладунок він убирає лише в разі Карсиламу, себто скликання всіх ватаг. За неучасті султана і в менших походах командування в руках наїба, можна б сказати маршалка Гараду. Йому прямо підпорядковані аміри, з чиїх лав наїба, зрештою, часто й обирають. Це грізні володарі найбільших прикордонних твердинь, і в руках амірів також організація торгівлі невільниками, передусім їх здобування. Кажуть, що найбільші з амірів блиском свого двору затьмарювали самого султана.
          - Ватаги — це військові загони точно не визначеної кількості. У час спокою їх утворюють дружина аміра й залога твердині, у разі воєнного походу їхня кількість примножується новобранцями з близької околиці й найманськими загонами. Ватага складається із загонів легкої піхоти, як це властиво прикордонним ватагам, чиїм завданням є чинити швидкі випади на терен ворога. Обладунки вояків здебільшого шкіряні, рогожані, можна побачити й легкі стьобані каптани (часто здобичні). До типового спорядження належать короткий спис і щит, а часом і довший піхотний спис, за другу зброю часто править шабля, а то й півмісяцева сокира чи булава. За запасну зброю служать тесаки, довгі ножі й мачете. Зі стрілецької зброї переважають луки.
