side: evil
i18n:
  cs:
    name: Skřeti a Skuruti
    tagline: Hladová tlama Stínu, řev bojiště, špína, hněv a strach.
    combat_style:
      - skřetí pěchota a hordy
      - kyje, sekery, krátké meče
      - lehčí brnění z kůže a plátů
      - hromadný útok a křik
    recommended_for:
      - nováčci, kteří chtějí hodně boje a jednoduchý kostým
      - hráči se zájmem o temnou stranu
      - skupiny, které spolu chtějí útočit v hordě
    not_recommended_for:
      - hráči hledající čistou heraldiku a noblesu
      - hráči, kteří mají rádi tichou hru
    tags:
      - síla temného pána
      - vhodné pro nováčky
      - hromadný boj
      - nižší kostýmová náročnost
    newbie_costume_hint: Tmavé hadry, kožený postroj, špinavá lněná tunika, maska nebo bodypaint. Méně lesku, víc rzi a popela. Nemusíš být perfektní — důležité je vypadat jako bytost ze Stínu.
    camp_hook: Tábor skřetů voní spáleninou, syrovým masem a posměchem k těm, kdo věří v naději. Hluk, oheň, řev — Stín hodující na vlastní stravě.
    costume_colors_text: 'černá, hnědá, tmavě šedá; doplňkově šarlatová'
    heraldry_text: 'Různé znaky: Rudé oko, znaky generálů Saurona, klanové a osobní symboly.'
    ruler:
      name: Náčelník skřetí hordy
      title: Vůdce zvolený silou, ne hlasem
      description: Skřet, který přežil víc bitev než kdokoliv kolem. Nedrží trůn — drží paži, která ostatní strhne do útoku. Hráč skřetí hordy ho sleduje, protože to je jediný způsob, jak nezůstat vzadu, kde si Stín bere těla pro krmení vlků.
    lore_sections:
      - title: Stylizace kostýmu
        paragraphs:
          - Skřetí válečník obléká špinavé otrhané oděvy, doplněné o kůži, kožešiny, kosti. Základem kostýmu je celotělový make-up v černé, popřípadě šedé či hnědé barvě. Je možno jej doplnit o červené malování části obličeje. Vhodná je obličejová maska (není povinná, ale velmi potěší). Do stylizace kostýmu zahrneme i výzbroj, neb je u všech sarků shodná. Nejčastěji kruhové štíty různých velikostí, ale i jiné tvary jsou přípustné. Jako ruční zbraně zakřivené šavle, kopí (i delší), jako doplňkové zbraně sekyry, palcáty a kladiva. Vzácnější jsou obouruční drtivé zbraně. Střelci používají rohovité luky nebo kuše. Základem zbroje jsou přilbice, u většiny doplněné o lehké prošívané či kožené zbroje, působící zflikovaným dojmem (poskřetěné). Šťastnější mají kořistní, ale již orezlé kovové zbroje a případně zbroje přímo vlastní skřetí výroby. Časté jsou kompozitní pláty na končetinách a kyrysy. Obecně platí, že co kdo sežene a kam si to připevní, tam to má.
      - title: O skřetech
        paragraphs:
          - "Skřeti obývají rozsáhlá území Středozemě. Neexistuje však něco jako jednotný národ. Ani větší kmenové svazy, které skřeti hrdě nazývají říšemi, většinou nepřetrvají svého vládce. Mezi nesčetnými klany, válčícími mezi sebou, panují hluboké rozdíly. A to jak velikostní, kdy mohutní, svalnatí, výškou lidem podobní skřeti z Nurnu kontrastují s drobnými, šlachovitými lovci od Kosatcové řeky a z jižních částí Temného hvozdu, stejně jako s rozložitými hlavami a dlouhýma rukama skřetů od Železných hor. Pestré jsou i rozdíly jazykové, kdy si západní strana Mlžných hor nerozumí s\_východní a ploskonozí vrrčí jezdci od Vřesovišť kloudně nepromluví s tupolebci ze Železných hor."
          - Zajímavý je pohled, rozlišující severní, takzvaně Svobodné klany, od jižních, označovaných jako Otrocké. Toto označení se vžilo u severně usídlených kmenů. Skřeti, žijící v oblasti Mlžných, Šedých a Železných hor a jim přilehlých oblastech, se výrazně vymezují oproti svým jižněji žijícím soukmenovcům. Dávají najevo, že oni na rozdíl od snagů z jihu byli schopni i po odchodu Saurona vést rozsáhlé války proti elfům, lidem i trpaslíkům, vyvracet jejich říše a budovat vlastní. Zatímco slabošští jižanští snagové byli neustále zalezlí za Ephel Dúath u Nurnu a nedokázali nic, dokud znovu nepovstal Sauron. Jižanské kmeny negují tuto kritiku vyjádřením, že jde o žvásty nafoukaných seveřanských tlučhubů, který navíc nemaj dostatečnou úctu k Sauronovu majestátu, neboť jej považují jen za Morgothova proroka, zatímco jižní kmeny jej vnímají jako nové vtělení Morgothova ducha. Tuto nevraživost podpořilo v průběhu války promíchávání armádních skupin a později i některých sarků kvůli doplňování stavů. Navíc se obě strany od sebe velmi dobře poznají. Jižní klany mluví poměrně plynně starou formou Černé řeči, zatímco seveřané užívají v mnoha dialektech zkomolenou verzi. Je-li však něco, co skřety sjednocuje, pak je to touha zničit za jakoukoliv cenu své úhlavní nepřátele elfy a jejich lidské přisluhovače.
      - title: Odění, výzbroj a organizace skřetů
        paragraphs:
          - Skřetí oděv je šit z hrubých, těžkých látek, doplněných vydělanou kůží a kožešinami. Často připomíná parodii na oděv ostatních ras. Není však pravdou, že skřeti o svůj zevnějšek příliš nedbají. Naopak. Nesourodost, dotrhanost a hadrovitost oděvu má několik důvodů. Je třeba si uvědomit, že většina skřetů žije v početných klanech, v často chudé krajině, kde má každý zbytek, odřezek a cár látky či kůže značnou cenu. Kromě toho patří k přirozenosti skřetů snaha být jedinečný, unikátní a oproti všem rozpoznatelný. Toho skřeti dosahují výrobou ozdob z přírodních materiálů, jako jsou kosti, kůže, dřevo, kožešiny apod. Velmi časté jsou lovecké trofeje a ostřílení váleční veteráni zdobí svůj opasek nebo šerpu skalpy či ušima zabitých nepřátel.
          - Této snaze o jedinečnost napomáhá mimo jiné i poměrně rozsáhlá škála deformací obličeje. Ta není dána, jak se nesprávně uvádí, narozením, ale průběhem života. Starší skřeti mají obličej často zbrázděný množstvím mnohdy záměrně špatně sešitých jizev s patrnými následky zlomenin obličejových kostí, useknutých nosů, uší, vyražených očí, otoků a jiných následků rušného života této rasy.
          - O skřetech panuje značně nepřesná fáma, že mají černou kůži. Kdo však skřety někdy opravdu viděl, ví, že to není tak docela pravda. Barevné rozpětí pokožky sahá od nažloutle hnědé přes okrovou po různé odstíny šedé, přičemž nejsou vzácné ani případy jiných značně bizarních zbarvení pigmentu. Černou skřeti používají společně s dalšími barvami, jako je červená, fialová nebo hnědá, jako součást válečného nebo maskovacího malování, a to nejen obličejů, ale i dalších částí těla. Tradičně si skřetí sarky i trarky vytváří jednotné obličejové malování pro lepší rozpoznatelnost v bitvě.
          - "Do války se každý skřet vystrojí sám a z vlastních prostředků či za pomoci klanu, jak nejlépe dokáže. Tento zvyk byl dlouhou dobu narušován centrální výrobou zbraní a zbrojí válečnou mašinérií Mordorské říše, ale spolu s\_návratem ke klanovému způsobu života se skřeti vrátili ke klanové výrobě zbraní. Tyto kapacity jsou však dosti omezené, a tak valná část skřetů musí spoléhat jen na vlastní um či shánčlivost."
          - "Co se týče zbrojí, převažují skřetí lehkooděnci v prošívaných či vycpávaných zbrojích. Neméně časté jsou i kožené zbroje a mnozí skřeti mají i tvrzenou kůži jako svrchní zbroj na tenčí prošívce. Před začátkem války mělo jen málo skřetů lepší zbroj. Ta pak byla často kořistní (hlavně kroužkové zbroje). Jen málo klanů ovládalo umění metalurgie tak, že by dokázalo vyrábět kovové kyrysy a větší platnéřské komplety. Kovárny z Barad-dûr však vyzbrojily celé sarky kovovými zbrojemi různého rozsahu a kvality, a tyto kusy v\_klanech často zůstaly, i když několikrát změnily majitele. Nicméně to, co nechybí žádnému ze skřetích válečníků, který chce dočkat konce války ve zdraví, je přilbice. Nezměrné množství variant od klobouků, nánosníkových přileb a uzavřených přilbic. Kdo nedosáhne na přilbu, snaží se svou palici chránit alespoň batwatem a kroužkovou kuklou. I poslední lehký zvěd nebo lučištník, co se snaží neplést se do žádné velké mely, má na hlavě alespoň čapku."
          - Co se týče zbraní, je skřetí názor poměrně ujednocený. Standardní výzbrojí pěšáka, který ji někde nedbale nepoztrácí, je kruhový štít různé velikosti – často s pěstním držením, ale vyskytuje se i předloketní varianta, k tomu krátké kopí a zakřivená šavle. Jako záložní zbraně nebo příruční zbraň lučištníků se využívají dlouhé zakřivené nože a tesáky. Sekery a válečná kladiva nejsou již tak častá a jsou typická spíše pro těžkou pěchotu, stejně jako příruční palcáty. Ze střelných zbraní jsou tradiční luky, ale v poslední době dochází k nárůstu počtu kušovníků, neboť kuše nevyžaduje tak dlouhý trénink, aby byl střelec užitečný. I přes jistou standardizovanost běžnější výzbroje lze pochopitelně pozorovat různé odchylky, které vznikly podle potřeby jednotky nebo jsou klanovým zvykem. Některé větší štíty připomínají nedbale provedené pavézy. Poměrně nově se zavádí píky. U větších skřetů a olog-hai, stejně jako u jeskynních trolů, jsou k vidění velké dvojruční sekyry, kyje a kladiva.
          - Skřetí jednotky jsou tradičně organizovány na klanovém a případně kmenovém principu. Standardní velikost klanu odpovídá zhruba jednomu trarku. Sark je pak sdružením několika trarků – klanů, táhnoucích do války jako spojenci. Většinou se jedná o klany v rámci jednoho kmene, ve kterém existuje jistá, minimálně kulturně-jazyková, příbuznost. V případě spojení více kmenů (sarků) vzniká hoth – armáda, vojsko.
          - "Tohoto přirozeného členění bylo využito při sestavování Mordorské armády, nicméně některé klasické zvyky byly poupraveny. Například jednotky získaly předepsané stavy a vrchní velení nevychází ze středu jednotek, nýbrž je systém hodností a povyšování dán pevnými regulemi. V průběhu války byl navíc následkem ztrát porušen klasický klanový model trarku. Jednotlivé sarky a trarky začaly být doplňovány nováčky, kteří s původním klanem neměli nic do činění. Poměrně často docházelo ke slučování rozdrcených nebo skoro vybitých jednotek napříč celou klanovou strukturou. To mělo pozoruhodný následek v\_tom, že průzkumníci pozorují po pádu Saurona mnohem rychlejší tvorbu aliancí mezi klany a kmeny, což se přičítá vzájemnému obroušení hran a odlišností současných vůdců právě v\_těchto smíšených jednotkách."
          - Terminologické názvy jednotek a některé nápady byly inspirovány nebo převzaty z knihy Michala Špačka Skřetí spár, vydané v roce 2008 v edici Pevnost.
  en:
    name: Orcs and Uruk-hai
    tagline: The hungry maw of the Shadow — the roar of battle, filth, rage, and fear.
    combat_style:
      - Orc infantry and hordes
      - clubs, axes, short swords
      - lighter armour of leather and plates
      - mass charge and clamour
    recommended_for:
      - newcomers who want plenty of fighting and a simple costume
      - players drawn to the dark side
      - groups who want to charge together in a horde
    not_recommended_for:
      - players looking for clean heraldry and nobility
      - players who prefer quiet play
    tags:
      - might of the Dark Lord
      - newcomer friendly
      - mass combat
      - lower costume demands
    newbie_costume_hint: Dark rags, a leather harness, a filthy linen tunic, a mask or body paint. Less shine, more rust and ash. You do not have to be perfect — what matters is looking like a creature out of the Shadow.
    camp_hook: The Orc camp reeks of burning, raw meat and scorn for everyone who still believes in hope. Noise, fire, roaring — the Shadow feasting on its own fare.
    costume_colors_text: black, brown, dark grey; scarlet as an accent
    heraldry_text: 'Various devices: the Red Eye, the marks of Sauron''s generals, clan and personal symbols.'
    ruler:
      name: Chieftain of the Orc horde
      title: A leader chosen by strength, not by voice
      description: An Orc who has survived more battles than anyone around him. He holds no throne — he holds the arm that drags the rest into the charge. An Orc player follows him because that is the only way not to be left at the back, where the Shadow takes bodies to feed the wolves.
    lore_sections:
      - title: Costume styling
        paragraphs:
          - An Orc warrior wears filthy, tattered garments set off with leather, furs and bones. The foundation of the costume is full-body make-up in black, or else in grey or brown. It may be completed with red paint on part of the face. A face mask is welcome (not compulsory, but greatly appreciated). Weaponry belongs to the costume styling as well, for it is the same across all sarks. Most often round shields of various sizes, though other shapes are permitted too. For hand weapons, curved sabres and spears (longer ones as well); as secondary weapons axes, maces and hammers. Two-handed crushing weapons are rarer. Shooters use horn-shaped bows or crossbows. The basis of the armour is the helmet, on most warriors completed with light gambesons or leather armour that looks patched together (“orcified”). The luckier ones have plundered but already rusted metal armour, or armour of genuine Orc make. Composite plates on the limbs and cuirasses are common. As a general rule, whatever anyone can scrounge, and wherever he can fasten it, that is where he wears it.
      - title: About the Orcs
        paragraphs:
          - 'The Orcs inhabit vast territories of Middle-earth. There is, however, no such thing as one unified people. Not even the larger tribal unions, which the Orcs proudly call empires, usually outlast their ruler. Deep differences reign among the countless clans that war upon one another. Differences of size, where the massive, muscular Orcs of Nurn, as tall as Men, contrast with the small, wiry hunters from the Gladden River and the southern parts of Mirkwood, and just as much with the broad-headed, long-armed Orcs from the Iron Hills. The differences of language are colourful too: the western side of the Misty Mountains does not understand the eastern, and the flat-footed warg riders from the Heaths cannot get a sensible word across to the thick-skulls of the Iron Hills.'
          - There is an interesting view that distinguishes the northern, so-called Free clans from the southern ones, labelled the Slave clans. That label took root among the tribes settled in the north. The Orcs living in the region of the Misty Mountains, the Grey Mountains and the Iron Hills, and in the lands adjoining them, set themselves sharply apart from their more southerly kinsmen. They make it plain that they, unlike the snagas of the south, were able to wage extensive wars against Elves, Men and Dwarves even after Sauron's departure, to overthrow their realms and build realms of their own — while the weakling southern snagas skulked endlessly behind the Ephel Dúath by Nurn and achieved nothing until Sauron arose again. The southern tribes reject this criticism by declaring it the blather of puffed-up northern loudmouths who, moreover, lack proper reverence for Sauron's majesty, since they take him for nothing more than Morgoth's prophet, whereas the southern tribes see him as the new embodiment of Morgoth's spirit. This animosity was fed during the war by the mixing of army groups, and later of some sarks as well, in order to make up their numbers. Besides, the two sides know each other very well indeed. The southern clans speak the old form of the Black Speech fairly fluently, while the northerners use a garbled version of it in many dialects. Yet if there is one thing that unites the Orcs, it is the desire to destroy, at any cost, their arch-enemies the Elves and their human lackeys.
      - title: Garb, weaponry and organisation of the Orcs
        paragraphs:
          - Orc clothing is sewn from coarse, heavy cloths set off with tanned leather and furs. It often resembles a parody of the dress of the other races. It is not true, however, that Orcs care little for their appearance. Quite the opposite. The mismatched, torn and raggedy quality of their clothing has several reasons. It must be borne in mind that most Orcs live in populous clans, in country that is often poor, where every remnant, offcut and scrap of cloth or hide has considerable value. Besides that, it belongs to the Orc nature to strive to be singular, unique and recognisable apart from everyone else. Orcs achieve this by making ornaments from natural materials such as bones, hide, wood, fur and the like. Hunting trophies are very common, and seasoned war veterans adorn their belt or sash with the scalps or ears of slain enemies.
          - This striving for uniqueness is helped along, among other things, by a fairly broad range of facial deformities. These are not, as is wrongly stated, given at birth, but acquired in the course of life. Older Orcs often have faces furrowed with a mass of scars, frequently stitched badly on purpose, with visible consequences of broken facial bones, severed noses and ears, gouged eyes, swellings and other results of the eventful life of this race.
          - A greatly inaccurate rumour has it that Orcs have black skin. Anyone who has really seen Orcs, though, knows that this is not quite the truth. The range of skin colour runs from yellowish brown through ochre to various shades of grey, and cases of other markedly bizarre pigmentation are not rare either. Orcs use black together with further colours, such as red, purple or brown, as part of war paint or camouflage paint, and not only on the face but on other parts of the body as well. Traditionally, both Orc sarks and trarks devise a uniform face paint for better recognition in battle.
          - Every Orc equips himself for war on his own, out of his own means or with the help of his clan, as best he can. This custom was long disrupted by the central production of weapons and armour by the war machine of the Empire of Mordor, but together with the return to the clan way of life the Orcs have gone back to clan weapon-making. Those capacities are rather limited, however, and so the great part of the Orcs must rely on their own skill or scrounging alone.
          - As for armour, Orc light-armoured fighters in gambesons or padded armour predominate. Leather armours are no less common, and many Orcs also have hardened leather as an outer armour over a thinner gambeson. Before the war began, only a few Orcs had better armour. That was then often plunder (chiefly mail). Only a few clans mastered the art of metallurgy well enough to produce metal cuirasses and larger armourer's suits. The forges of Barad-dûr, however, armed whole sarks with metal armour of varying extent and quality, and those pieces often stayed within the clans even after changing owners several times. Nevertheless, the one thing no Orc warrior who means to see the end of the war in one piece goes without is a helmet. There is a boundless number of variants, from hats through nasal helms to closed helmets. Whoever cannot get hold of a helm tries to protect his skull at least with a batwat and a mail coif. Even the lowliest light scout or archer, who tries to keep out of any great melee, has at least a cap on his head.
          - As for weapons, Orc opinion is fairly unanimous. The standard equipment of a foot soldier, provided he has not carelessly lost it somewhere, is a round shield of varying size – often with a centre grip, though the forearm variant occurs as well – along with a short spear and a curved sabre. Long curved knives and cleavers serve as backup weapons or as the archers' sidearm. Axes and war hammers are no longer so common and are typical rather of the heavy infantry, as are hand maces. Among missile weapons bows are traditional, but lately the number of crossbowmen has been growing, since a crossbow does not demand such long training for a shooter to be useful. Despite a certain standardisation of the commoner equipment, various departures can of course be observed, arising from the needs of a unit or from clan custom. Some larger shields resemble carelessly made pavises. Pikes are a fairly recent introduction. Among the larger Orcs and the olog-hai, as among cave trolls, great two-handed axes, clubs and hammers are to be seen.
          - Orc units are traditionally organised on a clan and, where applicable, tribal principle. The standard size of a clan corresponds roughly to one trark. A sark is then an association of several trarks — clans marching to war as allies. Mostly these are clans within a single tribe, in which a certain kinship exists, at the least a cultural and linguistic one. When several tribes (sarks) join together, a hoth arises — an army, a host.
          - This natural division was used in assembling the army of Mordor, though some of the classic customs were adjusted. Units were given prescribed strengths, for instance, and the high command does not arise from within the units; instead, the system of ranks and promotion is set by firm regulations. In the course of the war, moreover, losses broke the classic clan model of the trark. Individual sarks and trarks began to be filled up with newcomers who had nothing to do with the original clan. Fairly often, shattered or almost wiped-out units were merged right across the whole clan structure. This had the remarkable consequence that, since the fall of Sauron, scouts observe a much swifter forming of alliances between clans and tribes, which is put down to the mutual smoothing of the edges and differences of the present leaders precisely in those mixed units.
          - The terminological names of the units and some of the ideas were inspired by, or taken from, Michal Špaček's book Skřetí spár (The Orc Claw), published in 2008 in the Pevnost imprint.
  de:
    name: Orks und Uruk-hai
    tagline: Der hungrige Rachen des Schattens — das Brüllen der Schlacht, Schmutz, Zorn und Furcht.
    combat_style:
      - Orkinfanterie und Horden
      - Keulen, Äxte, Kurzschwerter
      - leichtere Rüstung aus Leder und Platten
      - Massenangriff und Gebrüll
    recommended_for:
      - Neulinge, die viel Kampf und ein einfaches Kostüm wollen
      - Spieler mit Interesse an der dunklen Seite
      - Gruppen, die gemeinsam in der Horde angreifen wollen
    not_recommended_for:
      - Spieler, die reine Heraldik und Vornehmheit suchen
      - Spieler, die stilles Spiel mögen
    tags:
      - Macht des Dunklen Herrschers
      - für Neulinge geeignet
      - Massenkampf
      - geringere Kostümanforderungen
    newbie_costume_hint: Dunkle Lumpen, ein Ledergeschirr, eine schmutzige Leinentunika, eine Maske oder Bodypaint. Weniger Glanz, mehr Rost und Asche. Du musst nicht perfekt sein — wichtig ist, wie ein Wesen aus dem Schatten auszusehen.
    camp_hook: Das Orklager riecht nach Brand, rohem Fleisch und Hohn für alle, die noch an Hoffnung glauben. Lärm, Feuer, Gebrüll — der Schatten, der an seiner eigenen Kost schmaust.
    costume_colors_text: Schwarz, Braun, Dunkelgrau; ergänzend Scharlachrot
    heraldry_text: 'Verschiedene Zeichen: das Rote Auge, die Zeichen der Feldherren Saurons, Klan- und persönliche Symbole.'
    ruler:
      name: Häuptling der Orkhorde
      title: Ein Anführer, den die Kraft wählt, nicht die Stimme
      description: Ein Ork, der mehr Schlachten überlebt hat als alle um ihn her. Er hält keinen Thron — er hält den Arm, der die anderen in den Angriff reißt. Der Spieler eines Orks folgt ihm, weil das der einzige Weg ist, nicht hinten zu bleiben, wo der Schatten die Leiber nimmt, um die Wölfe zu füttern.
    lore_sections:
      - title: Stilisierung des Kostüms
        paragraphs:
          - 'Der Orkkrieger trägt schmutzige, zerlumpte Gewänder, ergänzt durch Leder, Felle und Knochen. Grundlage des Kostüms ist ein Ganzkörper-Make-up in Schwarz, allenfalls in Grau oder Braun. Es lässt sich durch rote Malerei auf einem Teil des Gesichts ergänzen. Eine Gesichtsmaske ist angebracht (keine Pflicht, aber sehr willkommen). Zur Stilisierung des Kostüms zählt auch die Bewaffnung, denn sie ist bei allen Sarks gleich. Am häufigsten Rundschilde verschiedener Größe, doch auch andere Formen sind zulässig. Als Handwaffen krumme Säbel und Speere (auch längere), als Zusatzwaffen Äxte, Streitkolben und Hämmer. Seltener sind zweihändige Wuchtwaffen. Schützen verwenden hornartige Bögen oder Armbrüste. Grundlage der Rüstung ist der Helm, bei den meisten ergänzt um leichte Steppwesten oder Lederrüstungen, die zusammengeflickt wirken („verorkt“). Die Glücklicheren haben erbeutete, aber schon verrostete Metallrüstungen und mitunter Rüstungen aus eigener Orkfertigung. Häufig sind Kompositplatten an den Gliedmaßen und Kürasse. Allgemein gilt: Was einer auftreibt und wo er es befestigt, dort trägt er es.'
      - title: Über die Orks
        paragraphs:
          - 'Die Orks bewohnen weite Gebiete Mittelerdes. Etwas wie ein einheitliches Volk gibt es jedoch nicht. Auch die größeren Stammesbünde, die die Orks stolz Reiche nennen, überdauern ihren Herrscher meist nicht. Zwischen den unzähligen Klanen, die gegeneinander Krieg führen, herrschen tiefe Unterschiede. Und zwar solche der Größe, wenn die mächtigen, muskulösen, den Menschen an Wuchs ähnlichen Orks aus Nurn mit den kleinen, drahtigen Jägern vom Schwertelfluss und aus den südlichen Teilen des Düsterwalds kontrastieren, ebenso wie mit den breitköpfigen, langarmigen Orks von den Eisenbergen. Bunt sind auch die sprachlichen Unterschiede: Die Westseite des Nebelgebirges versteht die Ostseite nicht, und die plattfüßigen Wargreiter von den Heiden bringen mit den Dickschädeln aus den Eisenbergen kein vernünftiges Wort zustande.'
          - Interessant ist die Sicht, die die nördlichen, sogenannten Freien Klane von den südlichen unterscheidet, die als Sklavenklane bezeichnet werden. Diese Bezeichnung hat sich bei den im Norden ansässigen Stämmen eingebürgert. Die Orks, die im Gebiet des Nebelgebirges, des Grauen Gebirges und der Eisenberge sowie in den angrenzenden Gegenden leben, grenzen sich deutlich von ihren südlicher lebenden Stammesgenossen ab. Sie machen deutlich, dass sie im Unterschied zu den Snagas aus dem Süden auch nach dem Fortgang Saurons imstande waren, umfangreiche Kriege gegen Elben, Menschen und Zwerge zu führen, deren Reiche zu stürzen und eigene zu errichten — während die schwächlichen südlichen Snagas ständig hinter dem Ephel Dúath bei Nurn verkrochen waren und nichts zustande brachten, bis Sauron wieder erstand. Die südlichen Stämme weisen diese Kritik zurück und erklären, es sei Geschwätz aufgeblasener nördlicher Großmäuler, die zudem nicht genug Achtung vor der Majestät Saurons hätten, denn sie hielten ihn nur für einen Propheten Morgoths, während die südlichen Stämme ihn als neue Verkörperung des Geistes Morgoths begreifen. Diese Feindseligkeit wurde im Laufe des Krieges durch die Vermischung von Heeresgruppen und später auch einiger Sarks zur Auffüllung der Bestände verstärkt. Zudem erkennen sich beide Seiten sehr gut. Die südlichen Klane sprechen recht flüssig eine alte Form der Schwarzen Sprache, während die Nordleute in vielen Dialekten eine verballhornte Fassung verwenden. Wenn es aber etwas gibt, das die Orks einigt, dann ist es der Wunsch, um jeden Preis ihre Erzfeinde, die Elben, und deren menschliche Helfershelfer zu vernichten.
      - title: Kleidung, Bewaffnung und Organisation der Orks
        paragraphs:
          - Orkkleidung wird aus grobem, schwerem Stoff genäht, ergänzt durch gegerbtes Leder und Felle. Oft erinnert sie an eine Parodie der Kleidung der anderen Rassen. Es ist jedoch nicht wahr, dass die Orks auf ihr Äußeres wenig achten. Im Gegenteil. Die Uneinheitlichkeit, Zerrissenheit und Lumpigkeit der Kleidung hat mehrere Gründe. Man muss bedenken, dass die meisten Orks in zahlreichen Klanen leben, in oft armer Landschaft, wo jeder Rest, jedes Abschnittstück und jeder Fetzen Stoff oder Leder erheblichen Wert hat. Außerdem gehört es zur Natur der Orks, einzigartig, unverwechselbar und von allen anderen unterscheidbar sein zu wollen. Das erreichen die Orks durch die Herstellung von Zierwerk aus natürlichen Materialien wie Knochen, Leder, Holz, Fell und Ähnlichem. Sehr häufig sind Jagdtrophäen, und altgediente Kriegsveteranen schmücken ihren Gürtel oder ihre Schärpe mit Skalpen oder Ohren erschlagener Feinde.
          - Diesem Streben nach Einzigartigkeit hilft unter anderem eine recht große Bandbreite von Gesichtsentstellungen. Sie ist nicht, wie fälschlich behauptet wird, von Geburt gegeben, sondern im Laufe des Lebens erworben. Ältere Orks haben das Gesicht oft von einer Menge oftmals absichtlich schlecht genähter Narben zerfurcht, mit sichtbaren Folgen von Brüchen der Gesichtsknochen, abgeschnittenen Nasen und Ohren, ausgeschlagenen Augen, Schwellungen und anderen Folgen des unruhigen Lebens dieser Rasse.
          - Über die Orks geht das recht ungenaue Gerücht, sie hätten schwarze Haut. Wer die Orks aber je wirklich gesehen hat, weiß, dass das nicht ganz stimmt. Die Farbspanne der Haut reicht von gelblichem Braun über Ocker bis zu verschiedenen Grautönen, wobei auch Fälle anderer recht bizarrer Pigmentierung nicht selten sind. Schwarz verwenden die Orks gemeinsam mit weiteren Farben wie Rot, Violett oder Braun als Teil der Kriegs- oder Tarnmalerei, und zwar nicht nur im Gesicht, sondern auch an anderen Körperteilen. Traditionell schaffen sich orkische Sarks wie Trarks eine einheitliche Gesichtsmalerei zur besseren Erkennbarkeit in der Schlacht.
          - In den Krieg rüstet sich jeder Ork selbst und aus eigenen Mitteln oder mit Hilfe des Klans, so gut er kann. Dieser Brauch wurde lange Zeit durch die zentrale Herstellung von Waffen und Rüstungen durch die Kriegsmaschinerie des Reiches Mordor gestört, doch mit der Rückkehr zur klanmäßigen Lebensweise sind die Orks zur klaneigenen Waffenfertigung zurückgekehrt. Diese Kapazitäten sind allerdings recht begrenzt, und so muss sich der überwiegende Teil der Orks allein auf eigenes Können oder eigene Findigkeit verlassen.
          - Was die Rüstungen betrifft, überwiegen orkische Leichtgerüstete in Stepp- oder Polsterrüstungen. Nicht weniger häufig sind auch Lederrüstungen, und viele Orks haben zudem gehärtetes Leder als Oberrüstung über einer dünneren Steppweste. Vor Kriegsbeginn hatten nur wenige Orks eine bessere Rüstung. Diese war dann oft Beute (vor allem Kettenrüstungen). Nur wenige Klane beherrschten die Kunst der Metallurgie so weit, dass sie Metallkürasse und größere Plattnergarnituren herstellen konnten. Die Schmieden von Barad-dûr rüsteten jedoch ganze Sarks mit Metallrüstungen unterschiedlichen Umfangs und unterschiedlicher Güte aus, und diese Stücke blieben oft in den Klanen, auch wenn sie mehrmals den Besitzer wechselten. Was jedoch keinem Orkkrieger fehlt, der das Ende des Krieges bei Gesundheit erleben will, ist der Helm. Eine unermessliche Zahl von Varianten, von Hüten über Nasenhelme bis zu geschlossenen Helmen. Wer keinen Helm ergattert, versucht seinen Schädel wenigstens mit einem Batwat und einer Kettenhaube zu schützen. Selbst der letzte leichte Späher oder Bogenschütze, der sich aus jedem großen Handgemenge heraushalten will, hat zumindest eine Kappe auf dem Kopf.
          - Was die Waffen betrifft, ist die orkische Meinung recht einheitlich. Standardbewaffnung eines Fußkämpfers, der sie nicht irgendwo achtlos verliert, ist ein Rundschild verschiedener Größe – oft mit Faustgriff, doch kommt auch die Unterarmvariante vor –, dazu ein kurzer Speer und ein krummer Säbel. Als Reservewaffen oder als Handwaffe der Bogenschützen dienen lange krumme Messer und Hauer. Äxte und Kriegshämmer sind nicht mehr so häufig und eher für die schwere Infanterie typisch, ebenso wie Handstreitkolben. Von den Fernwaffen sind Bögen traditionell, doch nimmt in letzter Zeit die Zahl der Armbrustschützen zu, denn die Armbrust verlangt kein so langes Training, damit ein Schütze nützlich ist. Trotz einer gewissen Standardisierung der üblicheren Bewaffnung lassen sich natürlich verschiedene Abweichungen beobachten, die nach dem Bedarf der Einheit entstanden sind oder Klanbrauch sind. Manche größeren Schilde erinnern an nachlässig ausgeführte Pavesen. Recht neu werden Piken eingeführt. Bei größeren Orks und Olog-hai, ebenso wie bei Höhlentrollen, sind große zweihändige Äxte, Keulen und Hämmer zu sehen.
          - Orkische Einheiten sind traditionell nach dem Klan- und gegebenenfalls Stammesprinzip organisiert. Die Standardgröße eines Klans entspricht etwa einem Trark. Ein Sark ist dann ein Verband mehrerer Trarks — von Klanen, die als Verbündete in den Krieg ziehen. Meist handelt es sich um Klane innerhalb eines Stammes, in dem eine gewisse, mindestens kulturell-sprachliche Verwandtschaft besteht. Bei der Verbindung mehrerer Stämme (Sarks) entsteht ein Hoth — ein Heer, eine Streitmacht.
          - Diese natürliche Gliederung wurde beim Aufbau des Heeres von Mordor genutzt, doch einige klassische Bräuche wurden angepasst. So erhielten die Einheiten etwa vorgeschriebene Sollstärken, und die Oberbefehlsgewalt geht nicht aus der Mitte der Einheiten hervor, sondern das System der Rangstufen und Beförderungen ist durch feste Regeln bestimmt. Im Laufe des Krieges wurde zudem infolge der Verluste das klassische Klanmodell des Trarks gebrochen. Einzelne Sarks und Trarks wurden mit Neulingen aufgefüllt, die mit dem ursprünglichen Klan nichts zu tun hatten. Recht oft kam es zur Zusammenlegung zerschlagener oder fast ausgelöschter Einheiten quer durch die gesamte Klanstruktur. Das hatte die bemerkenswerte Folge, dass Kundschafter seit dem Sturz Saurons eine viel schnellere Bildung von Bündnissen zwischen Klanen und Stämmen beobachten, was dem gegenseitigen Abschleifen der Kanten und Unterschiede der heutigen Anführer eben in diesen gemischten Einheiten zugeschrieben wird.
          - Die terminologischen Bezeichnungen der Einheiten und einige Ideen wurden vom Buch Skřetí spár (Die Orkkralle) von Michal Špaček angeregt oder daraus übernommen; es erschien 2008 in der Edition Pevnost.
  sk:
    name: Škreti a Škurati
    tagline: Hladová tlama Tieňa — rev bojiska, špina, hnev a strach.
    combat_style:
      - škretia pechota a hordy
      - kyje, sekery, krátke meče
      - ľahšia zbroj z kože a plátov
      - hromadný útok a rev
    recommended_for:
      - nováčkovia, ktorí chcú veľa boja a jednoduchý kostým
      - hráči so záujmom o temnú stranu
      - skupiny, ktoré chcú útočiť spolu v horde
    not_recommended_for:
      - hráči, ktorí hľadajú čistú heraldiku a noblesu
      - hráči, ktorí majú radi tichú hru
    tags:
      - sila temného pána
      - vhodné pre nováčkov
      - hromadný boj
      - nižšia kostýmová náročnosť
    newbie_costume_hint: Tmavé handry, kožený postroj, špinavá ľanová tunika, maska alebo bodypaint. Menej lesku, viac hrdze a popola. Nemusíš byť perfektný — dôležité je vyzerať ako bytosť z Tieňa.
    camp_hook: Tábor škretov zapácha spáleným, surovým mäsom a posmechom voči tým, ktorí veria v nádej. Hluk, oheň, rev — Tieň hodujúci na vlastnej strave.
    costume_colors_text: čierna, hnedá, tmavosivá; doplnkovo šarlátová
    heraldry_text: 'Rôzne znaky: Červené oko, znaky Sauronových generálov, klanové a osobné symboly.'
    ruler:
      name: Náčelník škretej hordy
      title: Vodca zvolený silou, nie hlasom
      description: Škret, ktorý prežil viac bitiek než ktokoľvek okolo. Nedrží trón — drží ruku, ktorá ostatných strhne do útoku. Hráč škreta ho nasleduje, pretože je to jediný spôsob, ako nezostať vzadu, kde si Tieň berie telá na krmivo pre vlkov.
    lore_sections:
      - title: Stylizácia kostýmu
        paragraphs:
          - Škretí bojovník si oblieka špinavé, odraté odevy doplnené kožou, kožušinami a kosťami. Základom kostýmu je celotelový make-up v čiernej, prípadne sivej či hnedej farbe. Možno ho doplniť červeným maľovaním časti tváre. Vhodná je tvárová maska (nie je povinná, ale veľmi poteší). Do stylizácie kostýmu patrí aj výzbroj, veď je u všetkých sarkov rovnaká. Najčastejšie okrúhle štíty rôznych veľkostí, ale prípustné sú aj iné tvary. Ako ručné zbrane zakrivené šable a kopije (aj dlhšie), ako doplnkové zbrane sekery, palcáty a kladivá. Vzácnejšie sú obojručné drviace zbrane. Strelci používajú rohovité luky alebo kuše. Základom zbroje sú prilby, u väčšiny doplnené ľahkými prešívanými či koženými zbrojami, ktoré pôsobia zaplátaným dojmom (poškretené). Šťastnejší majú koristné, ale už zhrdzavené kovové zbroje, prípadne zbroje priamo vlastnej škretej výroby. Časté sú kompozitné pláty na končatinách a kyrysy. Vo všeobecnosti platí, že čo kto zoženie a kam si to pripevní, tam to má.
      - title: O škretoch
        paragraphs:
          - Škreti obývajú rozsiahle územia Stredozeme. Nič také ako jednotný národ však neexistuje. Ani väčšie kmeňové zväzy, ktoré škreti hrdo nazývajú ríšami, väčšinou nepretrvajú svojho vládcu. Medzi nespočetnými klanmi, ktoré medzi sebou vedú vojny, panujú hlboké rozdiely. A to aj veľkostné, keď mohutní, svalnatí, výškou ľuďom podobní škreti z Nurnu kontrastujú s drobnými, šľachovitými lovcami od Kosatcovej rieky a z južných častí Temného hvozdu, rovnako ako so širokohlavými a dlhorukými škretmi od Železných hôr. Pestré sú aj jazykové rozdiely, keď si západná strana Hmlistých hôr nerozumie s východnou a plochonohí jazdci na vrrkoch od Vresovísk sa poriadne nedohovoria s tupolebcami zo Železných hôr.
          - Zaujímavý je pohľad, ktorý rozlišuje severné, takzvané Slobodné klany, od južných, označovaných ako Otrocké. Toto označenie sa vžilo u kmeňov usídlených na severe. Škreti, ktorí žijú v oblasti Hmlistých, Sivých a Železných hôr a v priľahlých krajoch, sa výrazne vymedzujú oproti svojim južnejšie žijúcim súkmeňovcom. Dávajú najavo, že oni na rozdiel od snagov z juhu boli schopní aj po Sauronovom odchode viesť rozsiahle vojny proti elfom, ľuďom aj trpaslíkom, vyvracať ich ríše a budovať vlastné — kým slabošskí južanskí snagovia sa neustále skrývali za Ephel Dúath pri Nurne a nedokázali nič, dokým znovu nepovstal Sauron. Južanské kmene túto kritiku popierajú vyjadrením, že ide o bľabot nadutých severských tlčhubov, ktorí navyše nemajú dostatočnú úctu k Sauronovmu majestátu, keďže ho považujú len za Morgothovho proroka, zatiaľ čo južné kmene ho vnímajú ako nové vtelenie Morgothovho ducha. Túto nevraživosť podporilo v priebehu vojny premiešavanie armádnych skupín a neskôr aj niektorých sarkov kvôli dopĺňaniu stavov. Navyše sa obe strany navzájom veľmi dobre rozoznajú. Južné klany hovoria pomerne plynne starou formou Čiernej reči, kým severania používajú v mnohých dialektoch skomolenú verziu. Ak je však niečo, čo škretov spája, potom je to túžba za každú cenu zničiť svojich hlavných nepriateľov, elfov a ich ľudských prisluhovačov.
      - title: Odev, výzbroj a organizácia škretov
        paragraphs:
          - Škretí odev sa šije z hrubých, ťažkých látok, doplnených vydelanou kožou a kožušinami. Často pripomína paródiu na odev ostatných rás. Nie je však pravda, že škreti na svoj vzhľad príliš nedbajú. Naopak. Nesúrodosť, potrhanosť a handrovitosť odevu má niekoľko dôvodov. Treba si uvedomiť, že väčšina škretov žije v početných klanoch, v často chudej krajine, kde má každý zvyšok, odrezok a franforec látky či kože značnú cenu. Okrem toho patrí k prirodzenosti škretov snaha byť jedinečný, neopakovateľný a oproti všetkým rozpoznateľný. To škreti dosahujú výrobou ozdôb z prírodných materiálov, ako sú kosti, koža, drevo, kožušiny a podobne. Veľmi časté sú lovecké trofeje a ostrieľaní vojnoví veteráni si zdobia opasok alebo šerpu skalpmi či ušami zabitých nepriateľov.
          - Tejto snahe o jedinečnosť pomáha okrem iného aj pomerne rozsiahla škála deformácií tváre. Tá nie je daná, ako sa nesprávne uvádza, narodením, ale priebehom života. Starší škreti majú tvár často zbrázdenú množstvom neraz zámerne zle zošitých jaziev s viditeľnými následkami zlomenín tvárových kostí, odťatých nosov, uší, vyrazených očí, opuchov a iných následkov rušného života tejto rasy.
          - O škretoch panuje značne nepresná fáma, že majú čiernu kožu. Kto však škretov niekedy naozaj videl, vie, že to nie je celkom pravda. Farebné rozpätie pokožky siaha od žltkasto hnedej cez okrovú až po rôzne odtiene sivej, pričom nie sú vzácne ani prípady iných značne bizarných zafarbení pigmentu. Čiernu škreti používajú spolu s ďalšími farbami, ako je červená, fialová alebo hnedá, ako súčasť vojnového či maskovacieho maľovania, a to nielen tváre, ale aj ďalších častí tela. Škretie sarky aj trarky si tradične vytvárajú jednotné maľovanie tváre pre lepšiu rozpoznateľnosť v bitke.
          - Do vojny sa každý škret vystrojí sám a z vlastných prostriedkov či s pomocou klanu, ako najlepšie dokáže. Tento zvyk dlhý čas narúšala centrálna výroba zbraní a zbrojí vojnovou mašinériou Mordorskej ríše, ale spolu s návratom ku klanovému spôsobu života sa škreti vrátili ku klanovej výrobe zbraní. Tieto kapacity sú však dosť obmedzené, a tak sa veľká časť škretov musí spoliehať len na vlastný um či vynaliezavosť.
          - Čo sa týka zbrojí, prevažujú škretí ľahkoodenci v prešívaných či vypchávaných zbrojach. Nemenej časté sú aj kožené zbroje a mnohí škreti majú tvrdenú kožu ako vrchnú zbroj na tenšej prešívke. Pred začiatkom vojny malo lepšiu zbroj len málo škretov. Tá potom bola často koristná (hlavne krúžkové zbroje). Len málo klanov ovládalo umenie metalurgie tak, aby dokázalo vyrábať kovové kyrysy a väčšie platnérske komplety. Kováčske dielne z Barad-dûr však vyzbrojili celé sarky kovovými zbrojami rôzneho rozsahu a kvality a tieto kusy v klanoch často zostali, aj keď viackrát zmenili majiteľa. To, čo však nechýba žiadnemu škretiemu bojovníkovi, ktorý sa chce dožiť konca vojny v zdraví, je prilba. Nezmerné množstvo variantov od klobúkov cez prilby s nánosníkom až po uzavreté prilby. Kto na prilbu nedosiahne, snaží sa svoju hlavu chrániť aspoň batwatom a krúžkovou kuklou. Aj ten posledný ľahký zved alebo lukostrelec, ktorý sa snaží nepliesť sa do žiadnej veľkej mely, má na hlave aspoň čiapku.
          - Čo sa týka zbraní, škretí názor je pomerne jednotný. Štandardnou výzbrojou pešiaka, ktorý ju niekde nedbalo nestratí, je okrúhly štít rôznej veľkosti – často s pästným držaním, no vyskytuje sa aj predloketná varianta –, k tomu krátka kopija a zakrivená šabľa. Ako záložné zbrane alebo príručná zbraň lukostrelcov sa využívajú dlhé zakrivené nože a tesáky. Sekery a vojnové kladivá už nie sú také časté a sú typické skôr pre ťažkú pechotu, rovnako ako príručné palcáty. Zo strelných zbraní sú tradičné luky, ale v poslednom čase narastá počet strelcov s kušou, keďže kuša nevyžaduje taký dlhý tréning, aby bol strelec užitočný. Aj napriek istej štandardizovanosti bežnejšej výzbroje možno pochopiteľne pozorovať rôzne odchýlky, ktoré vznikli podľa potreby jednotky alebo sú klanovým zvykom. Niektoré väčšie štíty pripomínajú nedbalo vyhotovené pavézy. Pomerne novo sa zavádzajú piky. U väčších škretov a olog-hai, rovnako ako u jaskynných trolov, možno vidieť veľké dvojručné sekery, kyje a kladivá.
          - Škretie jednotky sú tradične organizované na klanovom a prípadne kmeňovom princípe. Štandardná veľkosť klanu zodpovedá približne jednému trarku. Sark je potom združením niekoľkých trarkov — klanov, ktoré tiahnu do vojny ako spojenci. Väčšinou ide o klany v rámci jedného kmeňa, v ktorom existuje istá, minimálne kultúrno-jazyková príbuznosť. V prípade spojenia viacerých kmeňov (sarkov) vzniká hoth — armáda, vojsko.
          - Toto prirodzené členenie sa využilo pri zostavovaní Mordorskej armády, niektoré klasické zvyky sa však upravili. Napríklad jednotky dostali predpísané stavy a vrchné velenie nevychádza zo stredu jednotiek, ale systém hodností a povyšovania je daný pevnými pravidlami. V priebehu vojny bol navyše v dôsledku strát porušený klasický klanový model trarku. Jednotlivé sarky a trarky sa začali dopĺňať nováčkami, ktorí s pôvodným klanom nemali nič do činenia. Pomerne často dochádzalo k zlučovaniu rozdrvených alebo takmer vybitých jednotiek naprieč celou klanovou štruktúrou. To malo pozoruhodný následok v tom, že zvedovia po Sauronovom páde pozorujú oveľa rýchlejšie vytváranie aliancií medzi klanmi a kmeňmi, čo sa pripisuje vzájomnému obrúseniu hrán a odlišností súčasných vodcov práve v týchto zmiešaných jednotkách.
          - Terminologické názvy jednotiek a niektoré nápady boli inšpirované knihou Michala Špačka Skřetí spár (Škretí pazúr), prípadne z nej prevzaté; kniha vyšla v roku 2008 v edícii Pevnost.
  uk:
    name: Орки та урук-хаї
    tagline: Голодна паща Тіні — рев бою, бруд, гнів і страх.
    combat_style:
      - орківська піхота та ватаги
      - киї, сокири, короткі мечі
      - легший обладунок зі шкіри та пластин
      - масований напад і рев
    recommended_for:
      - новачки, які хочуть багато бою та простий костюм
      - гравці, яких цікавить темний бік
      - групи, які хочуть нападати разом у ватазі
    not_recommended_for:
      - гравці, які шукають чисту геральдику й шляхетність
      - гравці, які люблять тиху гру
    tags:
      - сила Темного володаря
      - підходить новачкам
      - масовий бій
      - нижча костюмна вимогливість
    newbie_costume_hint: Темне лахміття, шкіряна упряж, брудна лляна туніка, маска або бодіарт. Менше блиску, більше ржі та попелу. Ти не мусиш бути досконалим — важливо виглядати як створіння з Тіні.
    camp_hook: Табір орків пахне горілим, сирим м'ясом і глумом з тих, хто вірить у надію. Гамір, вогонь, рев — Тінь, що бенкетує на власному харчі.
    costume_colors_text: чорний, коричневий, темно-сірий; додатково багряний
    heraldry_text: 'Різні знаки: Червоне Око, знаки Сауронових воєначальників, кланові та особисті символи.'
    ruler:
      name: Ватажок орківської ватаги
      title: Ватажок, обраний силою, а не голосом
      description: Орк, який пережив більше боїв, ніж будь-хто навколо. Він не тримає трону — тримає ту руку, що зриває решту в напад. Гравець-орк іде за ним, бо це єдиний спосіб не залишитися позаду, де Тінь забирає тіла на поживу вовкам.
    lore_sections:
      - title: Стилізація костюма
        paragraphs:
          - 'Орківський воїн одягає брудне, обшарпане вбрання, доповнене шкірою, шкурами та кістками. Основою костюма є гримування всього тіла в чорному, а також у сірому чи коричневому кольорі. Його можна доповнити червоним малюванням частини обличчя. Доречною є маска на обличчя (не обов''язкова, але дуже тішить). До стилізації костюма зараховуємо й озброєння, бо воно однакове в усіх сарків. Найчастіше це круглі щити різних розмірів, але допустимі й інші форми. Як ручна зброя — вигнуті шаблі й списи (також довші), як додаткова зброя — сокири, булави та молоти. Рідшою є дворучна дробильна зброя. Стрільці використовують рогоподібні луки або арбалети. Основою обладунку є шоломи, у більшості доповнені легкими стьобаними чи шкіряними обладунками, що справляють залатане враження („зорковілі“). Щасливіші мають здобичні, але вже поржавілі металеві обладунки, а часом і обладунки власного орківського виготовлення. Частими є композитні пластини на кінцівках і кіраси. Загалом діє правило: що хто дістане й куди собі те причепить, там те й носить.'
      - title: Про орків
        paragraphs:
          - 'Орки заселяють великі терени Середзем''я. Однак немає нічого такого, як єдиний народ. Навіть більші племінні союзи, які орки гордо називають імперіями, здебільшого не переживають свого володаря. Між незліченними кланами, що воюють між собою, панують глибокі відмінності. І то відмінності розміру, коли могутні, мускулясті, зростом подібні до людей орки з Нурну контрастують із дрібними, жилавими ловцями від Косатцевої річки та з південних частин Морок-лісу, так само як із широкоголовими й довгорукими орками від Залізних гір. Барвистими є й мовні відмінності: західний бік Імлистих гір не розуміє східного, а плоскостопі вершники на варгах від Вересових пустищ не договоряться до пуття з тупоголовими із Залізних гір.'
          - Цікавим є погляд, що відрізняє північні, так звані Вільні клани, від південних, званих Невільничими. Ця назва прижилася в племен, осілих на півночі. Орки, що живуть в околицях Імлистих, Сірих і Залізних гір та в прилеглих до них краях, виразно відмежовуються від своїх південніших одноплемінців. Дають зрозуміти, що вони, на відміну від снагів з півдня, були здатні й після відходу Саурона вести великі війни проти ельфів, людей і гномів, валити їхні держави та будувати власні — тоді як слабосилі південні снаги постійно ховалися за Ефель-Дуатом біля Нурну й не досягли нічого, доки знову не постав Саурон. Південні племена заперечують цю критику твердженням, що це балачки набундючених північних базік, які до того ж не мають достатньої шани до величі Саурона, бо вважають його лише пророком Морґота, тоді як південні племена бачать у ньому нове втілення духу Морґота. Цю ворожість під час війни посилило перемішування армійських груп, а згодом і деяких сарків через поповнення складу. До того ж обидві сторони одна одну дуже добре розпізнають. Південні клани говорять досить вільно давньою формою Чорної мови, тоді як північани вживають у багатьох діалектах перекручену версію. Якщо ж є щось, що орків єднає, то це прагнення будь-якою ціною знищити своїх найлютіших ворогів — ельфів та їхніх людських прислужників.
      - title: Вбрання, озброєння та організація орків
        paragraphs:
          - Орківське вбрання шиють із грубих, важких тканин, доповнених вичиненою шкірою та шкурами. Часто воно нагадує пародію на вбрання інших рас. Неправда, однак, що орки мало дбають про свій вигляд. Навпаки. Різнорідність, подертість і лахмітність вбрання має кілька причин. Треба усвідомити, що більшість орків живе в численних кланах, у часто вбогому краї, де кожен залишок, обрізок і клапоть тканини чи шкіри має значну ціну. Крім того, до орківської природи належить прагнення бути особливим, неповторним і розпізнаваним серед усіх. Цього орки досягають виготовленням оздоб із природних матеріалів, як-от кості, шкіра, дерево, шкури тощо. Дуже частими є ловецькі трофеї, а обстріляні воєнні ветерани оздоблюють свій пас або перев'язь скальпами чи вухами вбитих ворогів.
          - Цьому прагненню неповторності сприяє, серед іншого, і досить широкий спектр деформацій обличчя. Він не дається, як хибно твердять, від народження, а виникає в перебігу життя. Старші орки мають обличчя часто зборознене безліччю нерідко навмисно погано зшитих шрамів, із помітними наслідками зламів лицевих кісток, відрубаних носів, вух, вибитих очей, набряків та інших наслідків бурхливого життя цієї раси.
          - Про орків панує вельми неточна чутка, ніби вони мають чорну шкіру. Хто, однак, орків колись справді бачив, знає, що це не зовсім правда. Кольорове розмаїття шкіри тягнеться від жовтувато-коричневої через охристу до різних відтінків сірого, причому не рідкісні й випадки іншого, вельми химерного забарвлення пігменту. Чорний орки використовують разом з іншими кольорами, як-от червоний, фіолетовий або коричневий, як частину бойового чи маскувального малювання, і то не лише обличчя, а й інших частин тіла. Орківські сарки й трарки традиційно створюють собі однакове малювання обличчя для кращої розпізнаваності в бою.
          - На війну кожен орк виряджається сам, із власних засобів чи з допомогою клану, як тільки вміє. Цей звичай довгий час порушувало централізоване виготовлення зброї та обладунків воєнною машинерією Мордорської імперії, але разом із поверненням до кланового способу життя орки повернулися до кланового виготовлення зброї. Ці можливості, однак, досить обмежені, тож переважна частина орків мусить покладатися лише на власне вміння чи винахідливість.
          - 'Щодо обладунків переважають орківські легкоозброєні у стьобаних чи підбитих обладунках. Не менш частими є й шкіряні обладунки, і чимало орків має твердену шкіру як верхній обладунок на тоншій стьобанці. Перед початком війни лише мало хто з орків мав кращий обладунок. Той тоді був часто здобичним (головно кольчуги). Лише кілька кланів опанувало мистецтво металургії настільки, щоб уміти виготовляти металеві кіраси та більші панцерні комплекти. Кузні Барад-дура, однак, озброїли цілі сарки металевими обладунками різного обсягу й якості, і ці предмети в кланах часто залишилися, хоч і не раз змінили власника. Проте те, чого не бракує жодному орківському воїнові, який хоче дожити до кінця війни при здоров''ї, — це шолом. Незліченна кількість варіантів: від капелюхів через шоломи з нанісником до закритих шоломів. Хто до шолома не дотягнеться, намагається захистити свою голову хоча б батватом і кольчужним капюшоном. Навіть останній легкий вивідувач або лучник, що намагається не пхатися в жодну велику січу, має на голові принаймні шапку.'
          - Щодо зброї орківська думка досить одностайна. Стандартним озброєнням піхотинця, який його десь недбало не втратить, є круглий щит різного розміру – часто з кулачним держаком, але трапляється й наручний варіант –, до того короткий спис і вигнута шабля. Як запасна зброя або ручна зброя лучників використовуються довгі вигнуті ножі та тесаки. Сокири й бойові молоти вже не такі часті й радше типові для важкої піхоти, так само як ручні булави. З метальної зброї традиційними є луки, але останнім часом зростає кількість арбалетників, бо арбалет не потребує такого довгого тренування, щоб стрілець був корисний. Незважаючи на певну стандартизованість звичнішого озброєння, зрозуміло, можна спостерігати різні відхилення, які виникли за потребою загону або є клановим звичаєм. Деякі більші щити нагадують недбало виконані павези. Досить нещодавно запроваджують піки. У більших орків та олог-хаїв, так само як у печерних тролів, можна побачити великі дворучні сокири, киї та молоти.
          - Орківські загони традиційно організовані за клановим і, за потреби, племінним принципом. Стандартний розмір клану відповідає приблизно одному трарку. Сарк є тоді об'єднанням кількох трарків — кланів, що тягнуться на війну як союзники. Здебільшого це клани в межах одного племені, у якому існує певна, щонайменше культурно-мовна, спорідненість. У разі поєднання кількох племен (сарків) виникає гот — армія, військо.
          - Цей природний поділ використали під час укладання Мордорської армії, проте деякі класичні звичаї підправили. Наприклад, загони отримали приписані склади, а верховне командування не виходить із середини загонів, натомість система звань і підвищень задана твердими правилами. Під час війни до того ж унаслідок втрат було порушено класичну кланову модель трарку. Окремі сарки й трарки почали поповнювати новачками, які з первісним кланом не мали нічого спільного. Досить часто відбувалося злиття розбитих або майже вибитих загонів через усю кланову структуру. Це мало прикметний наслідок у тому, що після падіння Саурона розвідники спостерігають значно швидше творення союзів між кланами й племенами, що приписують взаємному обточенню кутів і відмінностей нинішніх ватажків саме в цих змішаних загонах.
          - Термінологічні назви загонів і деякі задуми були натхнені книгою Михала Шпачека „Skřetí spár“ („Орківський кіготь“) або перебрані з неї; книга вийшла 2008 року у видавничій серії Pevnost.
