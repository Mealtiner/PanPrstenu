side: free
i18n:
  cs:
    name: Gondor
    tagline: Strážci Bílého stromu, hrdost Númenoru a poslední štít Západu.
    combat_style:
      - těžší pěchota
      - štíty a meče
      - kopiníci
      - stráže
    recommended_for:
      - hráči hledající vznešený a heraldický styl
      - skupiny
      - zkušenější bojovníci
    not_recommended_for:
      - hráči, kteří nemají čas připravit kostým s heraldikou
    tags:
      - svobodný národ
      - vyšší kostýmová náročnost
      - heraldický styl
    newbie_costume_hint: Tunika v tmavě modré nebo černé, stříbrné prvky, znak Bílého stromu nebo sedmi hvězd. Plášť, opasek, rovné meče.
    camp_hook: Tábor Gondoru působí strohou kázní stráží, modlitbou za západ a věrnou službou lennímu pánu.
    costume_colors_text: 'modrá, bílá, šedá; doplňkově hnědá a stříbrná'
    heraldry_text: 'Stříbrný strom se sedmi hvězdami na tmavém poli.'
    ruler:
      name: Aragorn
      title: Král Gondoru, dědic Isildurův
      description: Strážce severu, navrátivší se král Západu. Vede jezdce Bílého stromu a družiny strážců — sjednocuje to, co bylo dlouho rozděleno. Hráč ve hře Gondoru pozná velitele podle bílého stromu na štítu, krátkých rozkazů a klidného držení v krizi.
    lore_sections:
      - title: Stylizace kostýmu
        paragraphs:
          - "Základní stylizace příslušníků gondorských vojsk odpovídá středověké společnosti v západní Evropě 13. – 15. století. Zaměřeno na vojenství, tzn. klasický lidský fantasy voják laděný do gotiky. Toto doplněno o stylizaci dle filmové předlohy, s\_důrazem na zobrazení výsostných znaků (Bílý strom), a pokud možno uniformoidní styl kostýmu. Jedná se o de facto pravidelnou armádu z odvedenců. Základ tvoří pomocné sbory lehkých kopiníků, sekerníků, šermířů se štíty a hraničářských lučištníků."
      - title: O gondorské armádě
        paragraphs:
          - Jižní a severní Gondor jsou dosti odlišné oblasti.
          - Jižní země se po ztracení královské linie začaly postupně osamostatňovat a jejich knížata dokázala své země, dotčené válkami jen málo, pozvednout k bohatství a síle. Jižanská šlechta si postupně vytvořila samostatný konglomerát knížectví, vzájemně spojených ekonomicky i vojensky. Hlavní autoritou se stala knížata z Dol Amrothu.
          - Země severního Gondoru, spravované přímo správcem království, trpěly válkou, morem a díky tomu i nedostatkem. Severní země se staly podporovaným, slábnoucím, chudým sousedem, jehož bylo ve chvílích nejtěžších nutno podržet před zhroucením, ať už pomocí vojenskou nebo ekonomickou.
          - To se značně podepsalo na odlišné vojenské tradici obou částí země.
          - Jižní část Gondoru je klasicky feudální, knížata se opírají o rodovou lenní šlechtu, z jejíchž řad se rekrutuje obrněné rytířstvo, základ jihogondroských kontingentů. Tyto kontingenty jsou doplněny o družiníky a zbrojné pacholky rytířstva a posíleny o knížecí družiny s pěšími i jízdními oděnci. Výzbroj svou a své hotovosti pořizuje rytíř na své náklady, podle toho má pak nárok na část válečné kořisti a na podíl ve velení.
          - Severní Gondor tento model zcela opustil. Válka zdecimovala šlechtu a mimoto bylo potřeba povolávat stále více mužů, kteří by nahradili ztráty, než pouze družiny jednotlivých pánů. Válka zde byla otázkou existence a byl do ní zapojen de facto každý zdravý muž. Správci určili šlechticům úřady pro správu a obranu země a jako vrchní vládci vládli všem tenčícím se knížectvím. Armáda je stavěna na základě pravidelných odvodů. Vojenskou službu je možno obejít jen vyplacením nebo jinou službou úřadu správce. Vojsko bylo sjednoceno pod jeden prapor. Šlechticům byly přiděleny hodnosti důstojníků, ovšem postupně byl důstojnický sbor doplňován i o prostý lid.
          - Odívání v Gondorské říši je poměrně identické i přes výše zmíněné rozdíly mezi vrstvami. Lebennin je jako země nejen zdrojem látek, ale i módy, která se odsud postupně rozšiřuje po celé říši. To však neplatí pro prostý lid, jehož styl oblékání se příliš nemění. Nosí se plátěné volné kalhoty či volné přivazovací nohavice (bruchy), doplněné o haleny a tuniky z lněných a vlněných látek. Poměrně módní barvou jsou odstíny modré, doplněné o bílou, šedou a hnědou barvu. Styl oblékání odpovídá 13. – 15. století v Západní Evropě.
          - Vojáci Gondoru jsou oděni v závislosti na původu. Královské vojsko ze severu je oděno do jednoduchých uniforem. Vojáci jsou opatřeni varkoči a rozlišovacími znaky bílého stromu a hvězd. Uniforma je laděna do černé barvy, u bohatších je ze sametové látky. Vojáci jsou vyzbrojeni podle zařazení jednotky. Poměrně rozšířená je pěchota, která je pro obranné boje a boje v lesnatých a svažitých terénech vhodnější. Základní výzbroj pěšáka tvoří štít oválného či erbovního tvaru s mečem popřípadě palcátem. Oddíly štítařů jsou doplněny o jednotky s dlouhými pěšáckými kopími a pobočnými dlouhými noži a tesáky. Tato pěchota je oděna poměrně standardně do přilbic tvaru železných klobouků, barbut či pěších šalířů. Jako zbroj jsou běžné prošívané a vycpávané zbroje, u některých oddílů doplněné o kroužkové či poloplátové komplety. Jako podpůrné jednotky slouží lučištníci, kteří jsou obrněni spíše spoře.
          - Jednotky jižního Gondoru jsou vlastně složeny z několika družin šlechticů, z nichž jeden má rozhodující slovo velitele. Odění není zdaleka tak uniformní jako u severních sborů. Družiníci jsou většinou bez insignií nebo znaků, nebo nesou znak svého pána, ať už na štítě, nebo na varkoči. Jižanská šlechta má mnoho znaků, erbů a praporů, ale za jakýsi částečně sjednocující prvek platí prapor Dol Amrothského knížete s bílou labutí a čtyřcípou hvězdou. Šlechtici jsou vyzbrojeni jezdeckým kopím a štítem, sloužícím při prvním nárazu, následně tasí meče, sekyry a palcáty.Jsou oděni do kroužkové či plátové zbroje vysoké kvality, opřilbení. Pomocná pěchota z družiníků, pacholků a odvedenců je vyzbrojena spíše kopími, štíty, sekyrami a doplněna o kušovníky a lučištníky. Tato pomocná pěchota je chráněna v lepším případě lehkou prošívanou či vycpávanou zbrojí, kabátci z kůže. Hlavu mají schovanou v čapkách, batwatech a příležitostně i helmicích.
          - Současné Gondorské síly se dělí na takzvané praporce. Severogondorské nesou znaky bílého stromu s hvězdami, jižanské rytířské korouhve a pěší podpůrné praporce uznávají za jednotící standartu znak bílé labutě. Rytíři a případně k nim příslušní pacholci však na štítech či svrchních varkočích nesou znaky svých rodů.
      - title: O gondorském království
        paragraphs:
          - Gondor je nejstarším královstvím lidí ve Středozemi. I přes to, že jeho původní moc dlouho upadala, nyní, když se vrátil král, je síla Gondoru opět na vzestupu, hotova vydobýt si svoji dávnou slávu.
          - Na hranice Gondorské říše je možno nahlížet dvojím způsobem. První je ten, který používají gondorští páni. Tedy pohled zahrnující původní historická území Gondoru, která jsou dnes již ze značné části pustá nebo obsazená Nepřítelem. Tento pohled podněcuje touhu znovu obsadit země Ithilienu, vrátit jižní hranici za řeku Poros, obsadit Harondor a obnovit pevnosti na toku Harnenu.Ještě optimističtější plány se zabývají myšlenkami na znovuvybudování pevností podél Ered Lithui a obsazením Umbaru a přilehlých oblastí.
          - O něco střízlivější pohled pak vnímá hranice Gondoru tam, kde de facto leží. Za západní hranici je považován Anfalas. Travnatá, řídce osídlená vrchovina je jakýmsi vzdáleným cípem Gondorské moci na západě. Páni a šlechta jsou sice pokrevními příbuznými Númenorejců, ale stará krev je nejen mezi prostým lidem smíšena s původními obyvateli. Velká vzdálenost těchto zemí od srdce království způsobuje, že válka s nepřítelem na Východě se zdá jako jakýsi pověrami opředený přízrak, který pohlcuje odvedence, jež si žádají páni z velkého města. Loajalita vůči říši značně ochladla a jen málo pánů vyslyšelo volání nového krále.
          - Z Anfalasu směrem na východ se zvedá podhorská země Lamedon. Opevněný, kvetoucí Morthond je hlavním sídlem knížete, jenž vládne zemi hornických osad. Právě odtud pochází rudné bohatství Gondoru. Nejen železná ruda, ale i stříbrné žíly a měděná ložiska ukrývá nitro Ered Nimrais.
          - Jižně od Lamedonu leží Belfalas. Ve své jižnější části, která jako cíp vbíhá do moře, svírá pohořím zbrázděný Dor-en-Ernil spolu s Anfalasem zátoku Nen Belfalas.
          - Hlavní osídlení však leží podél toků a v deltě řek Ciril a Ringló, poblíž přístavu Edhellond. Bohatá zemědělská krajina protkaná háji a lesy s cedrovým dřevem pro stavbu těch nejlepších námořních a říčních lodí. Zde je sídlo kníže Imrahila – hrad Dol Amroth, kvetoucí město a další opevněný válečný přístav, jenž chrání pobřeží před nájezdy korzárů z Umbaru.
          - Nejzápadnější částí jižního Gondoru je Lebennin. Úrodná, s pastvinami, poli a lesy posetá země. Země velkých stád ovcí, koní a jiného dobytka, země tkalců a sklářů. A v neposlední řadě země obchodníků.
          - Největší obchodní přístav Pelargir, ležící v deltě veletoku Anduiny, chráněn ostrovem Tolfalas, je spolu s městem Linhir, položeným více na východě u říčky Gilrain na hranici s Belfalasem, zdrojem bohatství Lebenninských knížat.
          - Tím výčet zemí jižního Gondoru končí. Severní oblast je na tom poněkud bídněji. Zasažená válkou a ohněm stojí Minas Tirith a její bílá věž obklopená stísněným Lossarnachem a Anórienem, zemí hraničící s královstvím Pánů koní.
  en:
    name: Gondor
    tagline: Guardians of the White Tree, the pride of Númenor and the last shield of the West.
    combat_style:
      - heavier infantry
      - shields and swords
      - spearmen
      - guardsmen
    recommended_for:
      - players looking for a noble, heraldic style
      - groups
      - more experienced fighters
    not_recommended_for:
      - players who have no time to prepare a costume with heraldry
    tags:
      - free people
      - higher costume difficulty
      - heraldic style
    newbie_costume_hint: A tunic in dark blue or black, silver details, the device of the White Tree or of the seven stars. A cloak, a belt, straight swords.
    camp_hook: The camp of Gondor is marked by the stern discipline of the guard, by the prayer towards the West and by faithful service to the liege lord.
    costume_colors_text: blue, white, grey; brown and silver as accents
    heraldry_text: A silver tree with seven stars on a dark field.
    ruler:
      name: Aragorn
      title: King of Gondor, heir of Isildur
      description: Guardian of the North, the returned King of the West. He leads the riders of the White Tree and the companies of the guard — uniting what had long been divided. In the game a player of Gondor will know the commander by the white tree upon his shield, by his short orders and by his calm bearing in a crisis.
    lore_sections:
      - title: Costume styling
        paragraphs:
          - The basic styling of the members of the hosts of Gondor corresponds to medieval society in Western Europe of the 13th – 15th centuries. The focus is on the military, that is, the classic human fantasy soldier tuned to the Gothic. To this is added a styling drawn from the films, with emphasis on displaying the sovereign devices (the White Tree) and, where possible, a uniform-like style of costume. This is de facto a regular army raised from conscripts. Its core is formed by auxiliary corps of light spearmen, axemen, swordsmen with shields and ranger archers.
      - title: About the army of Gondor
        paragraphs:
          - Southern and northern Gondor are quite different regions.
          - After the royal line was lost, the southern lands gradually began to grow independent, and their princes managed to raise their territories, touched by the wars only lightly, to wealth and strength. The southern nobility gradually formed an independent conglomerate of principalities, bound to one another both economically and militarily. The princes of Dol Amroth became the chief authority.
          - The lands of northern Gondor, governed directly by the Steward of the kingdom, suffered from war, from plague and consequently from want. The northern lands became a supported, weakening, poor neighbour who in the hardest hours had to be kept from collapse, whether by military or by economic aid.
          - This left a considerable mark on the differing military traditions of the two parts of the land.
          - 'The southern part of Gondor is classically feudal: the princes rest upon a hereditary feudal nobility, from whose ranks the armoured knighthood is recruited, the backbone of the South Gondorian contingents. These contingents are supplemented by the retainers and the armed servants of the knighthood and reinforced by the princely companies with both foot and mounted troopers. A knight provides the equipment for himself and for his levy at his own expense, and accordingly he has a claim to a share of the spoils of war and to a share in command.'
          - Northern Gondor abandoned this model entirely. The war decimated the nobility, and besides that it became necessary to call up ever more men to replace the losses than merely the companies of individual lords. Here the war was a matter of survival, and de facto every able-bodied man was drawn into it. The Stewards assigned the nobles offices for the administration and the defence of the land, and as overlords they ruled all the dwindling principalities. The army is raised on the basis of regular levies. Military service can be avoided only by buying it off or by another service to the office of the Steward. The host was united under a single banner. The nobles were granted the ranks of officers, though the officer corps was gradually filled out with common folk as well.
          - Dress in the realm of Gondor is fairly uniform in spite of the differences between the classes mentioned above. Lebennin is a land that is a source not only of cloth but also of fashion, which spreads from there gradually across the whole realm. That, however, does not hold for the common folk, whose style of dress changes little. People wear loose linen trousers or loose tie-on hose (braies), together with smocks and tunics of linen and woollen cloth. A fairly fashionable colour is the shades of blue, complemented by white, grey and brown. The style of dress corresponds to the 13th – 15th centuries in Western Europe.
          - The soldiers of Gondor are clothed according to their origin. The royal host from the north is dressed in simple uniforms. The soldiers are provided with surcoats and with the distinguishing devices of the white tree and the stars. The uniform is kept in black; among the wealthier it is of velvet cloth. The soldiers are armed according to the assignment of their unit. Infantry is fairly widespread, being better suited to defensive fighting and to fighting in wooded and sloping terrain. The basic equipment of a foot soldier is a shield of oval or heraldic shape with a sword or else a mace. The companies of shieldmen are complemented by units with long infantry spears and with long knives and falchions as side arms. This infantry is fairly uniformly furnished with helmets in the shape of kettle hats, barbutes or infantry sallets. As armour, quilted and padded coats are common, in some companies supplemented with mail or half-plate harness. Archers serve as supporting units and are rather sparsely armoured.
          - The units of southern Gondor are in fact made up of several companies of nobles, one of whom has the decisive word as commander. Their attire is nowhere near as uniform as in the northern corps. The retainers usually bear no insignia or devices, or else carry the device of their lord, whether on the shield or on the surcoat. The southern nobility has many devices, coats of arms and banners, but the banner of the Prince of Dol Amroth with the white swan and the four-pointed star counts as a partly unifying element. The nobles are armed with a cavalry lance and a shield, which serves for the first shock; afterwards they draw swords, axes and maces. They are clad in mail or plate armour of high quality, and helmed. The auxiliary infantry of retainers, servants and conscripts is armed rather with spears, shields and axes, and is complemented by crossbowmen and archers. This auxiliary infantry is protected at best by light quilted or padded armour and by jerkins of leather. Their heads are covered with caps, batwats and occasionally with helmets as well.
          - The present forces of Gondor are divided into so-called banners. Those of North Gondor bear the devices of the white tree with the stars; the southern knightly banners and the supporting foot banners acknowledge the device of the white swan as their unifying standard. Knights, and any servants belonging to them, nevertheless bear the arms of their houses upon their shields or their outer surcoats.
      - title: About the kingdom of Gondor
        paragraphs:
          - Gondor is the oldest kingdom of Men in Middle-earth. Although its original power declined for a long time, now that the king has returned the strength of Gondor is rising again, ready to win back its ancient glory.
          - The borders of the realm of Gondor may be looked at in two ways. The first is the one used by the lords of Gondor. That is, a view taking in the original historical territories of Gondor, which today are for the greater part desolate or held by the Enemy. This view stirs the desire to occupy the lands of Ithilien once more, to return the southern border beyond the river Poros, to take Harondor and to restore the fortresses along the course of the Harnen. Still more optimistic plans entertain the thought of rebuilding the strongholds along the Ered Lithui and of seizing Umbar and the adjacent regions.
          - A somewhat more sober view then sees the borders of Gondor where they de facto lie. Anfalas is regarded as the western frontier. This grassy, thinly settled upland is a kind of distant tip of Gondorian power in the west. Its lords and nobles are indeed blood kin of the Númenóreans, but the old blood is mingled with the original inhabitants, and not only among the common folk. The great distance of these lands from the heart of the kingdom makes the war with the enemy in the East seem a kind of phantom wreathed in superstition, one that devours the conscripts demanded by the lords of the great city. Loyalty to the realm has cooled considerably, and only few lords have heeded the call of the new king.
          - Eastward from Anfalas rises the foothill land of Lamedon. Fortified, flourishing Morthond is the chief seat of the prince who rules this land of mining settlements. It is from here that the ore-wealth of Gondor comes. Not only iron ore, but also veins of silver and deposits of copper are hidden in the heart of the Ered Nimrais.
          - South of Lamedon lies Belfalas. In its more southerly part, which runs out into the sea like a spur, mountain-furrowed Dor-en-Ernil together with Anfalas encloses the bay of Nen Belfalas.
          - The main settlement, however, lies along the courses and in the delta of the rivers Ciril and Ringló, near the haven of Edhellond. A rich farming country threaded with groves and with forests bearing cedar wood for the building of the finest sea-going and river ships. Here is the seat of Prince Imrahil – the castle of Dol Amroth, a flourishing city and another fortified war harbour, which guards the coast against the raids of the corsairs of Umbar.
          - The westernmost part of southern Gondor is Lebennin. A fertile land strewn with pastures, fields and woods. A land of great herds of sheep, of horses and of other cattle, a land of weavers and glassmakers. And not least a land of merchants.
          - The greatest trading haven, Pelargir, lying in the delta of the great river Anduin and sheltered by the isle of Tolfalas, is — together with the town of Linhir, set further to the east on the little river Gilrain at the border with Belfalas — the source of the wealth of the princes of Lebennin.
          - With that the list of the lands of southern Gondor ends. The northern region is somewhat worse off. Struck by war and by fire stands Minas Tirith with its white tower, surrounded by hard-pressed Lossarnach and by Anórien, the land bordering on the kingdom of the Lords of the Horses.
  de:
    name: Gondor
    tagline: Hüter des Weißen Baumes, Stolz Númenors und letzter Schild des Westens.
    combat_style:
      - schwerere Infanterie
      - Schilde und Schwerter
      - Speerträger
      - Wachen
    recommended_for:
      - Spieler, die einen edlen und heraldischen Stil suchen
      - Gruppen
      - erfahrenere Kämpfer
    not_recommended_for:
      - Spieler, die keine Zeit haben, ein Kostüm mit Heraldik vorzubereiten
    tags:
      - Freies Volk
      - höhere Kostümanforderung
      - heraldischer Stil
    newbie_costume_hint: Eine Tunika in Dunkelblau oder Schwarz, silberne Elemente, das Zeichen des Weißen Baumes oder der sieben Sterne. Mantel, Gürtel, gerade Schwerter.
    camp_hook: Das Lager Gondors wirkt durch die strenge Zucht der Wachen, durch das Gebet gen Westen und durch den treuen Dienst am Lehnsherrn.
    costume_colors_text: Blau, Weiß, Grau; ergänzend Braun und Silber
    heraldry_text: Ein silberner Baum mit sieben Sternen auf dunklem Feld.
    ruler:
      name: Aragorn
      title: König von Gondor, Erbe Isildurs
      description: Hüter des Nordens, der wiedergekehrte König des Westens. Er führt die Reiter des Weißen Baumes und die Scharen der Wächter — er eint, was lange getrennt war. Im Spiel erkennt ein Spieler Gondors den Anführer am weißen Baum auf dem Schild, an kurzen Befehlen und an der ruhigen Haltung in der Krise.
    lore_sections:
      - title: Stilisierung des Kostüms
        paragraphs:
          - Die grundlegende Stilisierung der Angehörigen der gondorischen Heere entspricht der mittelalterlichen Gesellschaft Westeuropas des 13. – 15. Jahrhunderts. Der Schwerpunkt liegt auf dem Kriegswesen, d. h. auf dem klassischen menschlichen Fantasy-Krieger in gotischer Anmutung. Ergänzt wird dies um eine Stilisierung nach dem Filmvorbild, mit Betonung der Hoheitszeichen (Weißer Baum) und nach Möglichkeit um einen uniformartigen Kostümstil. Es handelt sich faktisch um ein stehendes Heer aus Ausgehobenen. Die Grundlage bilden Hilfsverbände leichter Speerträger, Axtkämpfer, Schwertkämpfer mit Schilden und Waldläufer-Bogenschützen.
      - title: Über das Heer Gondors
        paragraphs:
          - Süd- und Nordgondor sind recht unterschiedliche Gebiete.
          - Nach dem Verlust der Königslinie begannen sich die südlichen Länder allmählich zu verselbständigen, und ihre Fürsten vermochten ihre von den Kriegen nur wenig berührten Gebiete zu Reichtum und Stärke zu führen. Der südliche Adel bildete nach und nach einen eigenständigen Verbund von Fürstentümern, die wirtschaftlich wie militärisch miteinander verbunden waren. Zur obersten Autorität wurden die Fürsten von Dol Amroth.
          - Die Länder Nordgondors, die unmittelbar vom Statthalter des Königreichs verwaltet wurden, litten unter Krieg, unter der Pest und dadurch auch unter Mangel. Der Norden wurde zu einem unterstützten, schwächer werdenden, armen Nachbarn, den man in den schwersten Stunden vor dem Zusammenbruch bewahren musste, sei es durch militärische oder durch wirtschaftliche Hilfe.
          - Das prägte die unterschiedliche Kriegstradition beider Landesteile erheblich.
          - 'Der südliche Teil Gondors ist klassisch feudal: Die Fürsten stützen sich auf einen erblichen Lehnsadel, aus dessen Reihen sich die gepanzerte Ritterschaft rekrutiert, das Rückgrat der südgondorischen Aufgebote. Diese Aufgebote werden durch Gefolgsleute und bewaffnete Knechte der Ritterschaft ergänzt und durch die fürstlichen Scharen mit Fuß- und Reitergewappneten verstärkt. Seine Ausrüstung und die seines Aufgebots beschafft der Ritter auf eigene Kosten; entsprechend hat er Anspruch auf einen Teil der Kriegsbeute und auf einen Anteil an der Führung.'
          - Nordgondor gab dieses Modell vollständig auf. Der Krieg dezimierte den Adel, und überdies mussten immer mehr Männer einberufen werden, um die Verluste zu ersetzen, als es die Scharen einzelner Herren allein vermochten. Der Krieg war hier eine Frage des Überlebens, und faktisch war jeder gesunde Mann in ihn einbezogen. Die Statthalter wiesen den Adligen Ämter für die Verwaltung und die Verteidigung des Landes zu und herrschten als Oberherren über alle schwindenden Fürstentümer. Das Heer wird auf der Grundlage regelmäßiger Aushebungen aufgestellt. Dem Kriegsdienst kann man nur durch Loskauf oder durch einen anderen Dienst für das Amt des Statthalters entgehen. Das Heer wurde unter einem einzigen Banner vereinigt. Den Adligen wurden Offiziersränge zugeteilt, doch nach und nach wurde das Offizierskorps auch aus dem gemeinen Volk ergänzt.
          - Die Kleidung im Reich Gondor ist trotz der oben genannten Unterschiede zwischen den Schichten recht einheitlich. Lebennin ist als Land nicht nur eine Quelle der Stoffe, sondern auch der Mode, die sich von dort allmählich über das ganze Reich ausbreitet. Für das gemeine Volk gilt das jedoch nicht, dessen Kleidungsstil sich kaum ändert. Man trägt weite Leinenhosen oder lose angebundene Beinlinge (Bruchen), dazu Hemden und Tuniken aus Lein- und Wollstoffen. Recht modisch sind Blautöne, ergänzt durch Weiß, Grau und Braun. Der Kleidungsstil entspricht dem 13. – 15. Jahrhundert in Westeuropa.
          - Die Soldaten Gondors sind je nach Herkunft gekleidet. Das königliche Heer aus dem Norden trägt einfache Uniformen. Die Soldaten sind mit Waffenröcken und mit den Unterscheidungszeichen des weißen Baumes und der Sterne versehen. Die Uniform ist in Schwarz gehalten, bei Wohlhabenderen aus Samt. Bewaffnet sind die Soldaten je nach Einteilung ihrer Einheit. Recht verbreitet ist die Infanterie, die für Verteidigungskämpfe und für Gefechte in bewaldetem und abschüssigem Gelände geeigneter ist. Die Grundbewaffnung eines Fußsoldaten bilden ein ovaler oder wappenförmiger Schild mit Schwert oder gegebenenfalls Streitkolben. Die Abteilungen der Schildträger werden durch Einheiten mit langen Fußspießen sowie mit langen Messern und Hiebmessern als Seitenwaffen ergänzt. Diese Infanterie trägt recht einheitlich Helme in Form von Eisenhüten, Barbuten oder Fußknechtsschallern. Als Rüstung sind gesteppte und gepolsterte Panzer üblich, bei manchen Abteilungen ergänzt um Ketten- oder Halbplattengarnituren. Als Unterstützungseinheiten dienen Bogenschützen, die eher spärlich gepanzert sind.
          - Die Truppen Südgondors setzen sich eigentlich aus mehreren Gefolgschaften von Adligen zusammen, von denen einer das entscheidende Wort als Anführer hat. Die Kleidung ist bei Weitem nicht so einheitlich wie bei den nördlichen Verbänden. Die Gefolgsleute tragen meist keine Insignien oder Zeichen oder führen das Zeichen ihres Herrn, sei es auf dem Schild oder auf dem Waffenrock. Der südliche Adel hat viele Zeichen, Wappen und Banner, doch als gewissermaßen teilweise einigendes Element gilt das Banner des Fürsten von Dol Amroth mit dem weißen Schwan und dem vierzackigen Stern. Die Adligen sind mit Reiterlanze und Schild bewaffnet, der beim ersten Anprall dient; danach ziehen sie Schwerter, Äxte und Streitkolben. Sie tragen Ketten- oder Plattenrüstung hoher Qualität und sind behelmt. Die Hilfsinfanterie aus Gefolgsleuten, Knechten und Ausgehobenen ist eher mit Speeren, Schilden und Äxten bewaffnet und wird durch Armbrustschützen und Bogenschützen ergänzt. Diese Hilfsinfanterie ist bestenfalls durch leichte gesteppte oder gepolsterte Rüstung und durch Wämser aus Leder geschützt. Den Kopf bedecken sie mit Kappen, Batwats und gelegentlich auch mit Helmen.
          - Die heutigen Streitkräfte Gondors gliedern sich in sogenannte Banner. Die nordgondorischen führen die Zeichen des weißen Baumes mit den Sternen; die südlichen Ritterfähnlein und die unterstützenden Fußbanner erkennen das Zeichen des weißen Schwans als einigende Standarte an. Ritter und die ihnen gegebenenfalls zugehörigen Knechte führen jedoch auf den Schilden oder den oberen Waffenröcken die Zeichen ihrer Geschlechter.
      - title: Über das Königreich Gondor
        paragraphs:
          - Gondor ist das älteste Königreich der Menschen in Mittelerde. Obwohl seine ursprüngliche Macht lange verfiel, steigt die Stärke Gondors nun, da der König zurückgekehrt ist, wieder an — bereit, sich ihren alten Ruhm zurückzuerobern.
          - Die Grenzen des Reiches Gondor lassen sich auf zweierlei Weise betrachten. Die erste ist jene, welche die Herren Gondors gebrauchen. Also eine Sicht, die die ursprünglichen historischen Gebiete Gondors einschließt, die heute größtenteils verödet oder vom Feind besetzt sind. Diese Sicht nährt den Wunsch, die Länder Ithiliens erneut zu besetzen, die Südgrenze wieder hinter den Fluss Poros zu verlegen, Harondor einzunehmen und die Festungen am Lauf des Harnen wiederherzustellen. Noch zuversichtlichere Pläne befassen sich mit dem Gedanken, die Festungen entlang der Ered Lithui neu zu errichten und Umbar samt den angrenzenden Gebieten zu besetzen.
          - Eine etwas nüchternere Sicht legt die Grenzen Gondors dorthin, wo sie faktisch liegen. Als Westgrenze gilt Anfalas. Dieses grasige, dünn besiedelte Hochland ist gleichsam ein ferner Zipfel gondorischer Macht im Westen. Die Herren und der Adel sind zwar Blutsverwandte der Númenórer, doch ist das alte Blut nicht nur im gemeinen Volk mit den ursprünglichen Bewohnern vermischt. Die große Entfernung dieser Länder vom Herzen des Königreichs lässt den Krieg mit dem Feind im Osten wie ein von Aberglauben umranktes Gespenst erscheinen, das die Ausgehobenen verschlingt, welche die Herren aus der großen Stadt fordern. Die Treue zum Reich ist merklich erkaltet, und nur wenige Herren haben den Ruf des neuen Königs erhört.
          - Von Anfalas nach Osten hin erhebt sich das Vorgebirgsland Lamedon. Das befestigte, blühende Morthond ist der Hauptsitz des Fürsten, der über das Land der Bergbausiedlungen herrscht. Eben von hier stammt der Erzreichtum Gondors. Nicht nur Eisenerz, sondern auch Silberadern und Kupferlager birgt das Innere der Ered Nimrais.
          - Südlich von Lamedon liegt Belfalas. In seinem südlicheren Teil, der wie eine Landspitze ins Meer hinausläuft, umschließt das von Gebirgen durchfurchte Dor-en-Ernil zusammen mit Anfalas die Bucht Nen Belfalas.
          - Die Hauptsiedlungen liegen jedoch entlang der Läufe und im Delta der Flüsse Ciril und Ringló, nahe dem Hafen Edhellond. Ein reiches Ackerland, durchzogen von Hainen und von Wäldern mit Zedernholz für den Bau der besten See- und Flussschiffe. Hier ist der Sitz des Fürsten Imrahil – die Burg Dol Amroth, eine blühende Stadt und ein weiterer befestigter Kriegshafen, der die Küste vor den Überfällen der Korsaren aus Umbar schützt.
          - Der westlichste Teil Südgondors ist Lebennin. Ein fruchtbares, mit Weiden, Feldern und Wäldern übersätes Land. Ein Land großer Herden von Schafen, Pferden und anderem Vieh, ein Land der Weber und der Glasmacher. Und nicht zuletzt ein Land der Kaufleute.
          - Der größte Handelshafen Pelargir, der im Delta des Stromes Anduin liegt und von der Insel Tolfalas geschützt wird, ist zusammen mit der Stadt Linhir, die weiter östlich am Flüsschen Gilrain an der Grenze zu Belfalas liegt, die Quelle des Reichtums der Fürsten von Lebennin.
          - Damit endet die Aufzählung der Länder Südgondors. Dem nördlichen Gebiet geht es etwas erbärmlicher. Von Krieg und Feuer getroffen steht Minas Tirith mit seinem weißen Turm, umgeben vom bedrängten Lossarnach und von Anórien, dem Land an der Grenze zum Königreich der Herren der Pferde.
  sk:
    name: Gondor
    tagline: Strážcovia Bieleho stromu, hrdosť Númenoru a posledný štít Západu.
    combat_style:
      - ťažšia pechota
      - štíty a meče
      - kopijníci
      - stráže
    recommended_for:
      - hráči hľadajúci vznešený a heraldický štýl
      - skupiny
      - skúsenejší bojovníci
    not_recommended_for:
      - hráči, ktorí nemajú čas pripraviť si kostým s heraldikou
    tags:
      - slobodný národ
      - vyššia kostýmová náročnosť
      - heraldický štýl
    newbie_costume_hint: Tunika v tmavomodrej alebo čiernej, strieborné prvky, znak Bieleho stromu alebo siedmich hviezd. Plášť, opasok, rovné meče.
    camp_hook: Tábor Gondoru pôsobí prísnou disciplínou stráží, modlitbou k Západu a vernou službou lénnemu pánovi.
    costume_colors_text: modrá, biela, sivá; doplnkovo hnedá a strieborná
    heraldry_text: Strieborný strom so siedmimi hviezdami na tmavom poli.
    ruler:
      name: Aragorn
      title: Kráľ Gondoru, dedič Isildurov
      description: Strážca severu, navrátivší sa kráľ Západu. Vedie jazdcov Bieleho stromu a družiny strážcov — zjednocuje to, čo bolo dlho rozdelené. Hráč v hre Gondoru spozná veliteľa podľa bieleho stromu na štíte, podľa krátkych rozkazov a pokojného vystupovania v kríze.
    lore_sections:
      - title: Štylizácia kostýmu
        paragraphs:
          - Základná štylizácia príslušníkov gondorských vojsk zodpovedá stredovekej spoločnosti v západnej Európe 13. – 15. storočia. Zameranie je na vojenstvo, t. j. klasický ľudský fantasy vojak ladený do gotiky. To je doplnené o štylizáciu podľa filmovej predlohy, s dôrazom na zobrazenie výsostných znakov (Biely strom), a podľa možnosti o uniformovaný štýl kostýmu. Ide de facto o pravidelnú armádu z odvedencov. Základ tvoria pomocné zbory ľahkých kopijníkov, sekerníkov, šermiarov so štítmi a hraničiarskych lukostrelcov.
      - title: O gondorskej armáde
        paragraphs:
          - Južný a severný Gondor sú dosť odlišné oblasti.
          - Južné krajiny sa po strate kráľovskej línie začali postupne osamostatňovať a ich kniežatá dokázali svoje zeme, vojnami dotknuté len málo, pozdvihnúť k bohatstvu a sile. Južanská šľachta si postupne vytvorila samostatný konglomerát kniežatstiev, navzájom prepojených hospodársky aj vojensky. Hlavnou autoritou sa stali kniežatá z Dol Amrothu.
          - Zeme severného Gondoru, spravované priamo správcom kráľovstva, trpeli vojnou, morom a v dôsledku toho aj nedostatkom. Severné zeme sa stali podporovaným, slabnúcim, chudobným susedom, ktorého bolo v najťažších chvíľach nutné udržať pred zrútením, či už vojenskou, alebo hospodárskou pomocou.
          - To sa výrazne podpísalo na odlišnej vojenskej tradícii oboch častí krajiny.
          - Južná časť Gondoru je klasicky feudálna, kniežatá sa opierajú o rodovú lénnu šľachtu, z ktorej radov sa regrutuje obrnené rytierstvo, základ juhogondorských kontingentov. Tieto kontingenty sú doplnené o družiníkov a zbrojných pacholkov rytierstva a posilnené o kniežacie družiny s pešími aj jazdnými odencami. Výzbroj svoju aj svojej hotovosti si rytier zaobstaráva na vlastné náklady, podľa toho má potom nárok na časť vojnovej koristi a na podiel na velení.
          - Severný Gondor tento model celkom opustil. Vojna zdecimovala šľachtu a okrem toho bolo treba povolávať čoraz viac mužov, ktorí by nahradili straty, než len družiny jednotlivých pánov. Vojna tu bola otázkou existencie a bol do nej zapojený de facto každý zdravý muž. Správcovia určili šľachticom úrady na správu a obranu krajiny a ako vrchní vládcovia vládli všetkým tenčiacim sa kniežatstvám. Armáda sa stavia na základe pravidelných odvodov. Vojenskú službu možno obísť len vyplatením alebo inou službou úradu správcu. Vojsko bolo zjednotené pod jednu zástavu. Šľachticom boli pridelené hodnosti dôstojníkov, avšak dôstojnícky zbor sa postupne dopĺňal aj o prostý ľud.
          - Odievanie v Gondorskej ríši je pomerne rovnaké aj napriek vyššie spomenutým rozdielom medzi vrstvami. Lebennin je ako krajina nielen zdrojom látok, ale aj módy, ktorá sa odtiaľ postupne šíri po celej ríši. To však neplatí pre prostý ľud, ktorého štýl obliekania sa príliš nemení. Nosia sa plátenné voľné nohavice či voľné priväzovacie nohavice (bruchy), doplnené o haleny a tuniky z ľanových a vlnených látok. Pomerne módnou farbou sú odtiene modrej, doplnené o bielu, sivú a hnedú farbu. Štýl obliekania zodpovedá 13. – 15. storočiu v západnej Európe.
          - Vojaci Gondoru sú odetí v závislosti od pôvodu. Kráľovské vojsko zo severu je odeté do jednoduchých uniforiem. Vojaci sú opatrení varkočmi a rozlišovacími znakmi bieleho stromu a hviezd. Uniforma je ladená do čiernej farby, u bohatších je zo zamatovej látky. Vojaci sú vyzbrojení podľa zaradenia jednotky. Pomerne rozšírená je pechota, ktorá je na obranné boje a boje v lesnatých a svahovitých terénoch vhodnejšia. Základnú výzbroj pešiaka tvorí štít oválneho či erbového tvaru s mečom, prípadne s palcátom. Oddiely štítonoscov sú doplnené o jednotky s dlhými pešiackymi kopijami a s bočnými dlhými nožmi a tesákmi. Táto pechota je odetá pomerne štandardne do prilbíc tvaru železných klobúkov, barbút či peších šalierov. Ako zbroj sú bežné prešívané a vypchávané zbroje, pri niektorých oddieloch doplnené o krúžkové či poloplátové komplety. Ako podporné jednotky slúžia lukostrelci, ktorí sú obrnení skôr skromne.
          - Jednotky južného Gondoru sú vlastne zložené z niekoľkých družín šľachticov, z ktorých jeden má rozhodujúce slovo veliteľa. Odev nie je ani zďaleka taký jednotný ako pri severných zboroch. Družiníci sú väčšinou bez insígnií alebo znakov, alebo nesú znak svojho pána, či už na štíte, alebo na varkoči. Južanská šľachta má mnoho znakov, erbov a zástav, ale za akýsi čiastočne zjednocujúci prvok platí zástava dolamrothského kniežaťa s bielou labuťou a štvorcípou hviezdou. Šľachtici sú vyzbrojení jazdeckou kopijou a štítom, ktorý slúži pri prvom náraze, následne tasia meče, sekery a palcáty. Sú odetí do krúžkovej či plátovej zbroje vysokej kvality, s prilbami. Pomocná pechota z družiníkov, pacholkov a odvedencov je vyzbrojená skôr kopijami, štítmi, sekerami a doplnená o kušostrelcov a lukostrelcov. Táto pomocná pechota je chránená v lepšom prípade ľahkou prešívanou či vypchávanou zbrojou, kabátcami z kože. Hlavu majú skrytú v čapiciach, batwatoch a príležitostne aj v prilbiciach.
          - Súčasné gondorské sily sa delia na takzvané zástavy. Severogondorské nesú znaky bieleho stromu s hviezdami, južanské rytierske korúhvy a pešie podporné zástavy uznávajú za zjednocujúcu štandardu znak bielej labute. Rytieri a prípadne k nim patriaci pacholkovia však na štítoch či vrchných varkočoch nesú znaky svojich rodov.
      - title: O gondorskom kráľovstve
        paragraphs:
          - Gondor je najstarším kráľovstvom ľudí v Stredozemi. Napriek tomu, že jeho pôvodná moc dlho upadala, teraz, keď sa vrátil kráľ, je sila Gondoru opäť na vzostupe, hotová vydobyť si svoju dávnu slávu.
          - Na hranice Gondorskej ríše možno hľadieť dvojakým spôsobom. Prvý je ten, ktorý používajú gondorskí páni. Teda pohľad zahŕňajúci pôvodné historické územia Gondoru, ktoré sú dnes už z veľkej časti pusté alebo obsadené Nepriateľom. Tento pohľad podnecuje túžbu znovu obsadiť zeme Ithilienu, vrátiť južnú hranicu za rieku Poros, obsadiť Harondor a obnoviť pevnosti na toku Harnenu. Ešte optimistickejšie plány sa zaoberajú myšlienkami na znovuvybudovanie pevností pozdĺž Ered Lithui a na obsadenie Umbaru a priľahlých oblastí.
          - O niečo triezvejší pohľad potom vníma hranice Gondoru tam, kde de facto ležia. Za západnú hranicu sa považuje Anfalas. Trávnatá, riedko osídlená vrchovina je akýmsi vzdialeným cípom gondorskej moci na západe. Páni a šľachta sú síce pokrvnými príbuznými Númenorejcov, ale stará krv je nielen medzi prostým ľudom zmiešaná s pôvodnými obyvateľmi. Veľká vzdialenosť týchto krajín od srdca kráľovstva spôsobuje, že vojna s nepriateľom na Východe sa zdá akýmsi poverami opradeným prízrakom, ktorý pohlcuje odvedencov, ktorých si žiadajú páni z veľkého mesta. Lojalita voči ríši značne ochladla a len málo pánov vypočulo volanie nového kráľa.
          - Z Anfalasu smerom na východ sa dvíha podhorská krajina Lamedon. Opevnený, kvitnúci Morthond je hlavným sídlom kniežaťa, ktoré vládne krajine baníckych osád. Práve odtiaľ pochádza rudné bohatstvo Gondoru. Nielen železnú rudu, ale aj strieborné žily a medené ložiská ukrýva vnútro Ered Nimrais.
          - Južne od Lamedonu leží Belfalas. Vo svojej južnejšej časti, ktorá ako cíp vbieha do mora, zviera pohorím zbrázdený Dor-en-Ernil spolu s Anfalasom zátoku Nen Belfalas.
          - Hlavné osídlenie však leží pozdĺž tokov a v delte riek Ciril a Ringló, neďaleko prístavu Edhellond. Bohatá poľnohospodárska krajina popretkávaná hájmi a lesmi s cédrovým drevom na stavbu tých najlepších námorných a riečnych lodí. Tu je sídlo kniežaťa Imrahila – hrad Dol Amroth, kvitnúce mesto a ďalší opevnený vojnový prístav, ktorý chráni pobrežie pred nájazdmi korzárov z Umbaru.
          - Najzápadnejšou časťou južného Gondoru je Lebennin. Úrodná, pastvinami, poľami a lesmi posiata krajina. Krajina veľkých stád oviec, koní a iného dobytka, krajina tkáčov a sklárov. A v neposlednom rade krajina obchodníkov.
          - Najväčší obchodný prístav Pelargir, ležiaci v delte veľtoku Anduiny, chránený ostrovom Tolfalas, je spolu s mestom Linhir, položeným viac na východe pri riečke Gilrain na hranici s Belfalasom, zdrojom bohatstva lebenninských kniežat.
          - Tým sa výpočet krajín južného Gondoru končí. Severná oblasť je na tom o niečo biednejšie. Zasiahnutá vojnou a ohňom stojí Minas Tirith a jej biela veža, obklopená stiesneným Lossarnachom a Anórienom, krajinou hraničiacou s kráľovstvom Pánov koní.
  uk:
    name: Ґондор
    tagline: Охоронці Білого Дерева, гордість Нуменору і останній щит Заходу.
    combat_style:
      - важча піхота
      - щити й мечі
      - списники
      - варта
    recommended_for:
      - гравці, які шукають шляхетний і геральдичний стиль
      - групи
      - досвідченіші бійці
    not_recommended_for:
      - гравці, які не мають часу підготувати костюм з геральдикою
    tags:
      - вільний народ
      - вища складність костюма
      - геральдичний стиль
    newbie_costume_hint: Туніка темно-синього або чорного кольору, срібні деталі, знак Білого Дерева або семи зірок. Плащ, пас, прямі мечі.
    camp_hook: Табір Ґондору вражає суворою дисципліною варти, молитвою до Заходу та вірною службою своєму сюзеренові.
    costume_colors_text: синій, білий, сірий; додатково коричневий і срібний
    heraldry_text: Срібне дерево із сімома зірками на темному полі.
    ruler:
      name: Aragorn
      title: Король Ґондору, спадкоємець Ісілдура
      description: Охоронець півночі, король Заходу, що повернувся. Веде вершників Білого Дерева та загони охоронців — об'єднує те, що довго було розділене. Гравець у грі за Ґондор упізнає командира за білим деревом на щиті, за короткими наказами та спокійною витримкою в скруті.
    lore_sections:
      - title: Стилізація костюма
        paragraphs:
          - Основна стилізація вояків ґондорських військ відповідає середньовічному суспільству Західної Європи 13–15 століть. Наголос на військовій справі, тобто класичний людський фентезійний воїн, витриманий у готиці. Це доповнено стилізацією за кіновзірцем, з наголосом на зображенні верховних знаків (Біле Дерево) і, за можливості, однострійним стилем костюма. Фактично йдеться про регулярне військо з призовників. Основу становлять допоміжні загони легких списників, сокирників, мечників зі щитами та слідопитів-лучників.
      - title: Про ґондорське військо
        paragraphs:
          - Південний і північний Ґондор — доволі відмінні краї.
          - Після втрати королівського роду південні землі почали поступово відособлюватися, а їхні князі зуміли піднести свої краї, майже не зачеплені війнами, до багатства й сили. Південна шляхта поступово утворила самостійний конгломерат князівств, пов'язаних між собою господарськи й військово. Головним авторитетом стали князі з Дол Амроту.
          - Землі північного Ґондору, якими врядував безпосередньо намісник королівства, потерпали від війни, від мору й через це також від нестатків. Північні краї стали підтримуваним, слабнучим, бідним сусідом, якого в найтяжчі часи доводилося втримувати від краху — чи то військовою, чи то господарською допомогою.
          - Це суттєво позначилося на відмінних військових традиціях обох частин країни.
          - Південна частина Ґондору класично феодальна, князі спираються на родову ленну шляхту, з лав якої набирається броньоване лицарство, основа південноґондорських контингентів. Ці контингенти доповнюють дружинники та збройні челядники лицарства й підсилюють князівські дружини з пішими та кінними латниками. Спорядження для себе й для свого загону лицар справляє власним коштом, і відповідно до цього має право на частку воєнної здобичі та на участь у командуванні.
          - Північний Ґондор цю модель повністю полишив. Війна знекровила шляхту, а до того ж треба було скликати дедалі більше мужів на заміну втрат, аніж могли дати самі лише дружини окремих панів. Війна тут була питанням існування, і до неї був залучений фактично кожен здоровий чоловік. Намісники визначили шляхтичам уряди для врядування та оборони країни, а самі як верховні володарі правили всіма підупалими князівствами. Військо збирають на основі регулярних наборів. Військової служби можна уникнути лише відкупом або іншою службою для намісникового уряду. Військо було об'єднане під одну корогву. Шляхтичам надали офіцерські чини, проте поступово офіцерський корпус доповнювався й простим людом.
          - Одяг у Ґондорській державі доволі однаковий, попри згадані вище відмінності між верствами. Лебеннін як край є джерелом не лише тканин, а й моди, що звідти поступово шириться по всій державі. Це, однак, не стосується простого люду, чий стиль одягання майже не змінюється. Носять полотняні вільні штани чи вільні прив'язні ногавиці (брухи), доповнені сорочками й туніками з лляних і вовняних тканин. Доволі модним кольором є відтінки синього, доповнені білим, сірим і коричневим. Стиль одягання відповідає 13–15 століттям у Західній Європі.
          - Вояки Ґондору вбрані залежно від походження. Королівське військо з півночі носить прості однострої. Вояки мають сюрко з розпізнавальними знаками білого дерева й зірок. Однострій витриманий у чорному кольорі, у заможніших — з оксамитової тканини. Озброєні вояки згідно з призначенням свого загону. Доволі поширена піхота, яка краще надається до оборонних боїв і до боїв у лісистій та схилистій місцевості. Основне спорядження пішого воїна становить щит овальної чи гербової форми з мечем, а подекуди з буздиганом. Загони щитників доповнюють підрозділи з довгими піхотними списами та з довгими ножами й тесаками як бічною зброєю. Ця піхота вбрана доволі однаково у шоломи у формі залізних капелюхів, барбютів чи піхотних салад. За обладунок правлять стьобані та підбиті обладунки, у деяких загонах доповнені кольчужними чи напівлатними комплектами. Як допоміжні підрозділи служать лучники, які захищені радше скупо.
          - Загони південного Ґондору складаються, власне, з кількох дружин шляхтичів, один з яких має вирішальне слово командира. Убрання далеко не таке однакове, як у північних корпусах. Дружинники здебільшого без відзнак чи знаків або несуть знак свого пана — чи то на щиті, чи то на сюрко. Південна шляхта має багато знаків, гербів і прапорів, але за певний частково об'єднавчий елемент править прапор дол-амротського князя з білим лебедем і чотирипроменевою зіркою. Шляхтичі озброєні кінним списом і щитом, що служить для першого зіткнення, а далі добувають мечі, сокири й буздигани. Вони вбрані в кольчужний чи латний обладунок високої якості, у шоломах. Допоміжна піхота з дружинників, челядників і призовників озброєна радше списами, щитами, сокирами й доповнена арбалетниками та лучниками. Ця допоміжна піхота захищена в кращому разі легким стьобаним чи підбитим обладунком, шкіряними каптанами. Голову ховають у шапках, батватах і подеколи також у шоломах.
          - Теперішні сили Ґондору поділяються на так звані корогви. Північноґондорські несуть знаки білого дерева із зірками, південні лицарські корогви та піші допоміжні корогви визнають за об'єднавчий штандарт знак білого лебедя. Лицарі та належні до них челядники, однак, несуть на щитах чи верхніх сюрко знаки своїх родів.
      - title: Про Ґондорське королівство
        paragraphs:
          - Ґондор — найстаріше королівство людей у Середзем'ї. Попри те, що його первісна могутність довго занепадала, нині, коли повернувся король, сила Ґондору знову зростає, готова здобути собі давню славу.
          - На межі Ґондорської держави можна дивитися двояко. Перший погляд — той, яким послуговуються ґондорські пани. Тобто погляд, що охоплює первісні історичні території Ґондору, які нині вже здебільшого пустельні або зайняті Ворогом. Такий погляд живить прагнення знову зайняти землі Ітілієну, повернути південний кордон за річку Порос, зайняти Гарондор і відновити фортеці на течії Гарнену. Ще оптимістичніші плани розмірковують про відбудову фортець уздовж Еред-Літуй і про захоплення Умбару та прилеглих країв.
          - Дещо тверезіший погляд убачає межі Ґондору там, де вони фактично пролягають. За західний кордон вважають Анфалас. Ця трав'яниста, рідко заселена височина — своєрідний далекий окраєць ґондорської влади на заході. Пани та шляхта хоч і є кровними родичами нуменорців, але давня кров змішана з первісними мешканцями не лише серед простого люду. Велика віддаль цих країв від серця королівства спричиняє те, що війна з ворогом на Сході видається якимось оповитим марновірством привидом, що поглинає призовників, яких вимагають пани з великого міста. Вірність державі помітно охолола, і лише небагато панів відгукнулося на поклик нового короля.
          - Від Анфаласу на схід здіймається передгірський край Ламедон. Укріплений, квітучий Мортонд є головним осідком князя, який владарює над краєм гірничих осель. Саме звідси походить рудне багатство Ґондору. Не лише залізну руду, а й срібні жили та мідні поклади ховає надро Еред-Німрайсу.
          - На південь від Ламедону лежить Белфалас. У своїй південнішій частині, що клином вибігає в море, порізаний горами Дор-ен-Ерніл разом з Анфаласом стискає затоку Нен-Белфалас.
          - Головні поселення, однак, лежать уздовж течій і в дельті річок Кіріл і Рінґло, поблизу гавані Едгеллонд. Багатий хліборобський край, помережаний гаями та лісами з кедровим деревом для будування найкращих морських і річкових кораблів. Тут осідок князя Імрагіла – замок Дол Амрот, квітуче місто й ще одна укріплена військова гавань, що боронить узбережжя від набігів корсарів з Умбару.
          - Найзахіднішою частиною південного Ґондору є Лебеннін. Родючий край, усіяний пасовиськами, полями й лісами. Край великих отар овець, табунів коней та іншої худоби, край ткачів і склярів. І не в останню чергу край купців.
          - Найбільша торгова гавань Пеларґір, що лежить у дельті великої ріки Андуїн і захищена островом Толфалас, разом з містом Лінгір, розташованим далі на схід біля річки Ґілрайн на межі з Белфаласом, є джерелом багатства лебеннінських князів.
          - На цьому перелік земель південного Ґондору завершується. Північна округа має ще сутужніше. Уражений війною та вогнем стоїть Мінас-Тіріт із своєю білою вежею, оточений стисненим Лоссарнахом і Анорієном, краєм, що межує з королівством Панів коней.
