combat_style:
  - elitní pěchota Uruk-hai
  - těžší zbraně a sekery
  - šiky a útok ve formaci
  - žádná slitovnost, žádný strach
recommended_for:
  - nováčci, kteří chtějí jednoduchý kostým a hodně boje
