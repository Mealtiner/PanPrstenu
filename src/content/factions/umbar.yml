side: evil
i18n:
  cs:
    name: Umbar
    tagline: Korzáři Umbaru, černé plachty, sůl jižních moří a krev na čepeli.
    combat_style:
      - lehčí pěchota
      - šavle, dýky, krátké meče
      - boj jeden na jednoho i ve dvojicích
      - hbití nájezdníci
    recommended_for:
      - hráči, kteří mají rádi piráty, korzáry a námořní motivy
      - hráči se zájmem o roleplay nájezdníků a žoldnéřů Stínu
      - hráči, kteří mají rádi pestrý kostým bez plné zbroje
    not_recommended_for:
      - hráči, kteří chtějí jen masivní pěchotní bitvy
      - úplní nováčci bez kostýmového základu
    tags:
      - síla temného pána
      - moře a jih
      - střední kostýmová náročnost
      - korzáři a nájezdníci
    newbie_costume_hint: Vrstvená košile, šerpa, vesta s mosaznými knoflíky, šátek na hlavě. Šavle nebo dýka. Vyhraj se s detaily — náušnice, řetízky, opasek se sponou. Mořská modř i krvavá rudá.
    camp_hook: Tábor Umbaru voní solí, dehtem a vínem. Mapy s vyznačenými přístavy, kostky házené o cizí lodě, hrdé řeči o tom, komu vlajka padla pod čepel.
    costume_colors_text: 'fialová, šedá, černá; sekundárně červená, modrá, bílá, stříbrné zdobení'
    heraldry_text: 'Vlastní umbárské znaky; vhodné motivy korzárů, černých plachet, moře, lodí, kotev, šavlí a jižních přístavů.'
    ruler:
      name: Korzárský kapitán
      title: Pán černých plachet a slaného vína
      description: Námořník, lupič i diplomat. Nevěří přísahám, jen zlatu a vlastní čepeli — a Saurona si bere za partnera, dokud je to výhodné. Hráč Umbaru vidí kapitána u stolu s mapou, házet kostkami o cizí lodě a smát se příliš nahlas.
    lore_sections:
      - title: Stylizace kostýmu
        paragraphs:
          - "Kostým Umbarské vojáka je de facto ‚univerzálním‘ lidským kostýmem, s\_přihlédnutím k\_tomu, že Umbar je město ležící v\_teplém přímořském klimatu a na moři jeho válečníci stráví většinu života. Oděvy jsou tedy voleny z\_lehkých materiálů, kombinovaných s\_nepromokavými svrchními vrstvami. Podrobněji doporučujeme text níže."
      - title: Historie Umbaru
        paragraphs:
          - Umbar byl kdysi přístavem, kde poprvé přistáli Númenorejci, starý lidský rod, žijící na ostrově Númenor, než se z vůle Valar potopil. Nejslavnějším a posledním, mezi númenorejskými krály byl ArPharazon, který odpadl od víry ve Valar a v boji porazil samotného Saurona a odvlekl jej do zajetí.
          - V pozdějších dnech se stal Umbar sídlem Černých Númenorejců, kteří jsou přímými potomky lidu, který s Ar-Pharazonem opustil ostrov Númenor. Neuctívali již dále Valar, ale upadli k uctívání Morgotha, jim známého, jako Melkor, pána Prázdnoty, ze závisti vůči Prvorozeným, elfům, kteří byli narozdíl od nich nesmrtelní. Černí Númenorejci byli v následujících stoletích poraženi a vyhnáni lidem Gondoru, který Umbar několikrát obsadil, aby jej zase několikrát ztratil v bojích s Haradem, ležícím na jihovýchod. K Umbaru pod nadvládou Númenorejců a jejich pokračovatelů patřilo i několik provincií na jihu, na pobřeží Haradu. Říká se, že krev Černého Númenoru přežila mezi některými vládci Haradu a že Númenorejská kultura, narozdíl od Númenorejské krve, přežila zase mezi některými vznešenými rodinami Umbaru.
          - Současnými pány Umbaru jsou Umbarští korzáři. Míšený lid, z části Haradské, z části Gondorské a z malé části snad Númenorejské krve, kteří svoje služby prodávají pánům Haradu, nebo sledují vlastní cíle a plení pobřeží Středozemě.
          - Umbarští vládci pronajímají služby svých korzárů tomu, kdo lépe platí. V době Války o Prsten byli většinou ve službách Haradu, jako převozníci vojska, nebo přímo bojová síla. Lid Umbaru užírá vrozená nenávist ke Gondorskému království, jelikož jemu dávají za vinu mnoho příkoří a ponížení, jichž se mu dostalo v uplynulých letech. Umbarští opovrhují skřety pro jejich ošklivost, nedisciplinovanost a podlézavou podřízenost.
      - title: Náboženství, kultura a společnost
        paragraphs:
          - "Jako jejich první předkové, Númenorejci, lid Umbaru nevěří ve světlo Valar, ale obrátil se k uctívání Saurona. Mezi vzdělanějšími a vznešenějšími se udržuje krvavý kult Prázdnoty, uctívajícího nepřítele Valar, Melkora / Morgotha. Tento kult se opět objevil teprve nedávno, v čase, kdy se začali vyčleňovat první Královi muži, nicméně s\_pádem Saurona rychle nabírá na síle."
          - Původní Númenorejská kultura se až na drobné střípky, které ještě navíc byly překrouceny k nepoznání (uplynulo od té doby již několik tisíc let…), v Umbaru nezachovala. Umbarská kultura je tak směsicí Haradské, Gondorské a jiných kultur. Dominantním prvkem je snaha reprezentovat co nejlépe sebe a svoji rodinu. Lid Umbaru je hrdý a pokud mohou, nosí jeho lidé drahé oděvy a šperky, často zdobné motivy mořských živočichů a bájných příšer. K ostatním lidem se chovají povýšeně, natož pak ke skřetům a jiným nižším bytostem. Nejváženější jsou vládci urozených rodů a potom kapitáni lodí. Každý kapitán je neomezeným pánem na své lodi a jeho slovo je zákon.
          - Neexistuje nic, jako jednotná Umbarská móda, nebo univerzální kód společenského chování. Každá městská čtvrť žije svébytnou módou a kulturou a každý rod a každý kapitán může diktovat právo podle svojí vlastní vůle. Zachovalo se ale několik zvyků ze starých dob, jejichž význam zná již jen málokdo. Při společenských příležitostech ve slušné společnosti je tak například vrcholem nevychovanosti vystavovat nezakrytou tvář. Umbarská smetánka tak nosí propracované masky roztodivných vzorů a z rozličných materiálů, které jsou pro náhodné návštěvníky města vždy předmětem údivu. Z podobně neznámých důvodů někteří bojovníci chodí do boje s tváří zakrytou maskami, které naopak vzbuzují spíše odpor a hrůzu. Původní význam obou zvyků se již dávno ztratil v tisíciletích míšení kultur a neutuchajících bojů o tento přístav.
          - Dalším zvykem je svatost osobního souboje mezi Umbarskými měšťany i šlechtou. Každý Umbarský má právo vyzvat na souboj kteréhokoli jiného a do jejich duelu nesmí nikdo jiný zasáhnout. Nezřídka se to stává i na bitevním poli, kdy kapitáni vyzývají na souboj velitele nepřátelských jednotek. Ani do takového souboje nikdo z Umbařanů nezasáhne a nepřátelská síla tak již několikrát byla odvedena do otroctví, aniž by došlo k větším ztrátám na životech. Mezi kapitány platí podobný zvyk. Nevyřízené účty a vzájemné neshody řeší kapitáni lodí soubojem na biče, dokud jeden z nich neztratí vědomí, nebo ze souboje neodstoupí.
          - Umbarské výsostné znaky se používají pouze v časech míru a ve válce používány nejsou. Na drancovací výpravě a ve válce jednotlivé lodě, flotily a kapitáni volí symbol podle vlastních preferencí. Můžeme tak narazit na motivy různých ryb, žraloků, chobotnic, mořských ježků, lastur a ulit. Některé můžou působit až bizarně, jako například loď, nesoucí označení „Plamenný hlemýžď“. Jedinými dvěma symboly, které se táhnou skrz celou armádu, jsou Mořský had a dříve Oko bez víčka v různých kombinacích. Královi muži s oblibou do heraldiky přidávají ještě Númenorejskou korunu, případně Morgothovu korunu ozdobenou Silmarilly.
      - title: Armáda, výzbroj a výstroj
        paragraphs:
          - V časech míru jsou páteří vojenské síly přístavu a kolonií lidové milice, které se dělí do mnoha jednotek a uskupení, podle příslušnosti k městské čtvrti, odkud pocházejí a podle úkolů, které jim svěřili vládci města. Ve válce se z většiny milicionářů stávají Umbarští korzáři.
          - Výstroj i výzbroj zůstává stejná, často jsou dokonce i stejně děleni do jednotek, ale podřízeností přecházejí pod kapitány válečných korábů. Výstroj a výzbroj milice i korzárů je lehká, uzpůsobená rychlým přesunům a boji na otevřeném moři. Řadí se do velkých jednotek bojovníků s kopím, nebo píkou, které jsou na křídlech podporovány střelci z kuší. Jako poboční zbraně jim slouží haradské šavle, nebo masivní tesáky s jílci tvarovanými do podoby bájných mořských oblud.
          - V oblékání se jednotlivé jednotky milice můžou různit, ale části výstroje jsou vždycky shodné. Široké kalhoty, zastrčené do bot, většinou červené, modré nebo šedé barvy. Spodní košile tmavé barvy, přes kterou je kaftan po kolena v barvách jednotky a tmavý nepromokavý kabát bez rukávů v délce kaftanu. Jako pokrývka hlavy slouží helmice z tvrdé kůže. Dalším prvkem zbroje jsou pak už jen nátepníky. Kaftan je přepásán minimálně dvěma pásky, jedním zdobeným, na kterém je zavěšená poboční zbraň a druhým prostým, užitkovým.
          - Veliteli Umbarských korzárů jsou v čase války buďto námořní kapitáni, nebo relativně nedávno vzniklá skupina Králových mužů. Jsou to povětšinou členové jednoho z výše postavených rodů, nebo kapitáni, či jejich původ není známý. S jejich vznikem se pojí oživení kultu Melkora a snaha o návrat k „tradicím“ Černého Númenoru. Oděním a výzbrojí se Královi muži výrazně odlišují od zbytku Umbarských sil a i jeden od druhého. Zdá se, že sjednocujícím prvkem v jejich vzezření je pouze používání dlouhých kabátců a suknic, výrazně těžší zbroje, než je mezi korzáry typické a bizarně tvarovaných kožených čapek, stylizovaných do podoby bájných mořských oblud. Ve výzbroji mohou mít jakoukoli zbraň, ale zjevně preferují kopí a píky v kombinaci s pobočními šavlemi haradského typu. Někteří používají dlouhé meče a těm se přezdívá Hlubinní ještěři.
          - Do bitvy nastupují s tváří krytou maskou, která v protivnících vzbuzuje hrůzu. Nemají žádné jednotné velení a zdá se, že si jsou mezi sebou rovni. Nějakou formu subordinace si vytvářejí jen pro potřeby konkrétní bitvy a ta s koncem bojů zaniká také. Když Králův muž v boji padne, jeho druhové se snaží jeho tělo odtáhnout, aby nepadlo do rukou nepřítele. Udržují si tím kult neporazitelných bojovníků.
          - Královi muži jsou také středobodem kultu Melkora mezi Umbarskými vojáky. Bývají mimo boj zachmuření, tiší a na vřejnosti nikdy neodhalují celou tvář, místo toho obličej halí krásnou maskou rozličného vzezření.
          - Další výrazně odlišnou společenskou skupinou jsou Nositelé Pravdy. Vznik tohoto uskupení v městě Umbaru není přesně datován a je částečně zahalen tajemstvím a legendami. Pravdou však zůstává, že jak se opětovně začal šířit kult Melkora mezi lidem Umbaru, začaly se objevovat zvěsti o záhadných válečnících s dlouhými meči, napomáhajících uctívačům toho kultu. Z počátku znělo v ulicích a putykách města, že je snazší spatřit bájného Hlubinného ještěra, než jednoho z oněch válečníků a byli právě proto hanlivě označováni Hlubinnými Ještěry. Jednoho dne však Nositelé Pravdy vyšli do ulic a kazatelé Melkorova kultu začali mezi elitou Umbaru veřejně provádět rituály v jeho jménu. Toho dne záhadně zmizelo velké množství občanů města, kteří nejhlasitěji pochybovali o Hlubinných Ještěrech. Od toho dne lid Umbaru chová Nositele Pravdy ve velké bázni a úctě, ač je nepřestal nazývat Hlubinnými Ještěry.
          - V boji tito válečníci bojují jako členové Králových mužů. V čase míru pomáhají Melkorovým kněžím, kde je třeba. Pro kapitány korzárských lodí je velkou ctí, když je na jejich výpra ě doprovází jeden z Hlubinných Ještěrů.
          - Inspirace pro jednotlivé části milice a korzáry
      - title: Stráže vnějších bran města
        paragraphs:
          - Někdy také označováni, jako Dveřníci. Do očí by jim to samozřejmě nikdy nikdo neřekl. Jsou verbování z chatrčí vnějšího města Umbaru a k vodě mají ze všech umbarských nejdál. Velitelé se od svých mužů příliš neliší, protože pocházejí z jejich řad, vyznačují se pouze důtkami, nebo karabáčem za pasem, který slouží jako odznak hodnosti a případně jako užitečná pomůcka na nové odvedence strážců bran. V bojích jsou tyto jednotky většinou na špici útoku, nebo v samém centru obranné linie. Jejich neochota ustupovat je v celém městě známá. Každý ze strážců bran totiž ví, že cokoliv je lepší jak se vrátit do chatrčí vnějšího města. V čase míru, jak už název napovídá, hlídají patroly Dveřníků vnější brány mešta a kontrolují, co a koho se kdo snaží převést do vnitřního města. Jejich typickou barvou je černá.
      - title: Strážci přístavu
        paragraphs:
          - Elita umbarské milice. Jsou to synové a dcery umbarských kapitánů a vlastníků lodí, na které se již nedostalo při dědictví kapitánského postu. Jejich velitelem je Strážce umbarského majáku, jeden z Králových mužů. V boji používají dlouhé harpuny a stejně jako jejich zástava je zdobena mořským hadem, tak samotní členové strážců přístavu k této tématice velmi tíhnou. Většinou bojují po boku Králových mužů a starají se o bezpečí obou křídel této elity Umbaru. V čase míru stráží přistav a kontrolují, co jaká loď přiváží. Jejich barvou je fialová.
      - title: Stráž severovýchodních hlásek
        paragraphs:
          - Nikdo je však pod tímto jménem nezná. Všichni této jednotce neřeknou jinak než Zjizvení. Někdo tvrdí, že je to proto, že kdo se chce stát velitelem Zjizvených, musí vyhrát zápas v klecích severovýchodního města. Odtud je také milice verbována. V bojích jde o krvežíznivé válečníky, kteří útočí z křídel Umbarské armády. Ještě děsivější je setkáním se Zjizvenými na moři, kde jediná spása je vrhnout se do vln. V časech míru dohlíží Zjizvení nad zápasnickými jámami a střeží hradební hlásky severovýchodu města. Nejsnadněji se vojáci poznají podle kopí s dlouhým hrotem z jedné strany opatřeným pilkou, aby zbraň působila co nejbolestivější zranění. Velitelé chodí oděni čistě v kombinacích červené.
  en:
    name: Umbar
    tagline: Corsairs of Umbar — black sails, salt of southern seas, and blood on the blade.
    combat_style:
      - lighter infantry
      - sabres, daggers, short swords
      - fighting one on one and in pairs
      - nimble raiders
    recommended_for:
      - players who like pirates, corsairs and seafaring themes
      - players interested in the roleplay of raiders and mercenaries of the Shadow
      - players who like a colourful costume without full armour
    not_recommended_for:
      - players who want nothing but massed infantry battles
      - complete newcomers with no costume basics
    tags:
      - force of the Dark Lord
      - sea and south
      - medium costume demands
      - corsairs and raiders
    newbie_costume_hint: A layered shirt, a sash, a waistcoat with brass buttons, a scarf on the head. A sabre or a dagger. Have fun with the details — earrings, chains, a belt with a buckle. Sea blue and blood red.
    camp_hook: The camp of Umbar smells of salt, tar and wine. Charts with the havens marked out, dice thrown for other men's ships, proud talk of whose flag fell beneath the blade.
    costume_colors_text: purple, grey, black; secondarily red, blue, white, silver ornament
    heraldry_text: The arms of Umbar itself; fitting motifs are corsairs, black sails, the sea, ships, anchors, sabres and the southern havens.
    ruler:
      name: Corsair Captain
      title: Lord of black sails and salt wine
      description: Sailor, robber and diplomat alike. He trusts no oath, only gold and his own blade — and he takes Sauron for a partner just as long as it pays. A player of Umbar sees the captain at the table with a chart, throwing dice for other men's ships and laughing far too loudly.
    lore_sections:
      - title: Costume styling
        paragraphs:
          - The costume of a soldier of Umbar is in effect a ‘universal' human costume, taking into account that Umbar is a city lying in a warm coastal climate and that its warriors spend most of their lives at sea. Garments are therefore chosen from light materials, combined with waterproof outer layers. For more detail we recommend the text below.
      - title: The history of Umbar
        paragraphs:
          - Umbar was once the haven where the Númenóreans first landed, an ancient race of Men who dwelt on the island of Númenor before it sank by the will of the Valar. The most renowned and the last among the Númenórean kings was Ar-Pharazôn, who fell away from faith in the Valar and who defeated Sauron himself in battle and carried him off into captivity.
          - In later days Umbar became the seat of the Black Númenóreans, who are the direct descendants of the people that left the island of Númenor with Ar-Pharazôn. They no longer revered the Valar but fell to the worship of Morgoth, known to them as Melkor, lord of the Void, out of envy of the Firstborn, the Elves, who unlike themselves were immortal. In the following centuries the Black Númenóreans were defeated and driven out by the people of Gondor, which occupied Umbar several times only to lose it again several times over in the wars with Harad, lying to the south-east. Under the dominion of the Númenóreans and their successors, Umbar also held several provinces in the south, on the coast of Harad. It is said that the blood of Black Númenor survived among certain rulers of Harad, and that Númenórean culture, unlike Númenórean blood, survived in turn among certain noble families of Umbar.
          - The present lords of Umbar are the Corsairs of Umbar. A mingled people, in part of Haradrim, in part of Gondorian and in small part perhaps of Númenórean blood, who sell their services to the lords of Harad, or else pursue their own ends and plunder the coasts of Middle-earth.
          - The rulers of Umbar hire out the services of their corsairs to whoever pays better. In the time of the War of the Ring they were mostly in the service of Harad, as ferriers of armies or as a fighting force outright. The people of Umbar are gnawed by an inborn hatred of the kingdom of Gondor, for they lay at its door many of the wrongs and humiliations they have suffered in years past. The men of Umbar despise the Orcs for their ugliness, their lack of discipline and their fawning servility.
      - title: Religion, culture and society
        paragraphs:
          - Like their first forefathers, the Númenóreans, the people of Umbar do not believe in the light of the Valar but have turned to the worship of Sauron. Among the more learned and the more highborn there persists a bloody cult of the Void, revering the enemy of the Valar, Melkor / Morgoth. This cult reappeared only recently, at the time when the first King's Men began to set themselves apart, yet with the fall of Sauron it is swiftly gathering strength.
          - The original Númenórean culture has not been preserved in Umbar, save for small fragments which have moreover been twisted beyond recognition (several thousand years have passed since then…). The culture of Umbar is thus a mixture of Haradrim, Gondorian and other cultures. Its dominant element is the effort to represent oneself and one's family as well as possible. The people of Umbar are proud, and where they can, they wear costly garments and jewellery, often with ornamental motifs of sea creatures and fabled monsters. Towards other Men they behave haughtily, let alone towards Orcs and other lesser beings. The most respected are the rulers of the noble houses, and after them the captains of ships. Every captain is the unlimited master of his own ship and his word is law.
          - There is no such thing as a single fashion of Umbar, nor a universal code of social conduct. Every city quarter lives by a fashion and a culture of its own, and every house and every captain may dictate the law according to their own will. Yet several customs from the old days have survived, whose meaning few now know. At social occasions in polite company, for instance, it is the height of ill breeding to display an uncovered face. The cream of Umbarian society therefore wears elaborate masks of the most peculiar patterns and of various materials, which are always a source of astonishment to chance visitors to the city. For similarly unknown reasons some warriors go into battle with their faces covered by masks which, by contrast, arouse revulsion and dread. The original meaning of both customs was long ago lost in the millennia of mingling cultures and unceasing struggles over this haven.
          - Another custom is the sanctity of the personal duel among the burghers and the nobility of Umbar alike. Every man of Umbar has the right to challenge any other, and no one else may intervene in their duel. Not seldom this happens even on the field of battle, when captains challenge the commanders of enemy units. Into such a duel, too, no man of Umbar will intervene, and more than once an enemy force has thus been led away into slavery without any great loss of life. A similar custom holds among the captains. Ships' captains settle unpaid scores and mutual disagreements with a duel of whips, until one of them loses consciousness or withdraws from the fight.
          - The sovereign arms of Umbar are used only in times of peace and are not used in war. On a plundering expedition and in war, individual ships, fleets and captains choose a symbol according to their own preference. We may thus come across motifs of various fish, sharks, octopuses, sea urchins, shells and conches. Some can seem downright bizarre, such as the ship bearing the name “The Flaming Snail”. The only two symbols that run through the whole army are the Sea-serpent and, formerly, the Lidless Eye in various combinations. The King's Men are fond of adding the Númenórean crown to the heraldry as well, or else Morgoth's crown adorned with the Silmarils.
      - title: The army, arms and equipment
        paragraphs:
          - In times of peace the backbone of the military strength of the haven and its colonies are the popular militias, which are divided into many units and formations according to the city quarter they come from and the tasks entrusted to them by the rulers of the city. In war most of the militiamen become Corsairs of Umbar.
          - Their equipment and arms remain the same, and they are often even divided into the same units, but in subordination they pass under the captains of the warships. The equipment and arms of the militia and of the corsairs alike are light, suited to swift movement and to fighting on the open sea. They form up in large units of fighters with spear or pike, supported on the wings by crossbowmen. Haradrim sabres serve them as side-arms, or massive falchions with hilts shaped in the likeness of fabled sea monsters.
          - In their dress the individual units of the militia may differ, but parts of the equipment are always the same. Wide trousers tucked into boots, mostly red, blue or grey. A dark undershirt, over which goes a knee-length caftan in the colours of the unit, and a dark waterproof sleeveless coat of the same length as the caftan. A helmet of hardened leather serves as headgear. The only further element of armour is a pair of vambraces. The caftan is girded with at least two belts, one ornamented, from which the side-arm hangs, and the other plain and utilitarian.
          - The commanders of the Corsairs of Umbar in time of war are either sea captains or the relatively recently formed group of the King's Men. They are for the most part members of one of the higher-standing houses, or captains, or else their origin is not known. Bound up with their emergence is the revival of the cult of Melkor and the effort to return to the “traditions” of Black Númenor. In dress and arms the King's Men differ markedly from the rest of the forces of Umbar, and from one another as well. It seems that the only unifying element in their appearance is the use of long jackets and skirted coats, of armour considerably heavier than is usual among the corsairs, and of bizarrely shaped leather caps styled in the likeness of fabled sea monsters. As for arms they may carry any weapon, but they clearly prefer spears and pikes combined with side-sabres of the Haradrim type. Some use long swords, and these are nicknamed the Deep Lizards.
          - They enter battle with their faces covered by a mask that inspires dread in their opponents. They have no unified command and appear to be equals among themselves. They create some form of subordination only for the needs of a particular battle, and it too ceases with the end of the fighting. When a King's Man falls in battle, his companions try to drag his body away so that it does not fall into the hands of the enemy. In this way they maintain their cult of invincible warriors.
          - The King's Men are also the focal point of the cult of Melkor among the soldiers of Umbar. Outside battle they tend to be sombre and silent, and in public they never uncover the whole face, veiling it instead with a beautiful mask of varying appearance.
          - Another markedly distinct social group are the Bearers of the Truth. The rise of this fellowship in the city of Umbar is not precisely dated and is partly shrouded in mystery and legend. It remains true, however, that as the cult of Melkor began once again to spread among the people of Umbar, rumours began to appear of mysterious warriors with long swords who aided the worshippers of that cult. At first it was said in the streets and taverns of the city that it was easier to catch sight of a fabled deep lizard than one of those warriors, and for that very reason they were derisively called the Deep Lizards. One day, however, the Bearers of the Truth came out into the streets, and the preachers of Melkor's cult began to perform rituals in his name openly among the elite of Umbar. On that day a great number of the city's citizens who had most loudly doubted the Deep Lizards mysteriously vanished. From that day the people of Umbar hold the Bearers of the Truth in great awe and reverence, though they have not stopped calling them the Deep Lizards.
          - In battle these warriors fight as members of the King's Men. In time of peace they help the priests of Melkor wherever it is needed. For the captains of corsair ships it is a great honour when one of the Deep Lizards accompanies them on their voyage.
          - Inspiration for the individual parts of the militia and for the corsairs
      - title: Guards of the outer gates of the city
        paragraphs:
          - Sometimes also called the Doorkeepers. To their faces, of course, no one would ever say it. They are recruited from the shacks of the outer city of Umbar, and of all the men of Umbar they are the farthest removed from the water. The commanders do not differ much from their men, since they come from their ranks; they are distinguished only by a scourge or a whip at the belt, which serves as a badge of rank and on occasion as a useful aid with new recruits to the gate guards. In battle these units are mostly at the spearhead of the attack, or in the very centre of the defensive line. Their unwillingness to retreat is known throughout the city. For every one of the gate guards knows that anything is better than going back to the shacks of the outer city. In time of peace, as the name suggests, patrols of the Doorkeepers watch the outer gates of the city and check what and whom anyone is trying to bring through into the inner city. Their characteristic colour is black.
      - title: Wardens of the haven
        paragraphs:
          - The elite of the militia of Umbar. They are the sons and daughters of the captains and shipowners of Umbar who were passed over for a captain's post in the inheritance. Their commander is the Warden of the Lighthouse of Umbar, one of the King's Men. In battle they use long harpoons, and just as their standard is adorned with a sea-serpent, so the members of the wardens of the haven themselves are strongly drawn to that theme. They mostly fight alongside the King's Men and see to the safety of both wings of this elite of Umbar. In time of peace they guard the haven and check what each ship brings in. Their colour is purple.
      - title: Watch of the north-eastern lookout towers
        paragraphs:
          - No one, however, knows them by that name. Everyone calls this unit nothing but the Scarred. Some claim it is because anyone who wishes to become commander of the Scarred must win a bout in the cages of the north-eastern city. That is also where the militia is recruited. In battle they are bloodthirsty warriors who attack from the wings of the army of Umbar. More terrible still is an encounter with the Scarred at sea, where the only salvation is to throw oneself into the waves. In times of peace the Scarred oversee the fighting pits and guard the wall towers of the north-east of the city. The soldiers are most easily recognised by their spears with a long head fitted with a saw edge on one side, so that the weapon inflicts the most painful wound possible. Their commanders go clad purely in combinations of red.
  de:
    name: Umbar
    tagline: Korsaren von Umbar — schwarze Segel, Salz südlicher Meere und Blut auf der Klinge.
    combat_style:
      - leichtere Infanterie
      - Säbel, Dolche, Kurzschwerter
      - Kampf Mann gegen Mann wie auch zu zweit
      - flinke Freibeuter
    recommended_for:
      - Spieler, die Piraten, Korsaren und maritime Motive mögen
      - Spieler mit Interesse am Rollenspiel von Freibeutern und Söldnern des Schattens
      - Spieler, die ein farbenfrohes Kostüm ohne volle Rüstung mögen
    not_recommended_for:
      - Spieler, die nur massige Infanterieschlachten wollen
      - völlige Neulinge ohne Kostümgrundlage
    tags:
      - Macht des Dunklen Herrschers
      - Meer und Süden
      - mittlerer Kostümaufwand
      - Korsaren und Freibeuter
    newbie_costume_hint: Ein geschichtetes Hemd, eine Schärpe, eine Weste mit Messingknöpfen, ein Tuch auf dem Kopf. Ein Säbel oder ein Dolch. Spiel dich mit den Details aus — Ohrringe, Kettchen, ein Gürtel mit Schnalle. Meerblau und Blutrot.
    camp_hook: Das Lager Umbars riecht nach Salz, Teer und Wein. Karten mit eingezeichneten Häfen, Würfel, die um fremde Schiffe geworfen werden, stolzes Gerede darüber, wessen Flagge unter die Klinge fiel.
    costume_colors_text: Violett, Grau, Schwarz; sekundär Rot, Blau, Weiß, silberne Verzierung
    heraldry_text: Die eigenen Wappen Umbars; passende Motive sind Korsaren, schwarze Segel, das Meer, Schiffe, Anker, Säbel und die südlichen Häfen.
    ruler:
      name: Korsarenkapitän
      title: Herr der schwarzen Segel und des salzigen Weins
      description: Seemann, Räuber und Diplomat zugleich. Er glaubt an keinen Eid, nur an Gold und an die eigene Klinge — und Sauron nimmt er sich zum Teilhaber, solange es sich lohnt. Ein Spieler Umbars sieht den Kapitän am Tisch über einer Karte, wie er um fremde Schiffe würfelt und viel zu laut lacht.
    lore_sections:
      - title: Stilisierung des Kostüms
        paragraphs:
          - Das Kostüm eines umbarischen Soldaten ist faktisch ein ‚universelles‘ menschliches Kostüm, unter Berücksichtigung dessen, dass Umbar eine Stadt in warmem Küstenklima ist und seine Krieger den größten Teil ihres Lebens auf See verbringen. Die Gewänder werden daher aus leichten Stoffen gewählt, kombiniert mit wasserdichten Oberschichten. Ausführlicher empfehlen wir den Text weiter unten.
      - title: Die Geschichte Umbars
        paragraphs:
          - Umbar war einst der Hafen, an dem die Númenórer zuerst landeten, ein altes Menschengeschlecht, das auf der Insel Númenor lebte, ehe sie durch den Willen der Valar versank. Der berühmteste und zugleich letzte unter den númenórischen Königen war Ar-Pharazôn, der vom Glauben an die Valar abfiel und im Kampf Sauron selbst besiegte und ihn in die Gefangenschaft verschleppte.
          - In späteren Tagen wurde Umbar zum Sitz der Schwarzen Númenórer, die die unmittelbaren Nachkommen jenes Volkes sind, das mit Ar-Pharazôn die Insel Númenor verließ. Sie verehrten die Valar nicht länger, sondern verfielen der Anbetung Morgoths, ihnen bekannt als Melkor, der Herr der Leere, aus Neid auf die Erstgeborenen, die Elben, die im Gegensatz zu ihnen unsterblich waren. In den folgenden Jahrhunderten wurden die Schwarzen Númenórer vom Volk Gondors besiegt und vertrieben, das Umbar mehrmals besetzte, um es in den Kämpfen mit dem südöstlich gelegenen Harad ebenso oft wieder zu verlieren. Zu Umbar unter der Herrschaft der Númenórer und ihrer Nachfolger gehörten auch mehrere Provinzen im Süden, an der Küste Harads. Man sagt, das Blut des Schwarzen Númenor habe unter manchen Herrschern Harads überdauert und die númenórische Kultur habe, anders als das númenórische Blut, wiederum unter manchen vornehmen Familien Umbars überlebt.
          - Die gegenwärtigen Herren Umbars sind die Korsaren von Umbar. Ein gemischtes Volk, zum Teil von haradrischem, zum Teil von gondorischem und zu einem kleinen Teil vielleicht von númenórischem Blut, das seine Dienste den Herren Harads verkauft oder eigene Ziele verfolgt und die Küsten Mittelerdes plündert.
          - Die Herrscher Umbars vermieten die Dienste ihrer Korsaren an den, der besser zahlt. Zur Zeit des Krieges um den Ring standen sie meist in den Diensten Harads, als Fährleute der Heere oder unmittelbar als Kampfkraft. Das Volk Umbars zehrt ein angeborener Hass auf das Königreich Gondor, denn ihm geben sie die Schuld an vielem Unrecht und mancher Demütigung, die ihm in den vergangenen Jahren widerfahren sind. Die Umbarer verachten die Orks für ihre Hässlichkeit, ihre Zuchtlosigkeit und ihre kriecherische Unterwürfigkeit.
      - title: Religion, Kultur und Gesellschaft
        paragraphs:
          - Wie ihre ersten Vorfahren, die Númenórer, glaubt das Volk Umbars nicht an das Licht der Valar, sondern hat sich der Anbetung Saurons zugewandt. Unter den Gebildeteren und Vornehmeren hält sich ein blutiger Kult der Leere, der den Feind der Valar verehrt, Melkor / Morgoth. Dieser Kult trat erst vor kurzem wieder hervor, zu der Zeit, als sich die ersten Männer des Königs abzusondern begannen, doch mit dem Fall Saurons gewinnt er rasch an Kraft.
          - Die ursprüngliche númenórische Kultur hat sich in Umbar nicht erhalten, bis auf kleine Splitter, die überdies bis zur Unkenntlichkeit verdreht wurden (seither sind schon mehrere Jahrtausende vergangen …). Die Kultur Umbars ist so eine Mischung aus haradrischen, gondorischen und anderen Kulturen. Ihr beherrschendes Element ist das Bestreben, sich selbst und die eigene Familie so gut wie möglich zur Geltung zu bringen. Das Volk Umbars ist stolz, und wo seine Leute können, tragen sie kostbare Gewänder und Schmuck, oft mit Ziermotiven von Meerestieren und sagenhaften Ungeheuern. Anderen Menschen gegenüber verhalten sie sich hochmütig, geschweige denn gegenüber Orks und anderen niederen Wesen. Das höchste Ansehen genießen die Herren der adligen Geschlechter und danach die Kapitäne der Schiffe. Jeder Kapitän ist unumschränkter Herr auf seinem Schiff, und sein Wort ist Gesetz.
          - Es gibt nichts wie eine einheitliche umbarische Mode oder einen allgemeingültigen Kodex gesellschaftlichen Verhaltens. Jedes Stadtviertel lebt in einer Mode und Kultur eigener Art, und jedes Geschlecht und jeder Kapitän darf das Recht nach dem eigenen Willen diktieren. Erhalten haben sich jedoch einige Bräuche aus alten Tagen, deren Bedeutung nur noch wenige kennen. Bei gesellschaftlichen Anlässen in feiner Gesellschaft ist es zum Beispiel der Gipfel der Unerzogenheit, das Gesicht unverhüllt zu zeigen. Die umbarische Oberschicht trägt daher kunstvolle Masken der wunderlichsten Muster und aus den verschiedensten Werkstoffen, die für zufällige Besucher der Stadt stets ein Gegenstand des Staunens sind. Aus ähnlich unbekannten Gründen ziehen manche Kämpfer mit maskenverhülltem Gesicht in den Kampf, wobei diese Masken umgekehrt eher Abscheu und Grauen wecken. Die ursprüngliche Bedeutung beider Bräuche ging längst in den Jahrtausenden der Kulturvermischung und der unablässigen Kämpfe um diesen Hafen verloren.
          - Ein weiterer Brauch ist die Heiligkeit des persönlichen Zweikampfs unter den umbarischen Bürgern wie auch dem Adel. Jeder Umbarer hat das Recht, jeden anderen zum Zweikampf zu fordern, und in ihr Duell darf niemand sonst eingreifen. Nicht selten geschieht das auch auf dem Schlachtfeld, wenn Kapitäne die Befehlshaber feindlicher Einheiten zum Zweikampf fordern. Auch in einen solchen Zweikampf greift keiner der Umbarer ein, und so wurde eine feindliche Streitmacht schon mehrmals in die Sklaverei geführt, ohne dass es zu größeren Verlusten an Menschenleben kam. Unter den Kapitänen gilt ein ähnlicher Brauch. Offene Rechnungen und gegenseitige Zwistigkeiten tragen die Schiffskapitäne im Peitschenduell aus, bis einer von ihnen das Bewusstsein verliert oder vom Kampf zurücktritt.
          - Die hoheitlichen Wappen Umbars werden nur in Friedenszeiten geführt und im Krieg nicht verwendet. Auf Raubfahrt und im Krieg wählen die einzelnen Schiffe, Flotten und Kapitäne ein Zeichen nach eigener Vorliebe. So können wir auf Motive verschiedener Fische, Haie, Kraken, Seeigel, Muscheln und Schneckenhäuser stoßen. Manche können geradezu bizarr wirken, wie etwa das Schiff mit der Bezeichnung „Die Flammende Schnecke“. Die einzigen beiden Zeichen, die sich durch das ganze Heer ziehen, sind die Meerschlange und früher das Lidlose Auge in verschiedenen Kombinationen. Die Männer des Königs fügen der Heraldik gern noch die númenórische Krone hinzu oder auch Morgoths Krone, geschmückt mit den Silmaril.
      - title: Heer, Bewaffnung und Ausrüstung
        paragraphs:
          - In Friedenszeiten bilden das Rückgrat der militärischen Macht des Hafens und der Kolonien die Volksmilizen, die sich in viele Einheiten und Verbände gliedern, je nach der Zugehörigkeit zu dem Stadtviertel, aus dem sie stammen, und nach den Aufgaben, die ihnen die Herren der Stadt anvertraut haben. Im Krieg werden aus den meisten Milizionären Korsaren von Umbar.
          - Ausrüstung und Bewaffnung bleiben dieselben, oft sind sie sogar in dieselben Einheiten gegliedert, doch in der Unterordnung gehen sie unter die Kapitäne der Kriegsschiffe über. Ausrüstung und Bewaffnung der Miliz wie der Korsaren sind leicht, auf schnelle Bewegungen und den Kampf auf offener See ausgelegt. Sie stellen sich in großen Einheiten von Kämpfern mit Speer oder Pike auf, die an den Flügeln von Armbrustschützen unterstützt werden. Als Seitenwaffen dienen ihnen haradrische Säbel oder massige Hiebmesser mit Griffen, die zu sagenhaften Meeresungeheuern geformt sind.
          - In der Kleidung können sich die einzelnen Einheiten der Miliz unterscheiden, doch Teile der Ausrüstung sind stets gleich. Weite, in die Stiefel gesteckte Hosen, meist in Rot, Blau oder Grau. Ein dunkles Unterhemd, darüber ein knielanger Kaftan in den Farben der Einheit und ein dunkler wasserdichter ärmelloser Mantel in der Länge des Kaftans. Als Kopfbedeckung dient ein Helm aus hartem Leder. Das einzige weitere Rüstungsstück sind dann nur noch die Armschienen. Der Kaftan wird von mindestens zwei Gürteln gehalten, einem verzierten, an dem die Seitenwaffe hängt, und einem schlichten, zweckmäßigen.
          - Befehlshaber der Korsaren von Umbar sind in Kriegszeiten entweder die Seekapitäne oder die verhältnismäßig jung entstandene Gruppe der Männer des Königs. Es sind zumeist Angehörige eines der höherstehenden Geschlechter oder Kapitäne, oder ihre Herkunft ist nicht bekannt. Mit ihrer Entstehung verbindet sich das Wiederaufleben des Kults Melkors und das Streben nach einer Rückkehr zu den „Traditionen“ des Schwarzen Númenor. In Gewand und Bewaffnung unterscheiden sich die Männer des Königs deutlich vom übrigen Aufgebot Umbars und auch voneinander. Es scheint, dass das einzige einigende Element ihrer Erscheinung allein der Gebrauch langer Wämser und Schoßröcke ist, einer deutlich schwereren Rüstung, als sie unter den Korsaren üblich ist, und bizarr geformter Lederkappen, die zu sagenhaften Meeresungeheuern stilisiert sind. An Waffen können sie jede beliebige führen, doch offenkundig bevorzugen sie Speere und Piken in Verbindung mit Seitensäbeln haradrischer Art. Manche gebrauchen Langschwerter, und diese werden Tiefenechsen genannt.
          - In die Schlacht treten sie mit einem Gesicht, das eine Maske verhüllt, die in den Gegnern Grauen weckt. Sie haben keinerlei einheitliche Führung und scheinen einander gleichgestellt zu sein. Irgendeine Form der Unterordnung schaffen sie nur für die Erfordernisse einer bestimmten Schlacht, und auch diese vergeht mit dem Ende der Kämpfe. Fällt ein Mann des Königs im Kampf, so versuchen seine Gefährten, seinen Leib fortzuschleppen, damit er nicht in die Hände des Feindes fällt. Damit erhalten sie ihren Kult der unbesiegbaren Krieger aufrecht.
          - Die Männer des Königs sind auch der Mittelpunkt des Kults Melkors unter den Soldaten Umbars. Außerhalb des Kampfes sind sie meist finster und schweigsam, und in der Öffentlichkeit entblößen sie niemals das ganze Gesicht, sondern verhüllen es stattdessen mit einer schönen Maske von wechselndem Aussehen.
          - Eine weitere deutlich abweichende gesellschaftliche Gruppe sind die Träger der Wahrheit. Die Entstehung dieser Gemeinschaft in der Stadt Umbar ist nicht genau datiert und teilweise von Geheimnis und Legenden umhüllt. Wahr bleibt jedoch, dass, als sich der Kult Melkors unter dem Volk Umbars erneut auszubreiten begann, Gerüchte über rätselhafte Krieger mit langen Schwertern aufkamen, die den Anhängern jenes Kults beistanden. Anfangs hieß es in den Gassen und Schenken der Stadt, es sei leichter, eine sagenhafte Tiefenechse zu erblicken als einen jener Krieger, und eben darum wurden sie höhnisch Tiefenechsen genannt. Eines Tages jedoch traten die Träger der Wahrheit auf die Straßen, und die Prediger von Melkors Kult begannen unter der Elite Umbars öffentlich Rituale in seinem Namen zu vollziehen. An jenem Tag verschwand auf rätselhafte Weise eine große Zahl von Bürgern der Stadt, die am lautesten an den Tiefenechsen gezweifelt hatten. Seit jenem Tag hegt das Volk Umbars vor den Trägern der Wahrheit große Scheu und Ehrfurcht, wenngleich es nicht aufgehört hat, sie Tiefenechsen zu nennen.
          - Im Kampf fechten diese Krieger als Angehörige der Männer des Königs. In Friedenszeiten helfen sie den Priestern Melkors, wo es nötig ist. Für die Kapitäne der Korsarenschiffe ist es eine große Ehre, wenn sie auf ihrer Fahrt einer der Tiefenechsen begleitet.
          - Inspiration für die einzelnen Teile der Miliz und für die Korsaren
      - title: Wachen der äußeren Stadttore
        paragraphs:
          - Manchmal auch die Türhüter genannt. Ins Gesicht würde ihnen das natürlich nie jemand sagen. Sie werden aus den Hütten der äußeren Stadt Umbars angeworben und haben es von allen Umbarern am weitesten zum Wasser. Die Befehlshaber unterscheiden sich von ihren Männern nicht sehr, denn sie stammen aus deren Reihen; sie zeichnen sich allein durch eine Riemenpeitsche oder eine Karbatsche am Gürtel aus, die als Rangabzeichen dient und gegebenenfalls als nützliches Hilfsmittel bei neuen Rekruten der Torwachen. In den Kämpfen stehen diese Einheiten meist an der Spitze des Angriffs oder in der Mitte der Verteidigungslinie. Ihre Unwilligkeit zu weichen ist in der ganzen Stadt bekannt. Denn jeder der Torwächter weiß, dass alles besser ist, als in die Hütten der äußeren Stadt zurückzukehren. In Friedenszeiten bewachen die Streifen der Türhüter, wie der Name schon sagt, die äußeren Tore der Stadt und prüfen, was und wen jemand in die innere Stadt zu bringen versucht. Ihre typische Farbe ist Schwarz.
      - title: Wächter des Hafens
        paragraphs:
          - Die Elite der umbarischen Miliz. Es sind die Söhne und Töchter der umbarischen Kapitäne und Schiffseigner, die beim Erbe des Kapitänspostens leer ausgingen. Ihr Befehlshaber ist der Wächter des Leuchtturms von Umbar, einer der Männer des Königs. Im Kampf gebrauchen sie lange Harpunen, und ebenso wie ihr Banner mit einer Meerschlange geschmückt ist, so neigen auch die Angehörigen der Hafenwächter selbst sehr zu diesem Thema. Meist kämpfen sie an der Seite der Männer des Königs und sorgen für die Sicherheit beider Flügel dieser Elite Umbars. In Friedenszeiten bewachen sie den Hafen und prüfen, was ein jedes Schiff heranbringt. Ihre Farbe ist Violett.
      - title: Wache der nordöstlichen Warttürme
        paragraphs:
          - Unter diesem Namen kennt sie jedoch niemand. Alle nennen diese Einheit nur die Vernarbten. Manche behaupten, es sei deshalb so, weil jeder, der Befehlshaber der Vernarbten werden will, einen Kampf in den Käfigen der nordöstlichen Stadt gewinnen muss. Von dort wird die Miliz auch angeworben. In den Kämpfen sind es blutrünstige Krieger, die von den Flügeln des umbarischen Heeres angreifen. Noch schrecklicher ist die Begegnung mit den Vernarbten auf See, wo die einzige Rettung darin besteht, sich in die Wellen zu stürzen. In Friedenszeiten wachen die Vernarbten über die Kampfgruben und hüten die Warttürme der Mauer im Nordosten der Stadt. Am leichtesten erkennt man die Soldaten an ihren Speeren mit langer Spitze, die auf einer Seite mit einer Sägeschneide versehen ist, damit die Waffe eine möglichst schmerzhafte Wunde schlägt. Die Befehlshaber gehen rein in Kombinationen von Rot gekleidet.
  sk:
    name: Umbar
    tagline: Korzári Umbaru — čierne plachty, soľ južných morí a krv na čepeli.
    combat_style:
      - ľahšia pechota
      - šable, dýky, krátke meče
      - boj jeden na jedného aj vo dvojiciach
      - hbití nájazdníci
    recommended_for:
      - hráči, ktorí majú radi pirátov, korzárov a námorné motívy
      - hráči so záujmom o roleplay nájazdníkov a žoldnierov Tieňa
      - hráči, ktorí majú radi pestrý kostým bez plnej zbroje
    not_recommended_for:
      - hráči, ktorí chcú len masívne pechotné bitky
      - úplní nováčikovia bez kostýmového základu
    tags:
      - sila temného pána
      - more a juh
      - stredná kostýmová náročnosť
      - korzári a nájazdníci
    newbie_costume_hint: Vrstvená košeľa, šerpa, vesta s mosadznými gombíkmi, šatka na hlave. Šabľa alebo dýka. Vyhraj sa s detailmi — náušnice, retiazky, opasok so sponou. Morská modrá aj krvavá červená.
    camp_hook: Tábor Umbaru vonia soľou, dechtom a vínom. Mapy s vyznačenými prístavmi, kocky hádzané o cudzie lode, hrdé reči o tom, komu zástava padla pod čepeľ.
    costume_colors_text: fialová, sivá, čierna; sekundárne červená, modrá, biela, strieborné zdobenie
    heraldry_text: Vlastné umbarské znaky; vhodné motívy korzárov, čiernych plachiet, mora, lodí, kotiev, šablí a južných prístavov.
    ruler:
      name: Korzársky kapitán
      title: Pán čiernych plachiet a slaného vína
      description: Námorník, lupič i diplomat. Neverí prísahám, len zlatu a vlastnej čepeli — a Saurona si berie za partnera, kým je to preňho výhodné. Hráč Umbaru vidí kapitána pri stole s mapou, ako hádže kockami o cudzie lode a smeje sa príliš nahlas.
    lore_sections:
      - title: Štylizácia kostýmu
        paragraphs:
          - Kostým umbarského vojaka je de facto ‚univerzálnym‘ ľudským kostýmom, s prihliadnutím na to, že Umbar je mesto ležiace v teplom prímorskom podnebí a jeho bojovníci strávia väčšinu života na mori. Odevy sa teda volia z ľahkých materiálov, kombinovaných s nepremokavými vrchnými vrstvami. Podrobnejšie odporúčame text nižšie.
      - title: História Umbaru
        paragraphs:
          - Umbar bol kedysi prístavom, kde po prvý raz pristáli Númenorejci, starý ľudský rod žijúci na ostrove Númenor, kým sa ten z vôle Valar nepotopil. Najslávnejším a zároveň posledným spomedzi númenorejských kráľov bol Ar-Pharazôn, ktorý odpadol od viery vo Valar, v boji porazil samotného Saurona a odvliekol ho do zajatia.
          - V neskorších dňoch sa Umbar stal sídlom Čiernych Númenorejcov, ktorí sú priamymi potomkami ľudu, čo spolu s Ar-Pharazônom opustil ostrov Númenor. Valar už ďalej neuctievali, ale upadli k uctievaniu Morgotha, im známeho ako Melkor, pána Prázdnoty, a to zo závisti voči Prvorodeným, elfom, ktorí boli na rozdiel od nich nesmrteľní. Čiernych Númenorejcov v nasledujúcich storočiach porazil a vyhnal ľud Gondoru, ktorý Umbar niekoľkokrát obsadil, aby ho zase niekoľkokrát stratil v bojoch s Haradom, ležiacim na juhovýchod. K Umbaru pod nadvládou Númenorejcov a ich pokračovateľov patrilo aj niekoľko provincií na juhu, na pobreží Haradu. Hovorí sa, že krv Čierneho Númenoru prežila medzi niektorými vládcami Haradu a že númenorejská kultúra — na rozdiel od númenorejskej krvi — prežila zase medzi niektorými vznešenými rodinami Umbaru.
          - Súčasnými pánmi Umbaru sú umbarskí korzári. Miešaný ľud, sčasti haradskej, sčasti gondorskej a z malej časti azda aj númenorejskej krvi, ktorý svoje služby predáva pánom Haradu, alebo sleduje vlastné ciele a plieni pobrežie Stredozeme.
          - Umbarskí vládcovia prenajímajú služby svojich korzárov tomu, kto lepšie platí. V čase Vojny o Prsteň boli väčšinou v službách Haradu, ako prevozníci vojska alebo priamo ako bojová sila. Ľud Umbaru užiera vrodená nenávisť ku Gondorskému kráľovstvu, pretože práve jemu dávajú za vinu mnohé príkoria a poníženia, ktorých sa im v uplynulých rokoch dostalo. Umbarčania opovrhujú škretmi pre ich škaredosť, nedisciplinovanosť a podlízavú podriadenosť.
      - title: Náboženstvo, kultúra a spoločnosť
        paragraphs:
          - Tak ako ich prví predkovia, Númenorejci, ani ľud Umbaru neverí vo svetlo Valar, ale obrátil sa k uctievaniu Saurona. Medzi vzdelanejšími a vznešenejšími sa udržiava krvavý kult Prázdnoty, uctievajúci nepriateľa Valar, Melkora / Morgotha. Tento kult sa znovu objavil len nedávno, v čase, keď sa začali vyčleňovať prví Kráľovi muži, no s pádom Saurona rýchlo naberá na sile.
          - Pôvodná númenorejská kultúra sa v Umbare nezachovala, až na drobné črepiny, ktoré boli navyše prekrútené na nepoznanie (uplynulo odvtedy už niekoľko tisíc rokov…). Umbarská kultúra je tak zmesou haradskej, gondorskej a iných kultúr. Dominantným prvkom je snaha čo najlepšie reprezentovať seba a svoju rodinu. Ľud Umbaru je hrdý, a pokiaľ môžu, nosia jeho ľudia drahé odevy a šperky, často so zdobnými motívmi morských živočíchov a bájnych príšer. K ostatným ľuďom sa správajú povýšenecky, nieto ešte ku škretom a iným nižším bytostiam. Najváženejší sú vládcovia urodzených rodov a po nich kapitáni lodí. Každý kapitán je neobmedzeným pánom na svojej lodi a jeho slovo je zákon.
          - Neexistuje nič také ako jednotná umbarská móda alebo univerzálny kódex spoločenského správania. Každá mestská štvrť žije svojbytnou módou a kultúrou a každý rod i každý kapitán môže diktovať právo podľa vlastnej vôle. Zachovalo sa však niekoľko zvykov zo starých čias, ktorých význam pozná už len málokto. Pri spoločenských príležitostiach v slušnej spoločnosti je tak napríklad vrcholom nevychovanosti vystavovať nezakrytú tvár. Umbarská smotánka preto nosí prepracované masky roztodivných vzorov a z rozličných materiálov, ktoré sú pre náhodných návštevníkov mesta vždy predmetom údivu. Z podobne neznámych dôvodov chodia niektorí bojovníci do boja s tvárou zakrytou maskami, ktoré naopak vzbudzujú skôr odpor a hrôzu. Pôvodný význam oboch zvykov sa už dávno stratil v tisícročiach miešania kultúr a neutíchajúcich bojov o tento prístav.
          - Ďalším zvykom je svätosť osobného súboja medzi umbarskými mešťanmi i šľachtou. Každý Umbarčan má právo vyzvať na súboj kohokoľvek iného a do ich duelu nesmie nikto iný zasiahnuť. Nezriedka sa to stáva aj na bojisku, keď kapitáni vyzývajú na súboj veliteľov nepriateľských jednotiek. Ani do takého súboja nikto z Umbarčanov nezasiahne, a nepriateľská sila tak už niekoľkokrát bola odvedená do otroctva bez väčších strát na životoch. Medzi kapitánmi platí podobný zvyk. Nevyrovnané účty a vzájomné nezhody riešia kapitáni lodí súbojom na biče, kým jeden z nich nestratí vedomie alebo zo súboja neodstúpi.
          - Umbarské výsostné znaky sa používajú len v časoch mieru, vo vojne sa nepoužívajú. Na drancovacej výprave a vo vojne si jednotlivé lode, flotily a kapitáni volia symbol podľa vlastných preferencií. Môžeme tak naraziť na motívy rôznych rýb, žralokov, chobotníc, morských ježkov, lastúr a ulít. Niektoré môžu pôsobiť až bizarne, ako napríklad loď nesúca označenie „Plamenný slimák“. Jedinými dvoma symbolmi, ktoré sa tiahnu cez celú armádu, sú Morský had a kedysi Oko bez viečka v rôznych kombináciách. Kráľovi muži s obľubou pridávajú do heraldiky ešte númenorejskú korunu, prípadne Morgothovu korunu ozdobenú silmarilmi.
      - title: Armáda, výzbroj a výstroj
        paragraphs:
          - V časoch mieru sú chrbtovou kosťou vojenskej sily prístavu a kolónií ľudové milície, ktoré sa delia do mnohých jednotiek a zoskupení podľa príslušnosti k mestskej štvrti, odkiaľ pochádzajú, a podľa úloh, ktoré im zverili vládcovia mesta. Vo vojne sa z väčšiny milicionárov stávajú umbarskí korzári.
          - Výstroj i výzbroj zostáva rovnaká, často sú dokonca aj rovnako rozdelení do jednotiek, ale podriadenosťou prechádzajú pod kapitánov vojnových korábov. Výstroj a výzbroj milície aj korzárov je ľahká, prispôsobená rýchlym presunom a boju na otvorenom mori. Radia sa do veľkých jednotiek bojovníkov s kopijou alebo pikou, ktoré sú na krídlach podporované strelcami z kuší. Ako pobočné zbrane im slúžia haradské šable alebo masívne tesáky s rukoväťami tvarovanými do podoby bájnych morských oblúd.
          - V obliekaní sa jednotlivé jednotky milície môžu líšiť, ale časti výstroja sú vždy rovnaké. Široké nohavice zastrčené do čižiem, väčšinou červenej, modrej alebo sivej farby. Spodná košeľa tmavej farby, cez ktorú ide kaftan po kolená vo farbách jednotky, a tmavý nepremokavý kabát bez rukávov v dĺžke kaftana. Ako pokrývka hlavy slúži prilbica z tvrdej kože. Ďalším prvkom zbroje sú potom už len nátepníky. Kaftan je prepásaný najmenej dvoma pásmi — jedným zdobeným, na ktorom je zavesená pobočná zbraň, a druhým prostým, úžitkovým.
          - Veliteľmi umbarských korzárov sú v čase vojny buď námorní kapitáni, alebo relatívne nedávno vzniknutá skupina Kráľových mužov. Sú to prevažne členovia niektorého z vyššie postavených rodov alebo kapitáni, prípadne ich pôvod nie je známy. S ich vznikom sa spája oživenie kultu Melkora a snaha o návrat k „tradíciám“ Čierneho Númenoru. Odením a výzbrojou sa Kráľovi muži výrazne odlišujú od zvyšku umbarských síl, ale aj jeden od druhého. Zdá sa, že jediným zjednocujúcim prvkom v ich vzhľade je používanie dlhých kabátcov a sukníc, výrazne ťažšej zbroje, než je medzi korzármi typické, a bizarne tvarovaných kožených čiapok štylizovaných do podoby bájnych morských oblúd. Vo výzbroji môžu mať akúkoľvek zbraň, ale zjavne uprednostňujú kopije a piky v kombinácii s pobočnými šabľami haradského typu. Niektorí používajú dlhé meče a tým sa prezýva Hlbinné jaštery.
          - Do bitky nastupujú s tvárou krytou maskou, ktorá v protivníkoch vzbudzuje hrôzu. Nemajú žiadne jednotné velenie a zdá sa, že sú si medzi sebou rovní. Nejakú formu subordinácie si vytvárajú len pre potreby konkrétnej bitky a tá s koncom bojov takisto zaniká. Keď Kráľov muž v boji padne, jeho druhovia sa snažia jeho telo odtiahnuť, aby nepadlo do rúk nepriateľa. Udržiavajú si tým kult neporaziteľných bojovníkov.
          - Kráľovi muži sú aj stredobodom kultu Melkora medzi umbarskými vojakmi. Mimo boja bývajú zachmúrení, tichí a na verejnosti nikdy neodhaľujú celú tvár, namiesto toho ju halia krásnou maskou rozličného vzhľadu.
          - Ďalšou výrazne odlišnou spoločenskou skupinou sú Nositelia Pravdy. Vznik tohto zoskupenia v meste Umbar nie je presne datovaný a je čiastočne zahalený tajomstvom a legendami. Pravdou však zostáva, že ako sa kult Melkora začal opäť šíriť medzi ľudom Umbaru, začali sa objavovať zvesti o záhadných bojovníkoch s dlhými mečmi, ktorí uctievačom toho kultu napomáhali. Spočiatku znelo v uliciach a krčmách mesta, že je ľahšie zazrieť bájneho Hlbinného jaštera než jedného z oných bojovníkov, a práve preto ich hanlivo označovali za Hlbinné jaštery. Jedného dňa však Nositelia Pravdy vyšli do ulíc a kazatelia Melkorovho kultu začali medzi elitou Umbaru verejne vykonávať rituály v jeho mene. Toho dňa záhadne zmizlo veľké množstvo občanov mesta, ktorí o Hlbinných jašteroch pochybovali najhlasnejšie. Od toho dňa chová ľud Umbaru Nositeľov Pravdy vo veľkej bázni a úcte, hoci ich neprestal nazývať Hlbinnými jaštermi.
          - V boji títo bojovníci bojujú ako členovia Kráľových mužov. V čase mieru pomáhajú Melkorovým kňazom, kde je treba. Pre kapitánov korzárskych lodí je veľkou cťou, keď ich na výprave sprevádza jeden z Hlbinných jašterov.
          - Inšpirácia pre jednotlivé časti milície a korzárov
      - title: Stráže vonkajších brán mesta
        paragraphs:
          - Niekedy tiež označovaní ako Dverníci. Do očí by im to samozrejme nikto nikdy nepovedal. Verbujú sa z chatrčí vonkajšieho mesta Umbaru a k vode to majú zo všetkých Umbarčanov najďalej. Velitelia sa od svojich mužov príliš nelíšia, pretože pochádzajú z ich radov; vyznačujú sa len dôtkami alebo karabáčom za pásom, ktorý slúži ako odznak hodnosti a prípadne aj ako užitočná pomôcka na nových odvedencov strážcov brán. V bojoch bývajú tieto jednotky na špici útoku alebo v samom strede obrannej línie. Ich neochota ustupovať je známa v celom meste. Každý zo strážcov brán totiž vie, že čokoľvek je lepšie než návrat do chatrčí vonkajšieho mesta. V čase mieru, ako už názov napovedá, strážia hliadky Dverníkov vonkajšie brány mesta a kontrolujú, čo a koho sa kto snaží previesť do vnútorného mesta. Ich typickou farbou je čierna.
      - title: Strážcovia prístavu
        paragraphs:
          - Elita umbarskej milície. Sú to synovia a dcéry umbarských kapitánov a majiteľov lodí, na ktorých sa už pri dedení kapitánskeho postu neušlo. Ich veliteľom je Strážca umbarského majáka, jeden z Kráľových mužov. V boji používajú dlhé harpúny, a tak ako je ich zástava zdobená morským hadom, aj samotní členovia strážcov prístavu k tejto téme veľmi tiahnu. Väčšinou bojujú po boku Kráľových mužov a starajú sa o bezpečie oboch krídel tejto elity Umbaru. V čase mieru strážia prístav a kontrolujú, čo ktorá loď priváža. Ich farbou je fialová.
      - title: Stráž severovýchodných hlások
        paragraphs:
          - Nikto ich však pod týmto menom nepozná. Všetci tejto jednotke nepovedia inak než Zjazvení. Niekto tvrdí, že je to preto, lebo kto sa chce stať veliteľom Zjazvených, musí vyhrať zápas v klietkach severovýchodného mesta. Odtiaľ sa milícia aj verbuje. V bojoch ide o krvilačných bojovníkov, ktorí útočia z krídel umbarskej armády. Ešte desivejšie je stretnutie so Zjazvenými na mori, kde jedinou spásou je vrhnúť sa do vĺn. V časoch mieru dohliadajú Zjazvení na zápasnícke jamy a strážia hradobné hlásky na severovýchode mesta. Najľahšie vojakov spoznáš podľa kopije s dlhým hrotom, z jednej strany opatreným pílkou, aby zbraň spôsobila čo najbolestivejšie zranenie. Velitelia chodia odetí čisto v kombináciách červenej.
  uk:
    name: Умбар
    tagline: Корсари Умбара — чорні вітрила, сіль південних морів і кров на клинку.
    combat_style:
      - легша піхота
      - шаблі, кинджали, короткі мечі
      - бій один на один і в парах
      - меткі нападники
    recommended_for:
      - гравці, які люблять піратів, корсарів і морські мотиви
      - гравці, яких цікавить рольова гра нападників і найманців Тіні
      - гравці, які люблять барвистий костюм без повного обладунку
    not_recommended_for:
      - гравці, які хочуть лише масові піхотні битви
      - цілковиті новачки без костюмної основи
    tags:
      - сила Темного володаря
      - море і південь
      - середня костюмна вимогливість
      - корсари й нападники
    newbie_costume_hint: Багатошарова сорочка, пояс-шарф, жилет із латунними ґудзиками, хустка на голові. Шабля або кинджал. Погравайся з деталями — сережки, ланцюжки, пояс із пряжкою. Морська блакить і кривава червінь.
    camp_hook: Табір Умбару пахне сіллю, дьогтем і вином. Мапи з позначеними гаванями, кості, що їх кидають на чужі кораблі, горді розмови про те, чия корогва впала під клинок.
    costume_colors_text: фіалкова, сіра, чорна; додатково червона, синя, біла, срібна оздоба
    heraldry_text: Власні умбарські знаки; пасують мотиви корсарів, чорних вітрил, моря, кораблів, якорів, шабель і південних гаваней.
    ruler:
      name: Капітан корсарів
      title: Володар чорних вітрил і солоного вина
      description: Мореплавець, розбійник і дипломат заразом. Він не вірить у присяги, лише в золото та власний клинок — а Саурона бере собі за спільника, доки це вигідно. Гравець Умбару бачить капітана за столом із мапою, як той кидає кості на чужі кораблі й сміється надто гучно.
    lore_sections:
      - title: Стилізація костюма
        paragraphs:
          - Костюм умбарського вояка — це фактично „універсальний“ людський костюм, з огляду на те, що Умбар є містом у теплому приморському кліматі, а його воїни більшу частину життя проводять у морі. Тож одяг добирають із легких матеріалів у поєднанні з непромокальними верхніми шарами. Докладніше рекомендуємо текст нижче.
      - title: Історія Умбару
        paragraphs:
          - Умбар колись був гаванню, де вперше пристали нуменорці, давній рід людей, що жив на острові Нуменор, доки той не потонув із волі Валар. Найславетнішим і водночас останнім серед нуменорських королів був Ар-Фаразон, який відпав від віри у Валар, у битві здолав самого Саурона й потягнув його в полон.
          - У пізніші дні Умбар став осідком Чорних нуменорців, які є прямими нащадками того люду, що разом з Ар-Фаразоном покинув острів Нуменор. Валар вони більше не шанували, а впали в поклоніння Морґотові, відомому їм як Мелькор, володар Порожнечі, — і то із заздрості до Первородних, ельфів, які, на відміну від них, були безсмертні. У наступні століття Чорних нуменорців розбив і вигнав люд Ґондору, що кілька разів займав Умбар, аби кілька разів знову втратити його в боях із Гарадом, який лежить на південний схід. До Умбару під владою нуменорців та їхніх наступників належало й кілька провінцій на півдні, на узбережжі Гараду. Кажуть, що кров Чорного Нуменору вціліла серед декотрих володарів Гараду, а нуменорська культура — на відміну від нуменорської крові — вціліла своєю чергою серед декотрих вельможних родин Умбару.
          - Нинішні пани Умбару — умбарські корсари. Мішаний люд, почасти гарадської, почасти ґондорської і невеликою мірою, можливо, нуменорської крові, який продає свої послуги панам Гараду або переслідує власні цілі й плюндрує узбережжя Середзем'я.
          - Володарі Умбару винаймають послуги своїх корсарів тому, хто краще платить. За часів Війни за Перстень вони здебільшого були на службі Гараду — як перевізники війська або й прямо як бойова сила. Люд Умбару з'їдає вроджена ненависть до Ґондорського королівства, бо саме йому вони ставлять за вину численні кривди й приниження, яких зазнали в минулі роки. Умбарці зневажають орків за їхню бридкість, недисциплінованість і улесливу покору.
      - title: Релігія, культура і суспільство
        paragraphs:
          - Як і їхні перші предки, нуменорці, люд Умбару не вірить у світло Валар, а звернувся до поклоніння Сауронові. Серед освіченіших і вельможніших тримається кривавий культ Порожнечі, що шанує ворога Валар, Мелькора / Морґота. Цей культ з'явився знову лише недавно, у час, коли почали відокремлюватися перші Мужі Короля, проте з падінням Саурона він швидко набирає сили.
          - Первісна нуменорська культура в Умбарі не збереглася, крім дрібних уламків, які до того ж було перекручено до невпізнання (відтоді минуло вже кілька тисяч років…). Умбарська культура є, отже, сумішшю гарадської, ґондорської та інших культур. Панівним її елементом є прагнення якнайкраще представити себе і свою родину. Люд Умбару гордий, і поки може, носить дороге вбрання та прикраси, часто з оздобними мотивами морських істот і казкових чудовиськ. До інших людей ставиться зверхньо, а до орків та інших нижчих істот і поготів. Найбільшу пошану мають володарі шляхетних родів, а по них капітани кораблів. Кожен капітан — необмежений пан на своєму кораблі, і його слово є закон.
          - Не існує нічого такого, як єдина умбарська мода чи універсальний кодекс суспільної поведінки. Кожен міський квартал живе власною модою й культурою, а кожен рід і кожен капітан може диктувати право за власною волею. Проте вціліло кілька звичаїв давніх часів, значення яких знає вже мало хто. Так, на світських подіях у порядному товаристві вершиною невихованості є показувати незакрите обличчя. Умбарські вершки тому носять вигадливі маски найрозмаїтіших візерунків і з різних матеріалів, які для випадкових гостей міста завжди є предметом подиву. З так само невідомих причин декотрі воїни йдуть у бій із обличчям, закритим масками, які, навпаки, викликають радше огиду й жах. Первісне значення обох звичаїв давно загубилося в тисячоліттях змішування культур і невпинних боїв за цю гавань.
          - Ще одним звичаєм є святість особистого двобою поміж умбарськими міщанами й шляхтою. Кожен умбарець має право викликати на двобій будь-кого іншого, і в їхній поєдинок не сміє втрутитися ніхто. Нерідко це стається й на полі бою, коли капітани викликають на двобій командирів ворожих загонів. Ані в такий двобій ніхто з умбарців не втрутиться, і ворожу силу вже кілька разів у такий спосіб відвели в неволю без більших втрат людських життів. Поміж капітанами діє схожий звичай. Незакриті рахунки й взаємні незгоди капітани кораблів вирішують двобоєм на батогах, доки один із них не втратить свідомість або не відступить із поєдинку.
          - Умбарські державні знаки вживають лише в часи миру, а на війні їх не використовують. У грабіжницькому поході й на війні окремі кораблі, флоти й капітани обирають символ за власними вподобаннями. Тож можна натрапити на мотиви різних риб, акул, восьминогів, морських їжаків, мушель і черепашок. Деякі можуть здаватися просто-таки химерними — як-от корабель із назвою „Полум'яний равлик“. Єдиними двома символами, що проходять крізь усе військо, є Морський змій і колись Око без повіки в різних поєднаннях. Мужі Короля залюбки додають до геральдики ще нуменорську корону, а то й корону Морґота, оздоблену сильмарилами.
      - title: Військо, озброєння та спорядження
        paragraphs:
          - У часи миру хребтом військової сили порту та колоній є народні ополчення, які поділяються на багато загонів і об'єднань — за належністю до міського кварталу, звідки походять, і за завданнями, які їм доручили володарі міста. На війні з більшості ополченців стають умбарські корсари.
          - Спорядження й озброєння лишається те саме, часто вони навіть однаково поділені на загони, але підпорядкуванням переходять під капітанів бойових кораблів. Спорядження й озброєння як ополчення, так і корсарів легке, пристосоване до швидких переходів і бою у відкритому морі. Вони шикуються у великі загони бійців зі списом або пікою, яких на крилах підтримують арбалетники. За бічну зброю їм служать гарадські шаблі або масивні тесаки з руків'ями, викуваними в подобі казкових морських потвор.
          - В одязі окремі загони ополчення можуть різнитися, але частини спорядження завжди однакові. Широкі штани, заправлені в чоботи, здебільшого червоні, сині або сірі. Спідня сорочка темної барви, поверх неї каптан до колін у барвах загону і темний непромокальний плащ без рукавів завдовжки як каптан. За головний убір служить шолом із твердої шкіри. Іншим елементом обладунку є вже тільки наручі. Каптан підперезаний щонайменше двома пасками — одним оздобним, на якому висить бічна зброя, і другим простим, ужитковим.
          - Командирами умбарських корсарів у час війни є або морські капітани, або відносно нещодавно постала група Мужів Короля. Це переважно члени одного з вище поставлених родів або капітани, а часом їхнє походження невідоме. З їхньою появою пов'язане оживлення культу Мелькора й прагнення повернутися до „традицій“ Чорного Нуменору. Вбранням і озброєнням Мужі Короля виразно відрізняються від решти умбарських сил, а також один від одного. Здається, що єдиним об'єднавчим елементом їхнього вигляду є хіба вживання довгих каптанів і спідниць, значно важчого обладунку, ніж заведено серед корсарів, і химерно вигнутих шкіряних шапок, стилізованих під казкових морських потвор. В озброєнні вони можуть мати будь-яку зброю, але явно віддають перевагу списам і пікам у поєднанні з бічними шаблями гарадського типу. Дехто вживає довгі мечі, і тих прозивають Глибинними ящерами.
          - У битву вони вступають із обличчям, закритим маскою, яка вселяє в супротивників жах. Вони не мають жодного єдиного командування і, здається, рівні між собою. Якусь форму підпорядкування створюють лише на потреби конкретної битви, і вона з кінцем боїв так само зникає. Коли Муж Короля падає в бою, його побратими намагаються відтягти його тіло, щоб воно не потрапило до рук ворога. Так вони підтримують свій культ непереможних воїнів.
          - Мужі Короля є також осердям культу Мелькора серед умбарських вояків. Поза боєм вони бувають похмурі, мовчазні й на людях ніколи не відкривають цілого обличчя, натомість затуляють його гарною маскою розмаїтого вигляду.
          - Ще однією виразно відмінною суспільною групою є Носії Правди. Постання цього угруповання в місті Умбар не датоване точно й почасти оповите таємницею та легендами. Правдою, однак, лишається те, що коли культ Мелькора знову почав ширитися серед люду Умбару, з'явилися чутки про загадкових воїнів із довгими мечами, які допомагали шанувальникам того культу. Спершу на вулицях і в шинках міста казали, що легше побачити казкового Глибинного ящера, ніж одного з тих воїнів, і саме тому їх зневажливо називали Глибинними ящерами. Одного дня, однак, Носії Правди вийшли на вулиці, а проповідники культу Мелькора почали серед еліти Умбару прилюдно справляти обряди в його ім'я. Того дня загадково зникла велика кількість містян, які найголосніше сумнівалися в Глибинних ящерах. Відтоді люд Умбару має Носіїв Правди у великому страху й пошані, хоча й не перестав звати їх Глибинними ящерами.
          - У бою ці воїни б'ються як члени Мужів Короля. У час миру вони допомагають жерцям Мелькора, де це потрібно. Для капітанів корсарських кораблів велика честь, коли їх у поході супроводжує один із Глибинних ящерів.
          - Натхнення для окремих частин ополчення та корсарів
      - title: Варта зовнішніх брам міста
        paragraphs:
          - Іноді їх називають також Дверниками. У вічі їм цього, звісно, ніхто ніколи не сказав би. Їх вербують із халуп зовнішнього міста Умбару, і до води їм з усіх умбарців найдалі. Командири від своїх людей не надто відрізняються, бо походять із їхніх лав; вирізняє їх тільки нагайка чи канчук за поясом, який служить відзнакою чину, а за потреби й корисним засобом на нових рекрутів вартових брам. У боях ці загони здебільшого на вістрі наступу або в самому осерді оборонної лінії. Їхня неохота відступати відома цілому місту. Бо кожен із вартових брам знає, що будь-що краще, ніж повертатися до халуп зовнішнього міста. У час миру, як уже й назва підказує, дозори Дверників стережуть зовнішні брами міста й перевіряють, що і кого хто намагається провести до внутрішнього міста. Їхня характерна барва — чорна.
      - title: Вартові гавані
        paragraphs:
          - Еліта умбарського ополчення. Це сини й дочки умбарських капітанів і власників кораблів, яким уже не дісталося капітанського місця у спадку. Їхнім командиром є Вартовий умбарського маяка, один із Мужів Короля. У бою вони вживають довгі гарпуни, і так само як їхня корогва оздоблена морським змієм, так і самі члени вартових гавані дуже тяжіють до цієї теми. Здебільшого вони б'ються поруч із Мужами Короля й дбають про безпеку обох крил цієї еліти Умбару. У час миру стережуть гавань і перевіряють, що котрий корабель привозить. Їхня барва — фіалкова.
      - title: Варта північно-східних сторожових веж
        paragraphs:
          - Проте ніхто їх під цим ім'ям не знає. Усі називають цей загін не інакше як Пошрамовані. Дехто твердить, що це тому, що той, хто хоче стати командиром Пошрамованих, мусить виграти бій у клітках північно-східного міста. Звідти ополчення й вербують. У боях це кровожерні воїни, які нападають із крил умбарського війська. Ще страшнішою є зустріч із Пошрамованими в морі, де єдиний порятунок — кинутися у хвилі. У часи миру Пошрамовані наглядають за бійцівськими ямами й стережуть мурові сторожові вежі на північному сході міста. Найлегше вояків упізнати за списами з довгим вістрям, з одного боку обладнаним пилкою, щоб зброя завдавала якнайболючішої рани. Командири ходять убрані суто в поєднаннях червоного.
