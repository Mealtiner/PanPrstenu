side: evil
i18n:
  cs:
    name: Umbar
    tagline: Korzáři Umbaru, černé plachty, sůl jižních moří a krev na čepeli.
    combat_style:
      - lehčí pěchota
      - šavle, dýky, krátké meče
      - boj jeden na jednoho i ve dvojicích
      - hbití nájezdníci
    recommended_for:
      - hráči, kteří mají rádi piráty, korzáry a námořní motivy
      - hráči se zájmem o roleplay nájezdníků a žoldnéřů Stínu
      - hráči, kteří mají rádi pestrý kostým bez plné zbroje
    not_recommended_for:
      - hráči, kteří chtějí jen masivní pěchotní bitvy
      - úplní nováčci bez kostýmového základu
    tags:
      - síla temného pána
      - moře a jih
      - střední kostýmová náročnost
      - korzáři a nájezdníci
    newbie_costume_hint: Vrstvená košile, šerpa, vesta s mosaznými knoflíky, šátek na hlavě. Šavle nebo dýka. Vyhraj se s detaily — náušnice, řetízky, opasek se sponou. Mořská modř i krvavá rudá.
    camp_hook: Tábor Umbaru voní solí, dehtem a vínem. Mapy s vyznačenými přístavy, kostky házené o cizí lodě, hrdé řeči o tom, komu vlajka padla pod čepel.
    costume_colors_text: 'fialová, šedá, černá; sekundárně červená, modrá, bílá, stříbrné zdobení'
    heraldry_text: 'Vlastní umbárské znaky; vhodné motivy korzárů, černých plachet, moře, lodí, kotev, šavlí a jižních přístavů.'
    ruler:
      name: Korzárský kapitán
      title: Pán černých plachet a slaného vína
      description: Námořník, lupič i diplomat. Nevěří přísahám, jen zlatu a vlastní čepeli — a Saurona si bere za partnera, dokud je to výhodné. Hráč Umbaru vidí kapitána u stolu s mapou, házet kostkami o cizí lodě a smát se příliš nahlas.
    lore_sections:
      - title: Stylizace kostýmu
        paragraphs:
          - "Kostým Umbarské vojáka je de facto ‚univerzálním‘ lidským kostýmem, s\_přihlédnutím k\_tomu, že Umbar je město ležící v\_teplém přímořském klimatu a na moři jeho válečníci stráví většinu života. Oděvy jsou tedy voleny z\_lehkých materiálů, kombinovaných s\_nepromokavými svrchními vrstvami. Podrobněji doporučujeme text níže."
      - title: Historie Umbaru
        paragraphs:
          - Umbar byl kdysi přístavem, kde poprvé přistáli Númenorejci, starý lidský rod, žijící na ostrově Númenor, než se z vůle Valar potopil. Nejslavnějším a posledním, mezi númenorejskými krály byl ArPharazon, který odpadl od víry ve Valar a v boji porazil samotného Saurona a odvlekl jej do zajetí.
          - V pozdějších dnech se stal Umbar sídlem Černých Númenorejců, kteří jsou přímými potomky lidu, který s Ar-Pharazonem opustil ostrov Númenor. Neuctívali již dále Valar, ale upadli k uctívání Morgotha, jim známého, jako Melkor, pána Prázdnoty, ze závisti vůči Prvorozeným, elfům, kteří byli narozdíl od nich nesmrtelní. Černí Númenorejci byli v následujících stoletích poraženi a vyhnáni lidem Gondoru, který Umbar několikrát obsadil, aby jej zase několikrát ztratil v bojích s Haradem, ležícím na jihovýchod. K Umbaru pod nadvládou Númenorejců a jejich pokračovatelů patřilo i několik provincií na jihu, na pobřeží Haradu. Říká se, že krev Černého Númenoru přežila mezi některými vládci Haradu a že Númenorejská kultura, narozdíl od Númenorejské krve, přežila zase mezi některými vznešenými rodinami Umbaru.
          - Současnými pány Umbaru jsou Umbarští korzáři. Míšený lid, z části Haradské, z části Gondorské a z malé části snad Númenorejské krve, kteří svoje služby prodávají pánům Haradu, nebo sledují vlastní cíle a plení pobřeží Středozemě.
          - Umbarští vládci pronajímají služby svých korzárů tomu, kdo lépe platí. V době Války o Prsten byli většinou ve službách Haradu, jako převozníci vojska, nebo přímo bojová síla. Lid Umbaru užírá vrozená nenávist ke Gondorskému království, jelikož jemu dávají za vinu mnoho příkoří a ponížení, jichž se mu dostalo v uplynulých letech. Umbarští opovrhují skřety pro jejich ošklivost, nedisciplinovanost a podlézavou podřízenost.
      - title: Náboženství, kultura a společnost
        paragraphs:
          - "Jako jejich první předkové, Númenorejci, lid Umbaru nevěří ve světlo Valar, ale obrátil se k uctívání Saurona. Mezi vzdělanějšími a vznešenějšími se udržuje krvavý kult Prázdnoty, uctívajícího nepřítele Valar, Melkora / Morgotha. Tento kult se opět objevil teprve nedávno, v čase, kdy se začali vyčleňovat první Královi muži, nicméně s\_pádem Saurona rychle nabírá na síle."
          - Původní Númenorejská kultura se až na drobné střípky, které ještě navíc byly překrouceny k nepoznání (uplynulo od té doby již několik tisíc let…), v Umbaru nezachovala. Umbarská kultura je tak směsicí Haradské, Gondorské a jiných kultur. Dominantním prvkem je snaha reprezentovat co nejlépe sebe a svoji rodinu. Lid Umbaru je hrdý a pokud mohou, nosí jeho lidé drahé oděvy a šperky, často zdobné motivy mořských živočichů a bájných příšer. K ostatním lidem se chovají povýšeně, natož pak ke skřetům a jiným nižším bytostem. Nejváženější jsou vládci urozených rodů a potom kapitáni lodí. Každý kapitán je neomezeným pánem na své lodi a jeho slovo je zákon.
          - Neexistuje nic, jako jednotná Umbarská móda, nebo univerzální kód společenského chování. Každá městská čtvrť žije svébytnou módou a kulturou a každý rod a každý kapitán může diktovat právo podle svojí vlastní vůle. Zachovalo se ale několik zvyků ze starých dob, jejichž význam zná již jen málokdo. Při společenských příležitostech ve slušné společnosti je tak například vrcholem nevychovanosti vystavovat nezakrytou tvář. Umbarská smetánka tak nosí propracované masky roztodivných vzorů a z rozličných materiálů, které jsou pro náhodné návštěvníky města vždy předmětem údivu. Z podobně neznámých důvodů někteří bojovníci chodí do boje s tváří zakrytou maskami, které naopak vzbuzují spíše odpor a hrůzu. Původní význam obou zvyků se již dávno ztratil v tisíciletích míšení kultur a neutuchajících bojů o tento přístav.
          - Dalším zvykem je svatost osobního souboje mezi Umbarskými měšťany i šlechtou. Každý Umbarský má právo vyzvat na souboj kteréhokoli jiného a do jejich duelu nesmí nikdo jiný zasáhnout. Nezřídka se to stává i na bitevním poli, kdy kapitáni vyzývají na souboj velitele nepřátelských jednotek. Ani do takového souboje nikdo z Umbařanů nezasáhne a nepřátelská síla tak již několikrát byla odvedena do otroctví, aniž by došlo k větším ztrátám na životech. Mezi kapitány platí podobný zvyk. Nevyřízené účty a vzájemné neshody řeší kapitáni lodí soubojem na biče, dokud jeden z nich neztratí vědomí, nebo ze souboje neodstoupí.
          - Umbarské výsostné znaky se používají pouze v časech míru a ve válce používány nejsou. Na drancovací výpravě a ve válce jednotlivé lodě, flotily a kapitáni volí symbol podle vlastních preferencí. Můžeme tak narazit na motivy různých ryb, žraloků, chobotnic, mořských ježků, lastur a ulit. Některé můžou působit až bizarně, jako například loď, nesoucí označení „Plamenný hlemýžď“. Jedinými dvěma symboly, které se táhnou skrz celou armádu, jsou Mořský had a dříve Oko bez víčka v různých kombinacích. Královi muži s oblibou do heraldiky přidávají ještě Númenorejskou korunu, případně Morgothovu korunu ozdobenou Silmarilly.
      - title: Armáda, výzbroj a výstroj
        paragraphs:
          - V časech míru jsou páteří vojenské síly přístavu a kolonií lidové milice, které se dělí do mnoha jednotek a uskupení, podle příslušnosti k městské čtvrti, odkud pocházejí a podle úkolů, které jim svěřili vládci města. Ve válce se z většiny milicionářů stávají Umbarští korzáři.
          - Výstroj i výzbroj zůstává stejná, často jsou dokonce i stejně děleni do jednotek, ale podřízeností přecházejí pod kapitány válečných korábů. Výstroj a výzbroj milice i korzárů je lehká, uzpůsobená rychlým přesunům a boji na otevřeném moři. Řadí se do velkých jednotek bojovníků s kopím, nebo píkou, které jsou na křídlech podporovány střelci z kuší. Jako poboční zbraně jim slouží haradské šavle, nebo masivní tesáky s jílci tvarovanými do podoby bájných mořských oblud.
          - V oblékání se jednotlivé jednotky milice můžou různit, ale části výstroje jsou vždycky shodné. Široké kalhoty, zastrčené do bot, většinou červené, modré nebo šedé barvy. Spodní košile tmavé barvy, přes kterou je kaftan po kolena v barvách jednotky a tmavý nepromokavý kabát bez rukávů v délce kaftanu. Jako pokrývka hlavy slouží helmice z tvrdé kůže. Dalším prvkem zbroje jsou pak už jen nátepníky. Kaftan je přepásán minimálně dvěma pásky, jedním zdobeným, na kterém je zavěšená poboční zbraň a druhým prostým, užitkovým.
          - Veliteli Umbarských korzárů jsou v čase války buďto námořní kapitáni, nebo relativně nedávno vzniklá skupina Králových mužů. Jsou to povětšinou členové jednoho z výše postavených rodů, nebo kapitáni, či jejich původ není známý. S jejich vznikem se pojí oživení kultu Melkora a snaha o návrat k „tradicím“ Černého Númenoru. Oděním a výzbrojí se Královi muži výrazně odlišují od zbytku Umbarských sil a i jeden od druhého. Zdá se, že sjednocujícím prvkem v jejich vzezření je pouze používání dlouhých kabátců a suknic, výrazně těžší zbroje, než je mezi korzáry typické a bizarně tvarovaných kožených čapek, stylizovaných do podoby bájných mořských oblud. Ve výzbroji mohou mít jakoukoli zbraň, ale zjevně preferují kopí a píky v kombinaci s pobočními šavlemi haradského typu. Někteří používají dlouhé meče a těm se přezdívá Hlubinní ještěři.
          - Do bitvy nastupují s tváří krytou maskou, která v protivnících vzbuzuje hrůzu. Nemají žádné jednotné velení a zdá se, že si jsou mezi sebou rovni. Nějakou formu subordinace si vytvářejí jen pro potřeby konkrétní bitvy a ta s koncem bojů zaniká také. Když Králův muž v boji padne, jeho druhové se snaží jeho tělo odtáhnout, aby nepadlo do rukou nepřítele. Udržují si tím kult neporazitelných bojovníků.
          - Královi muži jsou také středobodem kultu Melkora mezi Umbarskými vojáky. Bývají mimo boj zachmuření, tiší a na vřejnosti nikdy neodhalují celou tvář, místo toho obličej halí krásnou maskou rozličného vzezření.
          - Další výrazně odlišnou společenskou skupinou jsou Nositelé Pravdy. Vznik tohoto uskupení v městě Umbaru není přesně datován a je částečně zahalen tajemstvím a legendami. Pravdou však zůstává, že jak se opětovně začal šířit kult Melkora mezi lidem Umbaru, začaly se objevovat zvěsti o záhadných válečnících s dlouhými meči, napomáhajících uctívačům toho kultu. Z počátku znělo v ulicích a putykách města, že je snazší spatřit bájného Hlubinného ještěra, než jednoho z oněch válečníků a byli právě proto hanlivě označováni Hlubinnými Ještěry. Jednoho dne však Nositelé Pravdy vyšli do ulic a kazatelé Melkorova kultu začali mezi elitou Umbaru veřejně provádět rituály v jeho jménu. Toho dne záhadně zmizelo velké množství občanů města, kteří nejhlasitěji pochybovali o Hlubinných Ještěrech. Od toho dne lid Umbaru chová Nositele Pravdy ve velké bázni a úctě, ač je nepřestal nazývat Hlubinnými Ještěry.
          - V boji tito válečníci bojují jako členové Králových mužů. V čase míru pomáhají Melkorovým kněžím, kde je třeba. Pro kapitány korzárských lodí je velkou ctí, když je na jejich výpra ě doprovází jeden z Hlubinných Ještěrů.
          - Inspirace pro jednotlivé části milice a korzáry
      - title: Stráže vnějších bran města
        paragraphs:
          - Někdy také označováni, jako Dveřníci. Do očí by jim to samozřejmě nikdy nikdo neřekl. Jsou verbování z chatrčí vnějšího města Umbaru a k vodě mají ze všech umbarských nejdál. Velitelé se od svých mužů příliš neliší, protože pocházejí z jejich řad, vyznačují se pouze důtkami, nebo karabáčem za pasem, který slouží jako odznak hodnosti a případně jako užitečná pomůcka na nové odvedence strážců bran. V bojích jsou tyto jednotky většinou na špici útoku, nebo v samém centru obranné linie. Jejich neochota ustupovat je v celém městě známá. Každý ze strážců bran totiž ví, že cokoliv je lepší jak se vrátit do chatrčí vnějšího města. V čase míru, jak už název napovídá, hlídají patroly Dveřníků vnější brány mešta a kontrolují, co a koho se kdo snaží převést do vnitřního města. Jejich typickou barvou je černá.
      - title: Strážci přístavu
        paragraphs:
          - Elita umbarské milice. Jsou to synové a dcery umbarských kapitánů a vlastníků lodí, na které se již nedostalo při dědictví kapitánského postu. Jejich velitelem je Strážce umbarského majáku, jeden z Králových mužů. V boji používají dlouhé harpuny a stejně jako jejich zástava je zdobena mořským hadem, tak samotní členové strážců přístavu k této tématice velmi tíhnou. Většinou bojují po boku Králových mužů a starají se o bezpečí obou křídel této elity Umbaru. V čase míru stráží přistav a kontrolují, co jaká loď přiváží. Jejich barvou je fialová.
      - title: Stráž severovýchodních hlásek
        paragraphs:
          - Nikdo je však pod tímto jménem nezná. Všichni této jednotce neřeknou jinak než Zjizvení. Někdo tvrdí, že je to proto, že kdo se chce stát velitelem Zjizvených, musí vyhrát zápas v klecích severovýchodního města. Odtud je také milice verbována. V bojích jde o krvežíznivé válečníky, kteří útočí z křídel Umbarské armády. Ještě děsivější je setkáním se Zjizvenými na moři, kde jediná spása je vrhnout se do vln. V časech míru dohlíží Zjizvení nad zápasnickými jámami a střeží hradební hlásky severovýchodu města. Nejsnadněji se vojáci poznají podle kopí s dlouhým hrotem z jedné strany opatřeným pilkou, aby zbraň působila co nejbolestivější zranění. Velitelé chodí oděni čistě v kombinacích červené.
  en:
    name: Umbar
    tagline: Corsairs of Umbar — black sails, salt of southern seas, and blood on the blade.
    combat_style:
      - lighter infantry
      - sabres, daggers, short swords
      - fighting one on one and in pairs
      - nimble raiders
    recommended_for:
      - players who like pirates, corsairs and seafaring themes
      - players interested in the roleplay of raiders and mercenaries of the Shadow
      - players who like a colourful costume without full armour
    not_recommended_for:
      - players who want nothing but massed infantry battles
      - complete newcomers with no costume basics
    tags:
      - force of the Dark Lord
      - sea and south
      - medium costume demands
      - corsairs and raiders
    newbie_costume_hint: A layered shirt, a sash, a waistcoat with brass buttons, a scarf on the head. A sabre or a dagger. Have fun with the details — earrings, chains, a belt with a buckle. Sea blue and blood red.
    camp_hook: The camp of Umbar smells of salt, tar and wine. Charts with the havens marked out, dice thrown for other men's ships, proud talk of whose flag fell beneath the blade.
    costume_colors_text: purple, grey, black; secondarily red, blue, white, silver ornament
    heraldry_text: The arms of Umbar itself; fitting motifs are corsairs, black sails, the sea, ships, anchors, sabres and the southern havens.
    ruler:
      name: Corsair Captain
      title: Lord of black sails and salt wine
      description: Sailor, robber and diplomat alike. He trusts no oath, only gold and his own blade — and he takes Sauron for a partner just as long as it pays. A player of Umbar sees the captain at the table with a chart, throwing dice for other men's ships and laughing far too loudly.
    lore_sections:
      - title: Costume styling
        paragraphs:
          - The costume of a soldier of Umbar is in effect a ‘universal' human costume, taking into account that Umbar is a city lying in a warm coastal climate and that its warriors spend most of their lives at sea. Garments are therefore chosen from light materials, combined with waterproof outer layers. For more detail we recommend the text below.
      - title: The history of Umbar
        paragraphs:
          - Umbar was once the haven where the Númenóreans first landed, an ancient race of Men who dwelt on the island of Númenor before it sank by the will of the Valar. The most renowned and the last among the Númenórean kings was Ar-Pharazôn, who fell away from faith in the Valar and who defeated Sauron himself in battle and carried him off into captivity.
          - In later days Umbar became the seat of the Black Númenóreans, who are the direct descendants of the people that left the island of Númenor with Ar-Pharazôn. They no longer revered the Valar but fell to the worship of Morgoth, known to them as Melkor, lord of the Void, out of envy of the Firstborn, the Elves, who unlike themselves were immortal. In the following centuries the Black Númenóreans were defeated and driven out by the people of Gondor, which occupied Umbar several times only to lose it again several times over in the wars with Harad, lying to the south-east. Under the dominion of the Númenóreans and their successors, Umbar also held several provinces in the south, on the coast of Harad. It is said that the blood of Black Númenor survived among certain rulers of Harad, and that Númenórean culture, unlike Númenórean blood, survived in turn among certain noble families of Umbar.
          - The present lords of Umbar are the Corsairs of Umbar. A mingled people, in part of Haradrim, in part of Gondorian and in small part perhaps of Númenórean blood, who sell their services to the lords of Harad, or else pursue their own ends and plunder the coasts of Middle-earth.
          - The rulers of Umbar hire out the services of their corsairs to whoever pays better. In the time of the War of the Ring they were mostly in the service of Harad, as ferriers of armies or as a fighting force outright. The people of Umbar are gnawed by an inborn hatred of the kingdom of Gondor, for they lay at its door many of the wrongs and humiliations they have suffered in years past. The men of Umbar despise the Orcs for their ugliness, their lack of discipline and their fawning servility.
      - title: Religion, culture and society
        paragraphs:
          - Like their first forefathers, the Númenóreans, the people of Umbar do not believe in the light of the Valar but have turned to the worship of Sauron. Among the more learned and the more highborn there persists a bloody cult of the Void, revering the enemy of the Valar, Melkor / Morgoth. This cult reappeared only recently, at the time when the first King's Men began to set themselves apart, yet with the fall of Sauron it is swiftly gathering strength.
          - The original Númenórean culture has not been preserved in Umbar, save for small fragments which have moreover been twisted beyond recognition (several thousand years have passed since then…). The culture of Umbar is thus a mixture of Haradrim, Gondorian and other cultures. Its dominant element is the effort to represent oneself and one's family as well as possible. The people of Umbar are proud, and where they can, they wear costly garments and jewellery, often with ornamental motifs of sea creatures and fabled monsters. Towards other Men they behave haughtily, let alone towards Orcs and other lesser beings. The most respected are the rulers of the noble houses, and after them the captains of ships. Every captain is the unlimited master of his own ship and his word is law.
          - There is no such thing as a single fashion of Umbar, nor a universal code of social conduct. Every city quarter lives by a fashion and a culture of its own, and every house and every captain may dictate the law according to their own will. Yet several customs from the old days have survived, whose meaning few now know. At social occasions in polite company, for instance, it is the height of ill breeding to display an uncovered face. The cream of Umbarian society therefore wears elaborate masks of the most peculiar patterns and of various materials, which are always a source of astonishment to chance visitors to the city. For similarly unknown reasons some warriors go into battle with their faces covered by masks which, by contrast, arouse revulsion and dread. The original meaning of both customs was long ago lost in the millennia of mingling cultures and unceasing struggles over this haven.
          - Another custom is the sanctity of the personal duel among the burghers and the nobility of Umbar alike. Every man of Umbar has the right to challenge any other, and no one else may intervene in their duel. Not seldom this happens even on the field of battle, when captains challenge the commanders of enemy units. Into such a duel, too, no man of Umbar will intervene, and more than once an enemy force has thus been led away into slavery without any great loss of life. A similar custom holds among the captains. Ships' captains settle unpaid scores and mutual disagreements with a duel of whips, until one of them loses consciousness or withdraws from the fight.
          - The sovereign arms of Umbar are used only in times of peace and are not used in war. On a plundering expedition and in war, individual ships, fleets and captains choose a symbol according to their own preference. We may thus come across motifs of various fish, sharks, octopuses, sea urchins, shells and conches. Some can seem downright bizarre, such as the ship bearing the name “The Flaming Snail”. The only two symbols that run through the whole army are the Sea-serpent and, formerly, the Lidless Eye in various combinations. The King's Men are fond of adding the Númenórean crown to the heraldry as well, or else Morgoth's crown adorned with the Silmarils.
      - title: The army, arms and equipment
        paragraphs:
          - In times of peace the backbone of the military strength of the haven and its colonies are the popular militias, which are divided into many units and formations according to the city quarter they come from and the tasks entrusted to them by the rulers of the city. In war most of the militiamen become Corsairs of Umbar.
          - Their equipment and arms remain the same, and they are often even divided into the same units, but in subordination they pass under the captains of the warships. The equipment and arms of the militia and of the corsairs alike are light, suited to swift movement and to fighting on the open sea. They form up in large units of fighters with spear or pike, supported on the wings by crossbowmen. Haradrim sabres serve them as side-arms, or massive falchions with hilts shaped in the likeness of fabled sea monsters.
          - In their dress the individual units of the militia may differ, but parts of the equipment are always the same. Wide trousers tucked into boots, mostly red, blue or grey. A dark undershirt, over which goes a knee-length caftan in the colours of the unit, and a dark waterproof sleeveless coat of the same length as the caftan. A helmet of hardened leather serves as headgear. The only further element of armour is a pair of vambraces. The caftan is girded with at least two belts, one ornamented, from which the side-arm hangs, and the other plain and utilitarian.
          - The commanders of the Corsairs of Umbar in time of war are either sea captains or the relatively recently formed group of the King's Men. They are for the most part members of one of the higher-standing houses, or captains, or else their origin is not known. Bound up with their emergence is the revival of the cult of Melkor and the effort to return to the “traditions” of Black Númenor. In dress and arms the King's Men differ markedly from the rest of the forces of Umbar, and from one another as well. It seems that the only unifying element in their appearance is the use of long jackets and skirted coats, of armour considerably heavier than is usual among the corsairs, and of bizarrely shaped leather caps styled in the likeness of fabled sea monsters. As for arms they may carry any weapon, but they clearly prefer spears and pikes combined with side-sabres of the Haradrim type. Some use long swords, and these are nicknamed the Deep Lizards.
          - They enter battle with their faces covered by a mask that inspires dread in their opponents. They have no unified command and appear to be equals among themselves. They create some form of subordination only for the needs of a particular battle, and it too ceases with the end of the fighting. When a King's Man falls in battle, his companions try to drag his body away so that it does not fall into the hands of the enemy. In this way they maintain their cult of invincible warriors.
          - The King's Men are also the focal point of the cult of Melkor among the soldiers of Umbar. Outside battle they tend to be sombre and silent, and in public they never uncover the whole face, veiling it instead with a beautiful mask of varying appearance.
          - Another markedly distinct social group are the Bearers of the Truth. The rise of this fellowship in the city of Umbar is not precisely dated and is partly shrouded in mystery and legend. It remains true, however, that as the cult of Melkor began once again to spread among the people of Umbar, rumours began to appear of mysterious warriors with long swords who aided the worshippers of that cult. At first it was said in the streets and taverns of the city that it was easier to catch sight of a fabled deep lizard than one of those warriors, and for that very reason they were derisively called the Deep Lizards. One day, however, the Bearers of the Truth came out into the streets, and the preachers of Melkor's cult began to perform rituals in his name openly among the elite of Umbar. On that day a great number of the city's citizens who had most loudly doubted the Deep Lizards mysteriously vanished. From that day the people of Umbar hold the Bearers of the Truth in great awe and reverence, though they have not stopped calling them the Deep Lizards.
          - In battle these warriors fight as members of the King's Men. In time of peace they help the priests of Melkor wherever it is needed. For the captains of corsair ships it is a great honour when one of the Deep Lizards accompanies them on their voyage.
          - Inspiration for the individual parts of the militia and for the corsairs
      - title: Guards of the outer gates of the city
        paragraphs:
          - Sometimes also called the Doorkeepers. To their faces, of course, no one would ever say it. They are recruited from the shacks of the outer city of Umbar, and of all the men of Umbar they are the farthest removed from the water. The commanders do not differ much from their men, since they come from their ranks; they are distinguished only by a scourge or a whip at the belt, which serves as a badge of rank and on occasion as a useful aid with new recruits to the gate guards. In battle these units are mostly at the spearhead of the attack, or in the very centre of the defensive line. Their unwillingness to retreat is known throughout the city. For every one of the gate guards knows that anything is better than going back to the shacks of the outer city. In time of peace, as the name suggests, patrols of the Doorkeepers watch the outer gates of the city and check what and whom anyone is trying to bring through into the inner city. Their characteristic colour is black.
      - title: Wardens of the haven
        paragraphs:
          - The elite of the militia of Umbar. They are the sons and daughters of the captains and shipowners of Umbar who were passed over for a captain's post in the inheritance. Their commander is the Warden of the Lighthouse of Umbar, one of the King's Men. In battle they use long harpoons, and just as their standard is adorned with a sea-serpent, so the members of the wardens of the haven themselves are strongly drawn to that theme. They mostly fight alongside the King's Men and see to the safety of both wings of this elite of Umbar. In time of peace they guard the haven and check what each ship brings in. Their colour is purple.
      - title: Watch of the north-eastern lookout towers
        paragraphs:
          - No one, however, knows them by that name. Everyone calls this unit nothing but the Scarred. Some claim it is because anyone who wishes to become commander of the Scarred must win a bout in the cages of the north-eastern city. That is also where the militia is recruited. In battle they are bloodthirsty warriors who attack from the wings of the army of Umbar. More terrible still is an encounter with the Scarred at sea, where the only salvation is to throw oneself into the waves. In times of peace the Scarred oversee the fighting pits and guard the wall towers of the north-east of the city. The soldiers are most easily recognised by their spears with a long head fitted with a saw edge on one side, so that the weapon inflicts the most painful wound possible. Their commanders go clad purely in combinations of red.
  de:
    name: Umbar
    tagline: Korsaren von Umbar — schwarze Segel, Salz südlicher Meere und Blut auf der Klinge.
    combat_style:
      - lehčí pěchota
      - šavle, dýky, krátké meče
      - boj jeden na jednoho i ve dvojicích
      - hbití nájezdníci
    recommended_for:
      - hráči, kteří mají rádi piráty, korzáry a námořní motivy
      - hráči se zájmem o roleplay nájezdníků a žoldnéřů Stínu
      - hráči, kteří mají rádi pestrý kostým bez plné zbroje
    not_recommended_for:
      - hráči, kteří chtějí jen masivní pěchotní bitvy
      - úplní nováčci bez kostýmového základu
    tags:
      - síla temného pána
      - moře a jih
      - střední kostýmová náročnost
      - korzáři a nájezdníci
    newbie_costume_hint: Vrstvená košile, šerpa, vesta s mosaznými knoflíky, šátek na hlavě. Šavle nebo dýka. Vyhraj se s detaily — náušnice, řetízky, opasek se sponou. Mořská modř i krvavá rudá.
    camp_hook: Tábor Umbaru voní solí, dehtem a vínem. Mapy s vyznačenými přístavy, kostky házené o cizí lodě, hrdé řeči o tom, komu vlajka padla pod čepel.
    costume_colors_text: 'fialová, šedá, černá; sekundárně červená, modrá, bílá, stříbrné zdobení'
    heraldry_text: 'Vlastní umbárské znaky; vhodné motivy korzárů, černých plachet, moře, lodí, kotev, šavlí a jižních přístavů.'
    ruler:
      name: Korzárský kapitán
      title: Pán černých plachet a slaného vína
      description: Námořník, lupič i diplomat. Nevěří přísahám, jen zlatu a vlastní čepeli — a Saurona si bere za partnera, dokud je to výhodné. Hráč Umbaru vidí kapitána u stolu s mapou, házet kostkami o cizí lodě a smát se příliš nahlas.
    lore_sections:
      - title: Stylizace kostýmu
        paragraphs:
          - "Kostým Umbarské vojáka je de facto ‚univerzálním‘ lidským kostýmem, s\_přihlédnutím k\_tomu, že Umbar je město ležící v\_teplém přímořském klimatu a na moři jeho válečníci stráví většinu života. Oděvy jsou tedy voleny z\_lehkých materiálů, kombinovaných s\_nepromokavými svrchními vrstvami. Podrobněji doporučujeme text níže."
      - title: Historie Umbaru
        paragraphs:
          - Umbar byl kdysi přístavem, kde poprvé přistáli Númenorejci, starý lidský rod, žijící na ostrově Númenor, než se z vůle Valar potopil. Nejslavnějším a posledním, mezi númenorejskými krály byl ArPharazon, který odpadl od víry ve Valar a v boji porazil samotného Saurona a odvlekl jej do zajetí.
          - V pozdějších dnech se stal Umbar sídlem Černých Númenorejců, kteří jsou přímými potomky lidu, který s Ar-Pharazonem opustil ostrov Númenor. Neuctívali již dále Valar, ale upadli k uctívání Morgotha, jim známého, jako Melkor, pána Prázdnoty, ze závisti vůči Prvorozeným, elfům, kteří byli narozdíl od nich nesmrtelní. Černí Númenorejci byli v následujících stoletích poraženi a vyhnáni lidem Gondoru, který Umbar několikrát obsadil, aby jej zase několikrát ztratil v bojích s Haradem, ležícím na jihovýchod. K Umbaru pod nadvládou Númenorejců a jejich pokračovatelů patřilo i několik provincií na jihu, na pobřeží Haradu. Říká se, že krev Černého Númenoru přežila mezi některými vládci Haradu a že Númenorejská kultura, narozdíl od Númenorejské krve, přežila zase mezi některými vznešenými rodinami Umbaru.
          - Současnými pány Umbaru jsou Umbarští korzáři. Míšený lid, z části Haradské, z části Gondorské a z malé části snad Númenorejské krve, kteří svoje služby prodávají pánům Haradu, nebo sledují vlastní cíle a plení pobřeží Středozemě.
          - Umbarští vládci pronajímají služby svých korzárů tomu, kdo lépe platí. V době Války o Prsten byli většinou ve službách Haradu, jako převozníci vojska, nebo přímo bojová síla. Lid Umbaru užírá vrozená nenávist ke Gondorskému království, jelikož jemu dávají za vinu mnoho příkoří a ponížení, jichž se mu dostalo v uplynulých letech. Umbarští opovrhují skřety pro jejich ošklivost, nedisciplinovanost a podlézavou podřízenost.
      - title: Náboženství, kultura a společnost
        paragraphs:
          - "Jako jejich první předkové, Númenorejci, lid Umbaru nevěří ve světlo Valar, ale obrátil se k uctívání Saurona. Mezi vzdělanějšími a vznešenějšími se udržuje krvavý kult Prázdnoty, uctívajícího nepřítele Valar, Melkora / Morgotha. Tento kult se opět objevil teprve nedávno, v čase, kdy se začali vyčleňovat první Královi muži, nicméně s\_pádem Saurona rychle nabírá na síle."
          - Původní Númenorejská kultura se až na drobné střípky, které ještě navíc byly překrouceny k nepoznání (uplynulo od té doby již několik tisíc let…), v Umbaru nezachovala. Umbarská kultura je tak směsicí Haradské, Gondorské a jiných kultur. Dominantním prvkem je snaha reprezentovat co nejlépe sebe a svoji rodinu. Lid Umbaru je hrdý a pokud mohou, nosí jeho lidé drahé oděvy a šperky, často zdobné motivy mořských živočichů a bájných příšer. K ostatním lidem se chovají povýšeně, natož pak ke skřetům a jiným nižším bytostem. Nejváženější jsou vládci urozených rodů a potom kapitáni lodí. Každý kapitán je neomezeným pánem na své lodi a jeho slovo je zákon.
          - Neexistuje nic, jako jednotná Umbarská móda, nebo univerzální kód společenského chování. Každá městská čtvrť žije svébytnou módou a kulturou a každý rod a každý kapitán může diktovat právo podle svojí vlastní vůle. Zachovalo se ale několik zvyků ze starých dob, jejichž význam zná již jen málokdo. Při společenských příležitostech ve slušné společnosti je tak například vrcholem nevychovanosti vystavovat nezakrytou tvář. Umbarská smetánka tak nosí propracované masky roztodivných vzorů a z rozličných materiálů, které jsou pro náhodné návštěvníky města vždy předmětem údivu. Z podobně neznámých důvodů někteří bojovníci chodí do boje s tváří zakrytou maskami, které naopak vzbuzují spíše odpor a hrůzu. Původní význam obou zvyků se již dávno ztratil v tisíciletích míšení kultur a neutuchajících bojů o tento přístav.
          - Dalším zvykem je svatost osobního souboje mezi Umbarskými měšťany i šlechtou. Každý Umbarský má právo vyzvat na souboj kteréhokoli jiného a do jejich duelu nesmí nikdo jiný zasáhnout. Nezřídka se to stává i na bitevním poli, kdy kapitáni vyzývají na souboj velitele nepřátelských jednotek. Ani do takového souboje nikdo z Umbařanů nezasáhne a nepřátelská síla tak již několikrát byla odvedena do otroctví, aniž by došlo k větším ztrátám na životech. Mezi kapitány platí podobný zvyk. Nevyřízené účty a vzájemné neshody řeší kapitáni lodí soubojem na biče, dokud jeden z nich neztratí vědomí, nebo ze souboje neodstoupí.
          - Umbarské výsostné znaky se používají pouze v časech míru a ve válce používány nejsou. Na drancovací výpravě a ve válce jednotlivé lodě, flotily a kapitáni volí symbol podle vlastních preferencí. Můžeme tak narazit na motivy různých ryb, žraloků, chobotnic, mořských ježků, lastur a ulit. Některé můžou působit až bizarně, jako například loď, nesoucí označení „Plamenný hlemýžď“. Jedinými dvěma symboly, které se táhnou skrz celou armádu, jsou Mořský had a dříve Oko bez víčka v různých kombinacích. Královi muži s oblibou do heraldiky přidávají ještě Númenorejskou korunu, případně Morgothovu korunu ozdobenou Silmarilly.
      - title: Armáda, výzbroj a výstroj
        paragraphs:
          - V časech míru jsou páteří vojenské síly přístavu a kolonií lidové milice, které se dělí do mnoha jednotek a uskupení, podle příslušnosti k městské čtvrti, odkud pocházejí a podle úkolů, které jim svěřili vládci města. Ve válce se z většiny milicionářů stávají Umbarští korzáři.
          - Výstroj i výzbroj zůstává stejná, často jsou dokonce i stejně děleni do jednotek, ale podřízeností přecházejí pod kapitány válečných korábů. Výstroj a výzbroj milice i korzárů je lehká, uzpůsobená rychlým přesunům a boji na otevřeném moři. Řadí se do velkých jednotek bojovníků s kopím, nebo píkou, které jsou na křídlech podporovány střelci z kuší. Jako poboční zbraně jim slouží haradské šavle, nebo masivní tesáky s jílci tvarovanými do podoby bájných mořských oblud.
          - V oblékání se jednotlivé jednotky milice můžou různit, ale části výstroje jsou vždycky shodné. Široké kalhoty, zastrčené do bot, většinou červené, modré nebo šedé barvy. Spodní košile tmavé barvy, přes kterou je kaftan po kolena v barvách jednotky a tmavý nepromokavý kabát bez rukávů v délce kaftanu. Jako pokrývka hlavy slouží helmice z tvrdé kůže. Dalším prvkem zbroje jsou pak už jen nátepníky. Kaftan je přepásán minimálně dvěma pásky, jedním zdobeným, na kterém je zavěšená poboční zbraň a druhým prostým, užitkovým.
          - Veliteli Umbarských korzárů jsou v čase války buďto námořní kapitáni, nebo relativně nedávno vzniklá skupina Králových mužů. Jsou to povětšinou členové jednoho z výše postavených rodů, nebo kapitáni, či jejich původ není známý. S jejich vznikem se pojí oživení kultu Melkora a snaha o návrat k „tradicím“ Černého Númenoru. Oděním a výzbrojí se Královi muži výrazně odlišují od zbytku Umbarských sil a i jeden od druhého. Zdá se, že sjednocujícím prvkem v jejich vzezření je pouze používání dlouhých kabátců a suknic, výrazně těžší zbroje, než je mezi korzáry typické a bizarně tvarovaných kožených čapek, stylizovaných do podoby bájných mořských oblud. Ve výzbroji mohou mít jakoukoli zbraň, ale zjevně preferují kopí a píky v kombinaci s pobočními šavlemi haradského typu. Někteří používají dlouhé meče a těm se přezdívá Hlubinní ještěři.
          - Do bitvy nastupují s tváří krytou maskou, která v protivnících vzbuzuje hrůzu. Nemají žádné jednotné velení a zdá se, že si jsou mezi sebou rovni. Nějakou formu subordinace si vytvářejí jen pro potřeby konkrétní bitvy a ta s koncem bojů zaniká také. Když Králův muž v boji padne, jeho druhové se snaží jeho tělo odtáhnout, aby nepadlo do rukou nepřítele. Udržují si tím kult neporazitelných bojovníků.
          - Královi muži jsou také středobodem kultu Melkora mezi Umbarskými vojáky. Bývají mimo boj zachmuření, tiší a na vřejnosti nikdy neodhalují celou tvář, místo toho obličej halí krásnou maskou rozličného vzezření.
          - Další výrazně odlišnou společenskou skupinou jsou Nositelé Pravdy. Vznik tohoto uskupení v městě Umbaru není přesně datován a je částečně zahalen tajemstvím a legendami. Pravdou však zůstává, že jak se opětovně začal šířit kult Melkora mezi lidem Umbaru, začaly se objevovat zvěsti o záhadných válečnících s dlouhými meči, napomáhajících uctívačům toho kultu. Z počátku znělo v ulicích a putykách města, že je snazší spatřit bájného Hlubinného ještěra, než jednoho z oněch válečníků a byli právě proto hanlivě označováni Hlubinnými Ještěry. Jednoho dne však Nositelé Pravdy vyšli do ulic a kazatelé Melkorova kultu začali mezi elitou Umbaru veřejně provádět rituály v jeho jménu. Toho dne záhadně zmizelo velké množství občanů města, kteří nejhlasitěji pochybovali o Hlubinných Ještěrech. Od toho dne lid Umbaru chová Nositele Pravdy ve velké bázni a úctě, ač je nepřestal nazývat Hlubinnými Ještěry.
          - V boji tito válečníci bojují jako členové Králových mužů. V čase míru pomáhají Melkorovým kněžím, kde je třeba. Pro kapitány korzárských lodí je velkou ctí, když je na jejich výpra ě doprovází jeden z Hlubinných Ještěrů.
          - Inspirace pro jednotlivé části milice a korzáry
      - title: Stráže vnějších bran města
        paragraphs:
          - Někdy také označováni, jako Dveřníci. Do očí by jim to samozřejmě nikdy nikdo neřekl. Jsou verbování z chatrčí vnějšího města Umbaru a k vodě mají ze všech umbarských nejdál. Velitelé se od svých mužů příliš neliší, protože pocházejí z jejich řad, vyznačují se pouze důtkami, nebo karabáčem za pasem, který slouží jako odznak hodnosti a případně jako užitečná pomůcka na nové odvedence strážců bran. V bojích jsou tyto jednotky většinou na špici útoku, nebo v samém centru obranné linie. Jejich neochota ustupovat je v celém městě známá. Každý ze strážců bran totiž ví, že cokoliv je lepší jak se vrátit do chatrčí vnějšího města. V čase míru, jak už název napovídá, hlídají patroly Dveřníků vnější brány mešta a kontrolují, co a koho se kdo snaží převést do vnitřního města. Jejich typickou barvou je černá.
      - title: Strážci přístavu
        paragraphs:
          - Elita umbarské milice. Jsou to synové a dcery umbarských kapitánů a vlastníků lodí, na které se již nedostalo při dědictví kapitánského postu. Jejich velitelem je Strážce umbarského majáku, jeden z Králových mužů. V boji používají dlouhé harpuny a stejně jako jejich zástava je zdobena mořským hadem, tak samotní členové strážců přístavu k této tématice velmi tíhnou. Většinou bojují po boku Králových mužů a starají se o bezpečí obou křídel této elity Umbaru. V čase míru stráží přistav a kontrolují, co jaká loď přiváží. Jejich barvou je fialová.
      - title: Stráž severovýchodních hlásek
        paragraphs:
          - Nikdo je však pod tímto jménem nezná. Všichni této jednotce neřeknou jinak než Zjizvení. Někdo tvrdí, že je to proto, že kdo se chce stát velitelem Zjizvených, musí vyhrát zápas v klecích severovýchodního města. Odtud je také milice verbována. V bojích jde o krvežíznivé válečníky, kteří útočí z křídel Umbarské armády. Ještě děsivější je setkáním se Zjizvenými na moři, kde jediná spása je vrhnout se do vln. V časech míru dohlíží Zjizvení nad zápasnickými jámami a střeží hradební hlásky severovýchodu města. Nejsnadněji se vojáci poznají podle kopí s dlouhým hrotem z jedné strany opatřeným pilkou, aby zbraň působila co nejbolestivější zranění. Velitelé chodí oděni čistě v kombinacích červené.
  sk:
    name: Umbar
    tagline: Korzári Umbaru — čierne plachty, soľ južných morí a krv na čepeli.
    combat_style:
      - lehčí pěchota
      - šavle, dýky, krátké meče
      - boj jeden na jednoho i ve dvojicích
      - hbití nájezdníci
    recommended_for:
      - hráči, kteří mají rádi piráty, korzáry a námořní motivy
      - hráči se zájmem o roleplay nájezdníků a žoldnéřů Stínu
      - hráči, kteří mají rádi pestrý kostým bez plné zbroje
    not_recommended_for:
      - hráči, kteří chtějí jen masivní pěchotní bitvy
      - úplní nováčci bez kostýmového základu
    tags:
      - síla temného pána
      - moře a jih
      - střední kostýmová náročnost
      - korzáři a nájezdníci
    newbie_costume_hint: Vrstvená košile, šerpa, vesta s mosaznými knoflíky, šátek na hlavě. Šavle nebo dýka. Vyhraj se s detaily — náušnice, řetízky, opasek se sponou. Mořská modř i krvavá rudá.
    camp_hook: Tábor Umbaru voní solí, dehtem a vínem. Mapy s vyznačenými přístavy, kostky házené o cizí lodě, hrdé řeči o tom, komu vlajka padla pod čepel.
    costume_colors_text: 'fialová, šedá, černá; sekundárně červená, modrá, bílá, stříbrné zdobení'
    heraldry_text: 'Vlastní umbárské znaky; vhodné motivy korzárů, černých plachet, moře, lodí, kotev, šavlí a jižních přístavů.'
    ruler:
      name: Korzárský kapitán
      title: Pán černých plachet a slaného vína
      description: Námořník, lupič i diplomat. Nevěří přísahám, jen zlatu a vlastní čepeli — a Saurona si bere za partnera, dokud je to výhodné. Hráč Umbaru vidí kapitána u stolu s mapou, házet kostkami o cizí lodě a smát se příliš nahlas.
    lore_sections:
      - title: Stylizace kostýmu
        paragraphs:
          - "Kostým Umbarské vojáka je de facto ‚univerzálním‘ lidským kostýmem, s\_přihlédnutím k\_tomu, že Umbar je město ležící v\_teplém přímořském klimatu a na moři jeho válečníci stráví většinu života. Oděvy jsou tedy voleny z\_lehkých materiálů, kombinovaných s\_nepromokavými svrchními vrstvami. Podrobněji doporučujeme text níže."
      - title: Historie Umbaru
        paragraphs:
          - Umbar byl kdysi přístavem, kde poprvé přistáli Númenorejci, starý lidský rod, žijící na ostrově Númenor, než se z vůle Valar potopil. Nejslavnějším a posledním, mezi númenorejskými krály byl ArPharazon, který odpadl od víry ve Valar a v boji porazil samotného Saurona a odvlekl jej do zajetí.
          - V pozdějších dnech se stal Umbar sídlem Černých Númenorejců, kteří jsou přímými potomky lidu, který s Ar-Pharazonem opustil ostrov Númenor. Neuctívali již dále Valar, ale upadli k uctívání Morgotha, jim známého, jako Melkor, pána Prázdnoty, ze závisti vůči Prvorozeným, elfům, kteří byli narozdíl od nich nesmrtelní. Černí Númenorejci byli v následujících stoletích poraženi a vyhnáni lidem Gondoru, který Umbar několikrát obsadil, aby jej zase několikrát ztratil v bojích s Haradem, ležícím na jihovýchod. K Umbaru pod nadvládou Númenorejců a jejich pokračovatelů patřilo i několik provincií na jihu, na pobřeží Haradu. Říká se, že krev Černého Númenoru přežila mezi některými vládci Haradu a že Númenorejská kultura, narozdíl od Númenorejské krve, přežila zase mezi některými vznešenými rodinami Umbaru.
          - Současnými pány Umbaru jsou Umbarští korzáři. Míšený lid, z části Haradské, z části Gondorské a z malé části snad Númenorejské krve, kteří svoje služby prodávají pánům Haradu, nebo sledují vlastní cíle a plení pobřeží Středozemě.
          - Umbarští vládci pronajímají služby svých korzárů tomu, kdo lépe platí. V době Války o Prsten byli většinou ve službách Haradu, jako převozníci vojska, nebo přímo bojová síla. Lid Umbaru užírá vrozená nenávist ke Gondorskému království, jelikož jemu dávají za vinu mnoho příkoří a ponížení, jichž se mu dostalo v uplynulých letech. Umbarští opovrhují skřety pro jejich ošklivost, nedisciplinovanost a podlézavou podřízenost.
      - title: Náboženství, kultura a společnost
        paragraphs:
          - "Jako jejich první předkové, Númenorejci, lid Umbaru nevěří ve světlo Valar, ale obrátil se k uctívání Saurona. Mezi vzdělanějšími a vznešenějšími se udržuje krvavý kult Prázdnoty, uctívajícího nepřítele Valar, Melkora / Morgotha. Tento kult se opět objevil teprve nedávno, v čase, kdy se začali vyčleňovat první Královi muži, nicméně s\_pádem Saurona rychle nabírá na síle."
          - Původní Númenorejská kultura se až na drobné střípky, které ještě navíc byly překrouceny k nepoznání (uplynulo od té doby již několik tisíc let…), v Umbaru nezachovala. Umbarská kultura je tak směsicí Haradské, Gondorské a jiných kultur. Dominantním prvkem je snaha reprezentovat co nejlépe sebe a svoji rodinu. Lid Umbaru je hrdý a pokud mohou, nosí jeho lidé drahé oděvy a šperky, často zdobné motivy mořských živočichů a bájných příšer. K ostatním lidem se chovají povýšeně, natož pak ke skřetům a jiným nižším bytostem. Nejváženější jsou vládci urozených rodů a potom kapitáni lodí. Každý kapitán je neomezeným pánem na své lodi a jeho slovo je zákon.
          - Neexistuje nic, jako jednotná Umbarská móda, nebo univerzální kód společenského chování. Každá městská čtvrť žije svébytnou módou a kulturou a každý rod a každý kapitán může diktovat právo podle svojí vlastní vůle. Zachovalo se ale několik zvyků ze starých dob, jejichž význam zná již jen málokdo. Při společenských příležitostech ve slušné společnosti je tak například vrcholem nevychovanosti vystavovat nezakrytou tvář. Umbarská smetánka tak nosí propracované masky roztodivných vzorů a z rozličných materiálů, které jsou pro náhodné návštěvníky města vždy předmětem údivu. Z podobně neznámých důvodů někteří bojovníci chodí do boje s tváří zakrytou maskami, které naopak vzbuzují spíše odpor a hrůzu. Původní význam obou zvyků se již dávno ztratil v tisíciletích míšení kultur a neutuchajících bojů o tento přístav.
          - Dalším zvykem je svatost osobního souboje mezi Umbarskými měšťany i šlechtou. Každý Umbarský má právo vyzvat na souboj kteréhokoli jiného a do jejich duelu nesmí nikdo jiný zasáhnout. Nezřídka se to stává i na bitevním poli, kdy kapitáni vyzývají na souboj velitele nepřátelských jednotek. Ani do takového souboje nikdo z Umbařanů nezasáhne a nepřátelská síla tak již několikrát byla odvedena do otroctví, aniž by došlo k větším ztrátám na životech. Mezi kapitány platí podobný zvyk. Nevyřízené účty a vzájemné neshody řeší kapitáni lodí soubojem na biče, dokud jeden z nich neztratí vědomí, nebo ze souboje neodstoupí.
          - Umbarské výsostné znaky se používají pouze v časech míru a ve válce používány nejsou. Na drancovací výpravě a ve válce jednotlivé lodě, flotily a kapitáni volí symbol podle vlastních preferencí. Můžeme tak narazit na motivy různých ryb, žraloků, chobotnic, mořských ježků, lastur a ulit. Některé můžou působit až bizarně, jako například loď, nesoucí označení „Plamenný hlemýžď“. Jedinými dvěma symboly, které se táhnou skrz celou armádu, jsou Mořský had a dříve Oko bez víčka v různých kombinacích. Královi muži s oblibou do heraldiky přidávají ještě Númenorejskou korunu, případně Morgothovu korunu ozdobenou Silmarilly.
      - title: Armáda, výzbroj a výstroj
        paragraphs:
          - V časech míru jsou páteří vojenské síly přístavu a kolonií lidové milice, které se dělí do mnoha jednotek a uskupení, podle příslušnosti k městské čtvrti, odkud pocházejí a podle úkolů, které jim svěřili vládci města. Ve válce se z většiny milicionářů stávají Umbarští korzáři.
          - Výstroj i výzbroj zůstává stejná, často jsou dokonce i stejně děleni do jednotek, ale podřízeností přecházejí pod kapitány válečných korábů. Výstroj a výzbroj milice i korzárů je lehká, uzpůsobená rychlým přesunům a boji na otevřeném moři. Řadí se do velkých jednotek bojovníků s kopím, nebo píkou, které jsou na křídlech podporovány střelci z kuší. Jako poboční zbraně jim slouží haradské šavle, nebo masivní tesáky s jílci tvarovanými do podoby bájných mořských oblud.
          - V oblékání se jednotlivé jednotky milice můžou různit, ale části výstroje jsou vždycky shodné. Široké kalhoty, zastrčené do bot, většinou červené, modré nebo šedé barvy. Spodní košile tmavé barvy, přes kterou je kaftan po kolena v barvách jednotky a tmavý nepromokavý kabát bez rukávů v délce kaftanu. Jako pokrývka hlavy slouží helmice z tvrdé kůže. Dalším prvkem zbroje jsou pak už jen nátepníky. Kaftan je přepásán minimálně dvěma pásky, jedním zdobeným, na kterém je zavěšená poboční zbraň a druhým prostým, užitkovým.
          - Veliteli Umbarských korzárů jsou v čase války buďto námořní kapitáni, nebo relativně nedávno vzniklá skupina Králových mužů. Jsou to povětšinou členové jednoho z výše postavených rodů, nebo kapitáni, či jejich původ není známý. S jejich vznikem se pojí oživení kultu Melkora a snaha o návrat k „tradicím“ Černého Númenoru. Oděním a výzbrojí se Královi muži výrazně odlišují od zbytku Umbarských sil a i jeden od druhého. Zdá se, že sjednocujícím prvkem v jejich vzezření je pouze používání dlouhých kabátců a suknic, výrazně těžší zbroje, než je mezi korzáry typické a bizarně tvarovaných kožených čapek, stylizovaných do podoby bájných mořských oblud. Ve výzbroji mohou mít jakoukoli zbraň, ale zjevně preferují kopí a píky v kombinaci s pobočními šavlemi haradského typu. Někteří používají dlouhé meče a těm se přezdívá Hlubinní ještěři.
          - Do bitvy nastupují s tváří krytou maskou, která v protivnících vzbuzuje hrůzu. Nemají žádné jednotné velení a zdá se, že si jsou mezi sebou rovni. Nějakou formu subordinace si vytvářejí jen pro potřeby konkrétní bitvy a ta s koncem bojů zaniká také. Když Králův muž v boji padne, jeho druhové se snaží jeho tělo odtáhnout, aby nepadlo do rukou nepřítele. Udržují si tím kult neporazitelných bojovníků.
          - Královi muži jsou také středobodem kultu Melkora mezi Umbarskými vojáky. Bývají mimo boj zachmuření, tiší a na vřejnosti nikdy neodhalují celou tvář, místo toho obličej halí krásnou maskou rozličného vzezření.
          - Další výrazně odlišnou společenskou skupinou jsou Nositelé Pravdy. Vznik tohoto uskupení v městě Umbaru není přesně datován a je částečně zahalen tajemstvím a legendami. Pravdou však zůstává, že jak se opětovně začal šířit kult Melkora mezi lidem Umbaru, začaly se objevovat zvěsti o záhadných válečnících s dlouhými meči, napomáhajících uctívačům toho kultu. Z počátku znělo v ulicích a putykách města, že je snazší spatřit bájného Hlubinného ještěra, než jednoho z oněch válečníků a byli právě proto hanlivě označováni Hlubinnými Ještěry. Jednoho dne však Nositelé Pravdy vyšli do ulic a kazatelé Melkorova kultu začali mezi elitou Umbaru veřejně provádět rituály v jeho jménu. Toho dne záhadně zmizelo velké množství občanů města, kteří nejhlasitěji pochybovali o Hlubinných Ještěrech. Od toho dne lid Umbaru chová Nositele Pravdy ve velké bázni a úctě, ač je nepřestal nazývat Hlubinnými Ještěry.
          - V boji tito válečníci bojují jako členové Králových mužů. V čase míru pomáhají Melkorovým kněžím, kde je třeba. Pro kapitány korzárských lodí je velkou ctí, když je na jejich výpra ě doprovází jeden z Hlubinných Ještěrů.
          - Inspirace pro jednotlivé části milice a korzáry
      - title: Stráže vnějších bran města
        paragraphs:
          - Někdy také označováni, jako Dveřníci. Do očí by jim to samozřejmě nikdy nikdo neřekl. Jsou verbování z chatrčí vnějšího města Umbaru a k vodě mají ze všech umbarských nejdál. Velitelé se od svých mužů příliš neliší, protože pocházejí z jejich řad, vyznačují se pouze důtkami, nebo karabáčem za pasem, který slouží jako odznak hodnosti a případně jako užitečná pomůcka na nové odvedence strážců bran. V bojích jsou tyto jednotky většinou na špici útoku, nebo v samém centru obranné linie. Jejich neochota ustupovat je v celém městě známá. Každý ze strážců bran totiž ví, že cokoliv je lepší jak se vrátit do chatrčí vnějšího města. V čase míru, jak už název napovídá, hlídají patroly Dveřníků vnější brány mešta a kontrolují, co a koho se kdo snaží převést do vnitřního města. Jejich typickou barvou je černá.
      - title: Strážci přístavu
        paragraphs:
          - Elita umbarské milice. Jsou to synové a dcery umbarských kapitánů a vlastníků lodí, na které se již nedostalo při dědictví kapitánského postu. Jejich velitelem je Strážce umbarského majáku, jeden z Králových mužů. V boji používají dlouhé harpuny a stejně jako jejich zástava je zdobena mořským hadem, tak samotní členové strážců přístavu k této tématice velmi tíhnou. Většinou bojují po boku Králových mužů a starají se o bezpečí obou křídel této elity Umbaru. V čase míru stráží přistav a kontrolují, co jaká loď přiváží. Jejich barvou je fialová.
      - title: Stráž severovýchodních hlásek
        paragraphs:
          - Nikdo je však pod tímto jménem nezná. Všichni této jednotce neřeknou jinak než Zjizvení. Někdo tvrdí, že je to proto, že kdo se chce stát velitelem Zjizvených, musí vyhrát zápas v klecích severovýchodního města. Odtud je také milice verbována. V bojích jde o krvežíznivé válečníky, kteří útočí z křídel Umbarské armády. Ještě děsivější je setkáním se Zjizvenými na moři, kde jediná spása je vrhnout se do vln. V časech míru dohlíží Zjizvení nad zápasnickými jámami a střeží hradební hlásky severovýchodu města. Nejsnadněji se vojáci poznají podle kopí s dlouhým hrotem z jedné strany opatřeným pilkou, aby zbraň působila co nejbolestivější zranění. Velitelé chodí oděni čistě v kombinacích červené.
